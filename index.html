<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Latin Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Latin Lab</title>
<style>
:root{--bg:#f7f4ec;--ink:#1d2129;--mute:#6b6f78;--line:#ddd6c6;--card:#fffdf8;--acc:#8a2b2b;--ok:#2f6b4a;--bad:#a23b2a;--okbg:#e8f2ec;--badbg:#f8e8e3;--chip:#efe9da}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0;letter-spacing:.02em;font-weight:600}
h2{font-size:20px;margin:0 0 8px;font-weight:600}
h3{font-size:13px;margin:22px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-family:system-ui,sans-serif}
p{line-height:1.55;margin:8px 0}
.mute{color:var(--mute)}
.sans{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:12px 0}
.eyebrow{font:600 11px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 15px system-ui,sans-serif}
.btn:hover{background:#000}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--chip)}
.btn[disabled]{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font:13px system-ui,sans-serif;padding:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lat{font-size:28px;line-height:1.35;letter-spacing:.01em;margin:6px 0 10px}
.lat.big{font-size:44px;text-align:center;margin:10px 0}
.lat .m{color:var(--acc);font-weight:700}
.lat .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--ink);margin:0 2px}
.en{font-style:italic;color:var(--mute);margin:0 0 14px}
.eq{text-align:center;font-size:22px;color:var(--mute)}
.emo{text-align:center;font-size:38px}
.pair{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:14px 0}
.pair .lat{margin-bottom:0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:17px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font:600 12px system-ui,sans-serif;color:var(--mute);width:18px;flex:none}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px;line-height:1.5}
.fb.ok{background:var(--okbg);color:#1d4a33}
.fb.bad{background:var(--badbg);color:#6e2619}
.fb .lat{font-size:22px;margin:4px 0}
.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.words{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.wbtn{font-size:26px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink)}
.wbtn:hover:not([disabled]){border-color:var(--ink)}
.wbtn.right{background:var(--okbg);border-color:var(--ok)}
.wbtn.wrong{background:var(--badbg);border-color:var(--bad)}
.wbtn .m{color:var(--acc);font-weight:700}
.slot{min-height:58px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin:14px 0 10px}
.tile{font-size:20px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink)}
.tile:hover{border-color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;margin:10px 0 16px}
input[type=text]{font:22px Georgia,serif;width:100%;max-width:340px;padding:10px 12px;border:1px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{min-width:90px}
.stat b{display:block;font-size:26px;font-weight:600}
.stat span{font:12px system-ui,sans-serif;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:14px system-ui,sans-serif;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--mute);border:1px solid var(--line)}
.chip.s0{background:#fff;color:#aaa;border-style:dashed}
.chip.s1,.chip.s2{background:#f3e7d1;color:#6a5424}
.chip.s3,.chip.s4{background:#e2ecd9;color:#335a25}
.chip.s5,.chip.s6{background:#cfe5d6;color:#1c4a30}
.hz{filter:blur(3.5px);user-select:none}
.hzbox{font-size:22px;line-height:1.5;margin:10px 0}
.need{font:13px system-ui,sans-serif;color:var(--mute);line-height:1.5}
.lock{opacity:.55}
.story .sent{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.story .sent:last-child{border:0}
.story .sent .t{font-style:italic;color:var(--mute);font-size:16px;margin-top:2px;visibility:hidden}
.story .sent.show .t{visibility:visible}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:14px system-ui,sans-serif;padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl{border-collapse:collapse;margin:12px 0;font-size:20px}
.tbl td,.tbl th{padding:6px 18px 6px 0;text-align:left}
.tbl th{font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tbl .m{color:var(--acc);font-weight:700}
.hint{font:14px system-ui,sans-serif;color:var(--mute);margin-top:8px}
.spk{background:var(--chip);border:1px solid var(--line);border-radius:999px;font-size:16px;line-height:1;padding:6px 10px;margin-left:8px;vertical-align:middle;color:var(--ink)}
.spk:hover{border-color:var(--ink)}
.spk.bigbtn{font-size:40px;padding:18px 26px;display:block;margin:12px auto}
.abox{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.abox .asvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wbtn.sel{border-color:var(--acc);box-shadow:0 0 0 2px #8a2b2b33}
textarea,input.own{font:16px Georgia,serif;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font:15px system-ui,sans-serif}
.tog:last-child{border:0}
.tog button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:14px system-ui,sans-serif}
.tog button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font:600 11px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--mute);border-radius:6px;padding:2px 7px;margin-left:6px}


.hzw{display:inline-block;margin-right:.35em}
.hzw.known{color:var(--ok);filter:none;font-weight:600}
.hzw.hz{filter:blur(3.5px);user-select:none}
.gloss{font:13px system-ui,sans-serif;color:var(--mute);margin-top:6px;line-height:1.5}
.chart{border-collapse:collapse;margin:10px 0;width:100%}
.chart th{font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 8px 6px 0}
.chart td{padding:9px 8px 9px 0;border-top:1px solid var(--line);font-size:20px;vertical-align:middle}
.chart td.c{font:14px system-ui,sans-serif;color:var(--mute);width:34%}
.chart .m{color:var(--acc);font-weight:700}
.chart .un{color:#b9b3a3;font-size:15px}
.note{background:#fbf3df;border:1px solid #e6d7ae;border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.5;font-size:15px}
.rule{background:var(--chip);border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.55}
select.vsel{font:15px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}

</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
'use strict';
/* =====================================================================
   LATIN LAB — prototype 1.0
   0.9: Unit 12 (imperfect tense: amābat / amābant / erat; the pronoun is / ea / id: he, she, it, eius, eī, eō, eōs ...).
   0.8: Unit 11 (praised / seen participles, was praised, ā + agent, the ablative absolute, -īs / -ibus).
   0.7: Unit 10 (infinitives: amāre, dēbet + infinitive, and indirect speech: dīcit puellam bonam esse).
   0.6: Unit 8 (I / you / we: person endings, present and past, and the pronouns ego, tu, nos, vos) and
        Unit 9 (omnis, pars, tres, divisus, and Caesar's first sentence).
   0.5: Unit 6 (third declension: rex / regem, -is, -ī, -e, -ēs, neuter flumen, fortis / forte) and
        Unit 7 (the past tense: amat → amāvit, -ērunt, odd pasts).
   0.4: Unit 4 (second declension: -us/-um, -ī, -ō, plurals, neuter words,
   describing words in all three genders) and Unit 5 (ad / ex / in, in vs into).
   core.js holds only pure data and helpers so the audio build can reuse it.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const uniqBy=(a,f)=>{const s=new Set();return a.filter(x=>{const k=f(x);if(s.has(k))return false;s.add(k);return true})};
const DAY=864e5;
const AC='\u0101';                                   // ā

/* ---------- vocabulary ----------
   d  = noun class: a (puella), us (amicus), um (oppidum, neuter), c3 (rex), n3 (flumen, neuter)
   st = stem respelled for an Italian-voice reading (accent mark = Latin stress); snom = respelled doer form (third declension)
   Verbs: pr = present [I, you, he/she, we, you all, they]; pa = past, same order; sp = their 12 respellings
   Adjectives: po = only used in the plural (tres); so = only with things, not people, in the singular (omnis); ao = only with living things */
const IC='\u012b',OC='\u014d',EC='\u0113';           // ī ō ē
const PERS=['1s','2s','3s','1p','2p','3p'];
const PERLEM={'1s':'ego','2s':'tu','1p':'nos','2p':'vos'};
const deac=s=>s.replace(/[àèéìòù]/g,m=>({'à':'a','è':'e','é':'e','ì':'i','ò':'o','ù':'u'}[m]));
const c1f=s=>({pr:[s+'ō',s+'ās',s+'at',s+'āmus',s+'ātis',s+'ant'],pa:[s+'āvī',s+'āvistī',s+'āvit',s+'āvimus',s+'āvistis',s+'āvērunt']});
const c1s=st=>{const d=deac(st);return[st+'o',d+'às',st+'at',d+'àmus',d+'àtis',st+'ant',d+'àwi',d+'awìsti',d+'àwit',d+'àwimus',d+'awìstis',d+'awèrunt']};
const vb=(o,f,sp)=>Object.assign(o,{pr:f.pr,pa:f.pa,pl:f.pr[5],pf:f.pa[2],pfp:f.pa[5],sp});
const VOC={
  puella:{en:'girl',pos:'n',d:'a',g:'f',anim:1,emo:'👧',stem:'puell',st:'puèll'},
  poeta:{en:'poet',pos:'n',d:'a',g:'m',anim:1,emo:'✍️',stem:'poet',st:'poét'},
  agricola:{en:'farmer',pos:'n',d:'a',g:'m',anim:1,emo:'🧑‍🌾',stem:'agricol',st:'agrìkol'},
  nauta:{en:'sailor',pos:'n',d:'a',g:'m',anim:1,emo:'⛵',stem:'naut',st:'nàut'},
  rosa:{en:'rose',pos:'n',d:'a',g:'f',anim:0,emo:'🌹',stem:'ros',st:'ròs'},
  casa:{en:'house',pos:'n',d:'a',g:'f',anim:0,emo:'🏠',stem:'cas',st:'kàs'},
  amicus:{en:'friend',pos:'n',d:'us',g:'m',anim:1,emo:'🧑‍🤝‍🧑',stem:'am\u012bc',st:'amìk'},
  lupus:{en:'wolf',enpl:'wolves',pos:'n',d:'us',g:'m',anim:1,emo:'🐺',stem:'lup',st:'lùp'},
  dominus:{en:'master',pos:'n',d:'us',g:'m',anim:1,emo:'👑',stem:'domin',st:'dòmin'},
  equus:{en:'horse',pos:'n',d:'us',g:'m',anim:1,emo:'🐴',stem:'equ',st:'èkw'},
  oppidum:{en:'town',pos:'n',d:'um',g:'n',anim:0,emo:'🏘️',stem:'oppid',st:'òppid'},
  donum:{en:'gift',pos:'n',d:'um',g:'n',anim:0,emo:'🎀',stem:'d\u014dn',st:'dòn'},
  templum:{en:'temple',pos:'n',d:'um',g:'n',anim:0,emo:'🏛️',stem:'templ',st:'tèmpl'},
  bellum:{en:'war',pos:'n',d:'um',g:'n',anim:0,emo:'⚔️',stem:'bell',st:'bèll'},
  rex:{en:'king',pos:'n',d:'c3',g:'m',anim:1,emo:'🤴',stem:'r\u0113g',nom:'rex',st:'règh',snom:'rèks'},
  miles:{en:'soldier',pos:'n',d:'c3',g:'m',anim:1,emo:'🪖',stem:'m\u012blit',nom:'miles',st:'mìlit',snom:'mìles'},
  dux:{en:'leader',pos:'n',d:'c3',g:'m',anim:1,emo:'🎖️',stem:'duc',nom:'dux',st:'dùk',snom:'dùks'},
  homo:{en:'man',enpl:'men',pos:'n',d:'c3',g:'m',anim:1,emo:'🧍',stem:'homin',nom:'homo',st:'hòmin',snom:'hòmo'},
  urbs:{en:'city',enpl:'cities',pos:'n',d:'c3',g:'f',anim:0,emo:'🌆',stem:'urb',nom:'urbs',st:'ùrb',snom:'ùrps'},
  mons:{en:'mountain',pos:'n',d:'c3',g:'m',anim:0,emo:'⛰️',stem:'mont',nom:'mons',st:'mònt',snom:'mòns'},
  pars:{en:'part',pos:'n',d:'c3',g:'f',anim:0,emo:'🧩',stem:'part',nom:'pars',st:'pàrt',snom:'pàrs'},
  Caesar:{en:'Caesar',pos:'n',d:'c3',g:'m',anim:1,prop:1,sg:1,emo:'🏛️',stem:'Caesar',nom:'Caesar',st:'kàissar',snom:'kàissar'},
  nuntius:{en:'messenger',pos:'n',d:'us',g:'m',anim:1,emo:'📜',stem:'n\u016bnti',st:'nùnti'},
  flumen:{en:'river',pos:'n',d:'n3',g:'n',anim:0,emo:'🏞️',stem:'fl\u016bmin',nom:'flumen',st:'flùmin',snom:'flùmen'},
  exercitus:{en:'army',enpl:'armies',pos:'n',d:'u4',g:'m',anim:1,pron:'it',emo:'\uD83E\uDE96',stem:'exercit',st:'eksèrkit'},
  impetus:{en:'attack',pos:'n',d:'u4',g:'m',anim:0,emo:'\uD83D\uDCA5',stem:'impet',st:'ìmpet'},
  manus:{en:'hand',enpl:'hands',pos:'n',d:'u4',g:'f',anim:0,emo:'\u270B',stem:'man',st:'màn'},
  res:{en:'thing',pos:'n',d:'e5',g:'f',anim:0,emo:'\uD83D\uDCE6',stem:'r',st:'r',
    spo:{nom_s:'rès',gen_s:'rèi',dat_s:'rèi',acc_s:'rèm',abl_s:'rè',nom_p:'rès',acc_p:'rès',dat_p:'rèbus',abl_p:'rèbus'}},
  fides:{en:'loyalty',pos:'n',d:'e5',g:'f',anim:0,sg:1,emo:'\uD83E\uDD1D',stem:'fid',st:'fìd',
    spo:{nom_s:'fìdes',gen_s:'fìdei',dat_s:'fìdei',acc_s:'fìdem',abl_s:'fìde'}},
  corpus:{en:'body',enpl:'bodies',pos:'n',d:'n3',g:'n',anim:0,emo:'🫀',stem:'corpor',nom:'corpus',st:'kòrpor',snom:'kòrpus'},
  amat:vb({en:'loves',enp:'love',enpf:'loved',pos:'v',fr:'T',plOK:1,emo:'❤️',q:['Who loves?','Who is loved?'],gest:'put a hand on your heart'},c1f('am'),c1s('àm')),
  videt:vb({en:'sees',enp:'see',enpf:'saw',pos:'v',fr:'T',plOK:1,emo:'👁️',q:['Who sees?','Who is seen?'],gest:'point two fingers from your eyes'},
    {pr:['videō','vidēs','videt','vidēmus','vidētis','vident'],pa:['vīdī','vīdistī','vīdit','vīdimus','vīdistis','vīdērunt']},
    ['uìdeo','uidès','uìdet','uidèmus','uidètis','uìdent','uìdi','uidìsti','uìdit','uìdimus','uidìstis','uidèrunt']),
  audit:vb({en:'hears',enp:'hear',enpf:'heard',pos:'v',fr:'U',plOK:0,emo:'👂',q:['Who hears?','Who is heard?'],gest:'cup a hand behind your ear'},
    {pr:['audiō','audīs','audit','audīmus','audītis','audiunt'],pa:['audīvī','audīvistī','audīvit','audīvimus','audīvistis','audīvērunt']},
    ['àudio','audìs','àudit','audìmus','audìtis','àudiunt','audìwi','audiwìsti','audìwit','audìwimus','audiwìstis','audiwèrunt']),
  laudat:vb({en:'praises',enp:'praise',enpf:'praised',pos:'v',fr:'T',plOK:1,emo:'👏',q:['Who praises?','Who is praised?'],gest:'give a small clap'},c1f('laud'),c1s('làud')),
  portat:vb({en:'carries',enp:'carry',enpf:'carried',pos:'v',fr:'T',plOK:1,emo:'🎒',q:['Who carries?','Who is carried?'],gest:'lift both arms as if carrying a box'},c1f('port'),c1s('pòrt')),
  vocat:vb({en:'calls',enp:'call',enpf:'called',pos:'v',fr:'T',plOK:1,emo:'📣',q:['Who calls?','Who is called?'],gest:'cup your hands round your mouth'},c1f('voc'),c1s('uòk')),
  dat:vb({en:'gives',enp:'give',enpf:'gave',pos:'v',fr:'D',plOK:1,emo:'🎁',gest:'hold out a hand, palm up'},
    {pr:['dō','dās','dat','damus','datis','dant'],pa:['dedī','dedistī','dedit','dedimus','dedistis','dedērunt']},
    ['do','dàs','dat','dàmus','dàtis','dant','dèdi','dedìsti','dèdit','dèdimus','dedìstis','dedèrunt']),
  ambulat:vb({en:'walks',enp:'walk',enpf:'walked',pos:'v',fr:'C',plOK:1,emo:'🚶',gest:'“walk” two fingers across the table'},c1f('ambul'),c1s('àmbul')),
  est:vb({en:'is',enp:'are',enpf:'was',pos:'v',fr:'E',plOK:1,emo:'＝'},
    {pr:['sum','es','est','sumus','estis','sunt'],pa:['fuī','fuistī','fuit','fuimus','fuistis','fuērunt']},
    ['sum','es','est','sùmus','èstis','sunt','fùi','fuìsti','fùit','fùimus','fuìstis','fuèrunt']),
  debet:vb({en:'must',enp:'must',enpf:'had to',pos:'v',fr:'M',plOK:1,emo:'⚠️',gest:'point a finger firmly down'},
    {pr:['dēbeō','dēbēs','dēbet','dēbēmus','dēbētis','dēbent'],pa:['dēbuī','dēbuistī','dēbuit','dēbuimus','dēbuistis','dēbuērunt']},
    ['dèbeo','dèbes','dèbet','debèmus','debètis','dèbent','dèbui','debuìsti','dèbuit','dèbuimus','debuìstis','debuèrunt']),
  dicit:vb({en:'says',enp:'say',enpf:'said',pos:'v',fr:'Q',plOK:1,emo:'💬',gest:'tap your lips twice'},
    {pr:['dīcō','dīcis','dīcit','dīcimus','dīcitis','dīcunt'],pa:['dīxī','dīxistī','dīxit','dīximus','dīxistis','dīxērunt']},
    ['dìko','dìkis','dìkit','dìkimus','dìkitis','dìkunt','dìksi','diksìsti','dìksit','dìksimus','diksìstis','diksèrunt']),
  putat:vb({en:'thinks',enp:'think',enpf:'thought',pos:'v',fr:'Q',plOK:1,emo:'💭',gest:'tap your forehead'},c1f('put'),c1s('pùt')),

/* ---------- Italian-voice respelling (for neural clips and device voices) ----------

const RSUF={

  us:{s:{nom:'us',gen:'i',dat:'o',acc:'um',abl:'o'},p:{nom:'i',acc:'os',dat:'is',abl:'is'}},
  um:{s:{nom:'um',gen:'i',dat:'o',acc:'um',abl:'o'},p:{nom:'a',acc:'a',dat:'is',abl:'is'}},
  c3:{s:{nom:'',gen:'is',dat:'i',acc:'em',abl:'e'},p:{nom:'es',acc:'es',dat:'ibus',abl:'ibus'}},
  n3:{s:{nom:'',gen:'is',dat:'i',acc:'',abl:'e'},p:{nom:'a',acc:'a',dat:'ibus',abl:'ibus'}},
  i3:{s:{nom:'is',gen:'is',dat:'i',acc:'em',abl:'i'},p:{nom:'es',acc:'es',dat:'ibus',abl:'ibus'}},
  e3:{s:{nom:'e',gen:'is',dat:'i',acc:'e',abl:'i'},p:{nom:'ia',acc:'ia',dat:'ibus',abl:'ibus'}},
  u4:{s:{nom:'us',gen:'us',dat:'ui',acc:'um',abl:'u'},p:{nom:'us',acc:'us',dat:'ibus',abl:'ibus'}},
  e5:{s:{nom:'es',gen:'ei',dat:'ei',acc:'em',abl:'e'},p:{nom:'es',acc:'es',dat:'ebus',abl:'ebus'}}

const SPELL={};
NOUNS.forEach(n=>ENDKEYS.forEach(([c,num])=>{
  if(VOC[n].sg&&num==='p')return;
  const irreg=VOC[n].snom&&num==='s'&&(c==='nom'||(VOC[n].d==='n3'&&c==='acc'));
  SPELL[nf(n,c,num)]=(VOC[n].spo&&VOC[n].spo[c+'_'+num])||(irreg?VOC[n].snom:VOC[n].st+RSUF[VOC[n].d][num][c]);
}));
ADJS.forEach(a=>['f','m','n'].forEach(g=>adjKeys(a).forEach(([c,num])=>{SPELL[nf(a,c,num,g)]=VOC[a].st+RSUF[acls(a,g)][num][c]})));

SPELL.pulcher='pùlker';
VERBS.forEach(v=>{VOC[v].pr.forEach((f,i)=>{SPELL[f]=VOC[v].sp[i]});VOC[v].pa.forEach((f,i)=>{SPELL[f]=VOC[v].sp[6+i]})});

SJV.forEach(v=>{const V=VOC[v];[['sj','sjsp'],['isj','isjsp'],['psj','psjsp']].forEach(([a,b])=>V[a].forEach((f,i)=>{SPELL[f]=V[b][i]}))});
RLS.forEach(r=>Object.keys(VOC[r].f).forEach(k=>{SPELL[VOC[r].f[k]]=VOC[r].sf[k]}));
CJS.forEach(x=>{SPELL[x]=VOC[x].sp[0]});
PREPS.forEach(p=>{SPELL[p]=VOC[p].sp[0]});
DMS.forEach(d=>Object.keys(VOC[d].f).forEach(k=>{SPELL[VOC[d].f[k]]=VOC[d].sf[k]}));

const SPELLN={};Object.keys(SPELL).forEach(k=>{SPELLN[norm(k)]=SPELLN[norm(k)]||SPELL[k]});   // lookup without macrons (lemmas like amicus, donum)
function itSpell(w){
  const x=String(w).normalize('NFC');

function deviceVoices(){try{const ss=window.speechSynthesis;return ss?ss.getVoices().filter(v=>/^it([-_]|$)/i.test(v.lang)):[]}catch(e){return[]}}
function voiceScore(v){let s=0;const n=v.name||'';
  if(/natural|neural/i.test(n))s+=6;if(/premium|enhanced|siri/i.test(n))s+=4;if(/online/i.test(n))s+=2;if(/google/i.test(n))s+=2;if(/it[-_]IT/i.test(v.lang))s+=1;return s}
function deviceVoice(){
  const vs=deviceVoices();if(!vs.length)return null;
  const want=S.opts.deviceVoice,hit=want&&vs.find(v=>v.voiceURI===want);
  return hit||vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
function effVoice(){
  const v=S.opts.voice;
  if(v==='off')return'off';
  if(v==='device')return deviceVoices().length?'device':'sara';
  return v==='nicola'?'nicola':'sara';
}

function auCtx(){
  if(AU.ctx)return AU.ctx;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  try{AU.ctx=new C()}catch(e){}return AU.ctx;
}
async function loadPack(v){
  const ctx=auCtx();if(!ctx)return;
  try{
    const r=await fetch('audio/'+v+'.pack');if(!r.ok)throw new Error('pack '+r.status);
    const buf=await r.arrayBuffer(),dv=new DataView(buf),hl=dv.getUint32(0,true);
    const hdr=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hl))),base=4+hl;
    await Promise.all(hdr.map(([k,off,len])=>new Promise(res=>{try{ctx.decodeAudioData(buf.slice(base+off,base+off+len),b=>{AU.buf[v][k]=b;res()},()=>res())}catch(e){res()}})));
  }catch(e){AU.packFailed=true;AU.loaded[v]=null}
}
function auLoad(v){
  if(AU.loaded[v])return AU.loaded[v];
  if(CLIPSET)return AU.loaded[v]=loadPack(v);
  const ctx=auCtx();
  if(!ctx||!CLIPS[v])return AU.loaded[v]=Promise.resolve();
  AU.loaded[v]=Promise.all(Object.entries(CLIPS[v]).map(([k,uri])=>new Promise(res=>{
    try{const b=atob(uri.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      ctx.decodeAudioData(u.buffer,buf=>{AU.buf[v][k]=buf;res()},()=>res())}catch(e){res()}})));
  return AU.loaded[v];
}
function stopAudio(){
  AU.srcs.forEach(s=>{try{s.stop()}catch(e){}});AU.srcs=[];
  try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}
}
function speakDevice(words,o){
  const ss=window.speechSynthesis;if(!ss)return;
  const txt=words.map(w=>itSpell(w).replace(/aj\b/g,'ai')).join(o.chant?', ':' ')+(words.length>1&&!o.chant?'.':'');
  const u=new SpeechSynthesisUtterance(txt),v=deviceVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang='it-IT';
  u.rate=o.chant?0.8:0.85;
  ss.speak(u);
}
async function say(words,o={}){
  const v=effVoice();
  if(v==='off'||!words||!words.length)return;
  stopAudio();
  if(v==='device')return speakDevice(words,o);
  await auLoad(v);
  const ctx=AU.ctx;if(!ctx)return;
  if(ctx.state==='suspended'){try{await ctx.resume()}catch(e){}}
  stopAudio();
  if(!words.some(w=>AU.buf[v][itSpell(w)])&&deviceVoices().length)return speakDevice(words,o);     // pack missing (offline, first run): fall back to the phone's own voice
  let t=ctx.currentTime+0.05;const gap=o.chant?0.45:0.12;
  words.forEach(w=>{const b=AU.buf[v][itSpell(w)];if(!b)return;const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(t);AU.srcs.push(s);t+=b.duration+gap});
}
const spk=(words,cls='',chant)=>`<button class="spk ${cls}" data-say="${esc(words.join(' '))}"${chant?' data-chant="1"':''} aria-label="Hear it">🔊</button>`;

  const v=effVoice();

    if(!AU.devUnlocked){AU.devUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u)}catch(e){}}

}

function verbsFor(fr,pl,inanO,t){

}

  });
  if(sp.frame==='SE'&&!sp.P.adj)a.add('w:'+sp.P.noun);
  if(!sp.per&&sp.n.S==='p'&&PLS.includes(sp.frame))a.add('r:pl');
  if(sp.n.O==='p'&&PLO.includes(sp.frame)&&!isPr(sp.O))a.add('r:accpl');
  if(sp.t==='pf'){a.add('r:perf');a.add('v:'+sp.v);if(sp.n.S==='p'&&!sp.per)a.add('r:perfpl')}

/* ---------- display helpers ---------- */
function hlLen(t){
  if(t.k==='rl'||t.k==='cj')return 0;
  if(t.k==='sj'){if(t.num==='p')return /(eant|iant)$/.test(t.w)?4:3;return /(eat|iat)$/.test(t.w)?3:2}
  if(t.k==='dm')return(t.c==='nom'&&t.num==='s')?0:t.w.length;
  if(t.k==='i')return t.t==='pf'?4:(t.n==='est'?0:3);
  if(t.k==='pr')return 0;
  if(t.k==='v'){
    if(t.per&&t.per!=='3s'&&t.per!=='3p'){if(t.n==='est')return 0;return(t.t==='pf'?{'1s':1,'2s':4,'1p':4,'2p':5}:{'1s':1,'2s':1,'1p':3,'2p':3})[t.per]}
    if(t.t==='im')return t.n==='est'?0:(t.num==='p'?4:3);
    if(t.t==='pf')return t.num==='p'?5:(/vit$/.test(t.w)?3:2);
    return(t.num==='p'&&t.n!=='est')?2:0;
  }
  if(t.k==='p')return 0;
  if(t.w==='pulcher')return 0;
  const cl=tokCls(t),e=ENDS[cl][t.num][t.c];
  if(cl==='a'){
    if(t.c==='nom'&&t.num==='s')return 0;
    if(t.num==='p')return 2;
    if(t.c==='acc')return hlEnd()?2:1;
    if(t.c==='abl')return 1;
    return 2;
  }
  if((cl==='c3'||cl==='n3')&&t.num==='s'&&(t.c==='nom'||(cl==='n3'&&t.c==='acc')))return 0;
  return e.length;                                   // other classes: highlight the whole ending
}
function hlWord(t,hl){
  const n=hl?hlLen(t):0;
  if(!n)return esc(t.w);
  return esc(t.w.slice(0,-n))+'<span class="m">'+esc(t.w.slice(-n))+'</span>';
}
const sentHTML=(ts,hl)=>ts.map(t=>hlWord(t,hl)).join(' ')+'.';
const sentText=ts=>ts.map(t=>t.w).join(' ')+'.';
const sayWords=ts=>ts.map(t=>t.w);
const sentLine=(ts,hl)=>`<div class="lat">${sentHTML(ts,hl)}${spk(sayWords(ts))}</div>`;
const B=x=>`<b>${x}</b>`;

const GW={f:'feminine',m:'masculine',n:'neuter'};
const E=(sp,s)=>{const e=endOf(sp[s],caseOf(sp,s),sp.n[s]);return e?B('-'+e):B('the doer form')};
function dmRem(n,c,num,sp){
  const w=B(nf(n,c,num)),V=B(n),he=dmEN(n,c,num),isP=num==='p';
  if(c==='nom')return isP?`${w} (“${he}”, from ${V}) is plural: it is the doer, and the verb ends in ${B('-nt')} too.`:`${w} is ${V}: “${he}”. It is the one who does it.`;
  if(c==='acc')return `${w} is the receiver form of ${V}: the one who gets the action is “${he}”.`;
  if(c==='gen')return `${w} is a form of ${V} that means “${he}” (of him / her / it). Beside a noun it says whose: “${he} ${enN(sp.O,sp.n.O)}”.`;
  if(c==='dat')return `${w} is a form of ${V} that means “to ${he}”: the verb is ${B(vf('dat',sp.n.S,sp.t))}, so ${he} ${isP?'receive':'receives'} it.`;
  return `${w} is a form of ${V} that means “${he}” after ${B(sp.prep)} (“${PREP_EN(sp)} ${he}”).`;
}
function prepRule(sp){
  if(isDm(sp.A))return dmRem(sp.A,sp.acase,sp.n.A||'s',sp);
  const nA=sp.n.A||'s',w=nf(sp.A,sp.acase,nA),e=B('-'+endOf(sp.A,sp.acase,nA)),p=B(sp.prep);
  switch(sp.prep){
    case'cum':return`${p} (“with”) is followed by the ablative, so ${B(w)} ends in ${e}.`;
    case'ad':return`${p} (“to”) is followed by the accusative, so ${B(w)} ends in ${e}.`;
    case'ex':return`${p} (“out of”) is followed by the ablative, so ${B(w)} ends in ${e}.`;
    default:return sp.acase==='acc'?`${p} + the accusative (${B(w)}, ${e}) means “into”: movement towards.`:`${p} + the ablative (${B(w)}, ${e}) means “in”: where something is.`;
  }
}
function tenseNote(sp){
  if(sp.t==='im')return` ${B(vf(sp.v,sp.n.S,'im'))} is the <b>imperfect</b> (“${enV(sp.v,sp.n.S,'im')}”): it describes what was going on, not a single event.`;
  if(sp.t!=='pf')return'';
  return` ${B(vf(sp.v,sp.n.S,'pf',sp.per))} is the past (“${enV(sp.v,sp.n.S,'pf',sp.per)}”): it already happened.`;
}
const PEND={pr:{'1s':'-ō','2s':'-s','1p':'-mus','2p':'-tis'},pf:{'1s':'-ī','2s':'-istī','1p':'-imus','2p':'-istis'}};
function persRule(sp){
  const w=vf(sp.v,sp.n.S,sp.t,sp.per),who=PRON_NOM[PERLEM[sp.per]];
  if(sp.v==='est')return`${B(w)} is a form of ${B('est')}: it means “${who} ${enV('est',sp.n.S,sp.t,sp.per)}”.`;
  return`${B(w)} ends in ${B(PEND[sp.t==='pf'?'pf':'pr'][sp.per])}, so the doer is ${B('“'+who+'”')}${sp.pd?' (no separate word is needed)':`; ${B(nf(sp.S,'nom'))} just says it again`}.`;
}
function remedyBase(m){
  if(isQ(m.sp.frame))return remedyQ(m);
  const sp=m.sp,w=s=>nf(sp[s],caseOf(sp,s),sp.n[s]),pl=s=>sp.n[s]==='p';
  const dS=VOC[sp.S].d,VE=B(sp.t==='pf'?'-'+EC+'runt':sp.t==='im'?'-bant':'-nt'),subjL=isPr(sp.S)?PRON_NOM[sp.S]:isDm(sp.S)?dmEN(sp.S,'nom',sp.n.S):the(sp.S);
  const Sc=sp.per?persRule(sp):isDm(sp.S)?dmRem(sp.S,'nom',sp.n.S,sp):pl('S')?`${B(w('S'))} ends in ${E(sp,'S')} and the verb ends in ${VE}, so ${the(sp.S,'p')} do it.`
          :dS==='a'?`${B(w('S'))} has no ending, so ${the(sp.S)} does it.`
          :(dS==='c3'||dS==='n3')?`${B(w('S'))} is the doer form, so ${the(sp.S)} does it.`
          :`${B(w('S'))} ends in ${E(sp,'S')}, the doer form, so ${the(sp.S)} does it.`;
  const adjs=['S','O'].filter(s=>sp.adj[s]).map(s=>` ${B(nf(sp.adj[s],caseOf(sp,s),sp.n[s],VOC[sp[s]].g))} matches ${B(w(s))} (${GW[VOC[sp[s]].g]}).`).join('');
  switch(sp.frame){
    case'SOV':{
      const neut=!isPr(sp.O)&&isNeutCls(VOC[sp.O].d)&&!pl('O');
      const Oc=isDm(sp.O)?dmRem(sp.O,'acc',sp.n.O,sp):isPr(sp.O)?`${B(w('O'))} is the receiver form of ${B(sp.O)}: the one who gets the action is “${PRON_ACC[sp.O]}”.`:pl('O')?(VOC[sp.O].d==='c3'
          ?`${B(w('O'))} ends in ${B('-'+EC+'s')}, which can mean many doers or many receivers. But ${B(w('S')||'the verb')} is clearly the doer, so ${the(sp.O,'p')} get the action.`
          :`${B(w('O'))} ends in ${E(sp,'O')}, so ${the(sp.O,'p')} get the action.`)
        :neut?`${B(w('O'))} is a neuter word: its doer and receiver forms look the same. Only ${subjL} can do the action, so ${the(sp.O)} gets it.`
        :`${B(w('O'))} ends in ${B('-m')}, so ${the(sp.O)} gets the action.`;
      return`${Oc} ${Sc}${adjs}${sp.aa?aaNote(sp):''}`}
    case'SGOV':if(isDm(sp.G))return dmRem(sp.G,'gen','s',sp);
      return`${B(w('G'))} ends in ${E(sp,'G')} and sits beside ${B(w('O'))}, so it says ${B('whose')}: ${the(sp.G)}’s ${enN(sp.O,sp.n.O)}.`;
    case'SDOV':if(isDm(sp.D))return dmRem(sp.D,'dat',sp.n.D||'s',sp)+` ${B(w('O'))} is what is given.`;
      return`${B(w('D'))} ends in ${E(sp,'D')} and the verb is ${B(vf('dat',sp.n.S,sp.t,sp.per))} (${sp.t==='pf'?'gave':sp.t==='im'?'was giving':'gives'}), so ${the(sp.D,sp.n.D)} ${B(sp.n.D==='p'?'receive':'receives')}. ${B(w('O'))} is what is given.`;
    case'SCV':return`${prepRule(sp)} ${Sc}`;
    default:{
      const gS=VOC[sp.S].g;
      const p=sp.P.adj?nf(sp.P.adj,'nom',sp.n.S,gS):nf(sp.P.noun,'nom',sp.n.S);
      return`${B(vf('est',sp.n.S,sp.t))} (${pl('S')?'more than one':'one'}) agrees with ${B(w('S'))}, and ${B(p)} ${sp.P.adj?`matches it (${GW[gS]}, ${pl('S')?'plural':'singular'})`:'takes the doer form too'}.`}
  }
}
const remedyText=m=>remedyBase(m)+tenseNote(m.sp);

/* English distractors */
/* every word of a candidate sentence exists, and any is / ea / id has been taught in that case */
function spValid(c){
  try{
    const ts=toks(c,CANON[c.frame]||'SOV');
    if(ts.some(t=>!t.w||/undefined/.test(t.w)))return false;
    for(const s of FR[c.frame].slots){const n=c[s];if(n&&isDm(n)){const cs=s==='S'?'nom':s==='A'?c.acase:CASE[s];if(!okNoun(n,cs,c.n[s]||'s'))return false}}
    return true;
  }catch(e){return false}
}
function swapSp(sp,a,b){const c=cloneSp(sp);[c[a],c[b]]=[sp[b],sp[a]];[c.n[a],c.n[b]]=[sp.n[b],sp.n[a]];[c.adj[a],c.adj[b]]=[sp.adj[b],sp.adj[a]];return c}
function setPer(c,per){c.per=per;c.S=PERLEM[per];c.n.S=per[1];c.pd=true}
/* wrong-but-plausible translations for sentences that have an I / you / we subject or a me / you / us object */
function enVariantsP(sp){
  const k=K(),out=[],push=(c,tag)=>out.push({sp:c,tag});
  const tt=sp.t==='pf'?'pf':'pr';
  const known=['1s','2s','1p','2p'].filter(x=>perKnown(x,tt));
  if(sp.per)known.filter(x=>x!==sp.per&&!(isPr(sp.O)&&PERLEM[x]===sp.O)).forEach(x=>{const c=cloneSp(sp);setPer(c,x);push(c,'person')});
  if(sp.frame==='SOV'){
    const c=cloneSp(sp),oldS=sp.S,oldO=sp.O,oldPer=sp.per,nS=sp.n.S,nO=sp.n.O;
    c.pd=false;
    if(isPr(oldO)){c.S=oldO;c.per=VOC[oldO].per;c.n.S=c.per[1]}else{c.S=oldO;c.per=undefined;c.n.S=nO}
    if(oldPer){c.O=PERLEM[oldPer];c.n.O=oldPer[1]}else{c.O=oldS;c.n.O=nS}
    c.adj={};c.af={};push(c,'swap');
  }
  if(k.perf){
    if(sp.t==='pf'){const c=cloneSp(sp);c.t='pr';push(c,'tense')}
    else if(isKnown('v:'+sp.v)&&(!sp.per||perKnown(sp.per,'pf'))){const c=cloneSp(sp);c.t='pf';push(c,'tense')}
  }
  const f=FR[sp.frame],used=new Set(f.slots.map(s=>sp[s]));
  if(isPr(sp.O)){PRONS.filter(x=>x!==sp.O&&PERLEM[sp.per]!==x).forEach(x=>{const c=cloneSp(sp);c.O=x;c.n.O=VOC[x].per[1];push(c,'person')})}
  else{
    const cand=(VOC[sp[f.sec]].anim?k.anim:k.inan.filter(n=>sp.frame!=='SCV'||PLACES.includes(n))).filter(n=>!used.has(n)&&flipOK(n,sp.n[f.sec]||'s'));
    if(cand.length){const c=cloneSp(sp);c[f.sec]=pick(cand);push(c,'noun')}
    if(sp.frame==='SDOV'){const ic=k.inan.filter(n=>n!==sp.O);if(ic.length){const c=cloneSp(sp);c.O=pick(ic);push(c,'noun')}}
  }
  if(sp.frame==='SCV')k.preps.filter(p=>p!==sp.prep).forEach(p=>{const c=cloneSp(sp);c.prep=p;c.acase=p==='ad'?'acc':'abl';push(c,'prep')});
  const vs=verbsFor(sp.frame,false,undefined,sp.t).filter(v=>v!==sp.v);
  if(vs.length){const c=cloneSp(sp);c.v=pick(vs);push(c,'verb')}
  return out;
}
function enVariants(sp){
  if(isQ(sp.frame))return enVariantsQ(sp);
  if(sp.per||(sp.frame==='SOV'&&isPr(sp.O)))return enVariantsP(sp);
  const k=K(),f=FR[sp.frame],out=[],push=(c,tag)=>{if(spValid(c))out.push({sp:c,tag})};
  if(sp.aa)enVariantsAA(sp,k,push);
  const vs=sp.frame==='SE'?[]:verbsFor(sp.frame,false,undefined,sp.t).filter(v=>v!==sp.v);
  if(f.swap){push(swapSp(sp,...f.swap),'swap');if(vs.length){const c=swapSp(sp,...f.swap);c.v=pick(vs);push(c,'swap')}}
  if(PLS.includes(sp.frame)&&(k.pl||sp.n.S==='p')&&flipOK(sp.S,sp.n.S==='p'?'s':'p')&&(sp.frame!=='SE'||sp.P.adj||flipOK(sp.P.noun,sp.n.S==='p'?'s':'p'))){const c=cloneSp(sp);c.n.S=sp.n.S==='p'?'s':'p';push(c,'num')}
  if(PLO.includes(sp.frame)&&(k.accpl||sp.n.O==='p')&&flipOK(sp.O,sp.n.O==='p'?'s':'p')){const c=cloneSp(sp);c.n.O=sp.n.O==='p'?'s':'p';push(c,'num')}
  if(sp.frame==='SDOV'&&(k.datpl||sp.n.D==='p')){const nn=sp.n.D==='p'?'s':'p';if(okNoun(sp.D,'dat',nn)){const c=cloneSp(sp);c.n.D=nn;push(c,'num')}}
  if(sp.frame==='SCV'&&(k.ablpl||sp.n.A==='p')){const nn=sp.n.A==='p'?'s':'p';if(okNoun(sp.A,sp.acase,nn)){const c=cloneSp(sp);c.n.A=nn;push(c,'num')}}
  /* which tense? */
  ['pr','pf','im'].forEach(t2=>{if(t2!==sp.t&&tenseOK(t2,sp.v,sp.n.S,sp.per)){const c=cloneSp(sp);c.t=t2;push(c,'tense')}});
  if(sp.frame==='SE'){
    if(sp.P.adj){k.adjs.filter(a=>a!==sp.P.adj&&!VOC[a].np&&adjFits(a,sp.S,sp.n.S)).forEach(a=>{const c=cloneSp(sp);c.P.adj=a;push(c,'adj')})}
    else{const alt=k.anim.filter(n=>n!==sp.S&&n!==sp.P.noun&&flipOK(n,sp.n.S));alt.forEach(n=>{const c=cloneSp(sp);c.P.noun=n;push(c,'noun')});
      const c=cloneSp(sp);c.S=sp.P.noun;c.P.noun=sp.S;push(c,'swap')}
    const other=k.nouns.filter(n=>n!==sp.S&&!(VOC[n].sg&&sp.n.S==='p'));if(other.length){const c=cloneSp(sp);c.S=pick(other);push(c,'noun')}
  }else{
    const used=new Set(f.slots.map(s=>sp[s]));
    const cand=k.anim.filter(n=>!used.has(n));
    const candS=cand.filter(n=>!(VOC[n].sg&&sp.n.S==='p'));
    if(candS.length){const c1=cloneSp(sp);c1.S=pick(candS);push(c1,'noun')}
    const candSec=(VOC[sp[f.sec]].anim?cand:k.inan.filter(n=>!used.has(n)&&(sp.frame!=='SCV'||PLACES.includes(n)))).filter(n=>!(VOC[n].sg&&sp.n[f.sec]==='p'));
    if(candSec.length){const c2=cloneSp(sp);c2[f.sec]=pick(candSec);push(c2,'noun')}
    if(sp.frame==='SCV'){
      k.preps.filter(p=>p!==sp.prep&&(!isDm(sp.A)||p==='cum'||p==='ad')).forEach(p=>{const c=cloneSp(sp);c.prep=p;c.acase=p==='ad'?'acc':'abl';push(c,'prep')});
      if(sp.prep==='in'&&k.inacc){const c=cloneSp(sp);c.acase=sp.acase==='acc'?'abl':'acc';push(c,'prep')}
    }
    if(sp.frame==='SGOV'||sp.frame==='SDOV'){const ic=k.inan.filter(n=>n!==sp.O);if(ic.length){const c=cloneSp(sp);c.O=pick(ic);push(c,'noun')}}
    if(vs.length){const c=cloneSp(sp);c.v=pick(vs);push(c,'verb')}
    ['S','O'].forEach(sl=>{if(sp.adj[sl]){
      const alt=k.adjs.filter(a=>a!==sp.adj[sl]&&adjFits(a,sp[sl],sp.n[sl])&&okAdj(a,VOC[sp[sl]].g,CASE[sl],sp.n[sl]));if(alt.length){const c=cloneSp(sp);c.adj[sl]=pick(alt);push(c,'adj')}
      const c2=cloneSp(sp);c2.adj[sl]=undefined;push(c2,'adj')}});
  }
  return out;
}
function transOptions(sp){
  const correct=en(sp);
  const pool=uniqBy(enVariants(sp),v=>en(v.sp)).filter(v=>en(v.sp)!==correct);
  const first=pool.find(v=>v.tag==='swap')||pool.find(v=>v.tag==='person')||pool.find(v=>v.tag==='tense')||pool.find(v=>v.tag==='num')||pool.find(v=>v.tag==='prep')||pool.find(v=>v.tag==='adj');
  const tense=pool.find(v=>v.tag==='tense'&&v!==first);
  const rest=shuffle(pool.filter(v=>v!==first&&v!==tense));
  const chosen=[first,tense,...rest].filter(Boolean).slice(0,3);
  return shuffle([{t:correct,ok:true},...chosen.map(v=>({t:en(v.sp),tag:v.tag}))]);
}

const SCV_Q=sp=>({cum:'with whom?',ad:'towards whom or what?',ex:'out of what?',in:sp.acase==='acc'?'into what?':'in what?'}[sp.prep]);
function whoQs(sp){
  if(isQ(sp.frame))return whoQsQ(sp);
  const v=VOC[sp.v],pf=sp.t==='pf',im=sp.t==='im',pst=pf||im;let q;
  const q0=im?`Who was ${v.eing}?`:pf?`Who ${v.enpf}?`:(v.q?v.q[0]:''),q1=v.q?(pst?v.q[1].replace(' is ',' was '):v.q[1]):'';
  switch(sp.frame){
    case'SOV':q=[{q:q0,role:'S'},{q:VOC[sp.O].anim?q1:q1.replace('Who','What'),role:'O'}];break;
    case'SGOV':q=[{q:q0,role:'S'},{q:`Whose ${VOC[sp.O].en}?`,role:'G'}];break;
    case'SDOV':q=im?[{q:'Who was giving?',role:'S'},{q:'Who was receiving it?',role:'D'},{q:'What was being given?',role:'O'}]:pf?[{q:'Who gave?',role:'S'},{q:'Who received it?',role:'D'},{q:'What was given?',role:'O'}]:[{q:'Who gives?',role:'S'},{q:'Who receives?',role:'D'},{q:'What is given?',role:'O'}];break;
    case'SCV':q=[{q:im?'Who was walking?':pf?'Who walked?':'Who walks?',role:'S'},{q:(im?'Was walking ':pf?'Walked ':'Walks ')+SCV_Q(sp),role:'A'}];break;
    default:q=[{q:'What is this sentence about?',role:'S'},{q:sp.P.adj?'Which word describes it?':'Which word says what it is?',role:'P',tapOnly:true}];
  }
  ['S','O'].forEach(sl=>{if(sp.adj[sl])q.push({q:`Which word describes ${the(sp[sl],sp.n[sl])}?`,role:sl+'a',tapOnly:true})});
  if(sp.aa){q.push({q:'Which word is the noun in the ablative absolute?',role:'Zn',tapOnly:true});q.push({q:'Which word is the participle in the ablative absolute?',role:'Zp',tapOnly:true})}
  if(sp.per)q=q.map(x=>x.role==='S'?{q:'Which word shows who does it?',role:'V',tapOnly:true}:x);
  return q;
}
G.who=(fix={})=>{
  if(isQ(fix.frame))return whoQItem(fix);
  const m=mk(fix),sp=m.sp,k=K();
  const qs=whoQs(sp).filter(q=>!q.tapOnly);
  const q=fix.idx!==undefined?qs[Math.min(fix.idx,qs.length-1)]:pick(qs);
  const role=q.role,slots=FR[sp.frame].slots;
  const lab=s=>isPr(sp[s])?cap(s==='S'?PRON_NOM[sp[s]]:PRON_ACC[sp[s]]):isDm(sp[s])?cap(dmEN(sp[s],s==='S'?'nom':s==='A'?sp.acase:CASE[s],sp.n[s])):The(sp[s],sp.n[s]);
  const ans=lab(role);
  const cand=[];
  slots.filter(s=>s!==role).forEach(s=>cand.push({t:lab(s),tag:'swap'}));
  if(isPr(sp[role]))PRONS.filter(x=>x!==sp[role]).forEach(x=>cand.push({t:cap(PRON_ACC[x]),tag:'noun'}));
  if(!isPr(sp[role])&&flipOK(sp[role],sp.n[role]==='p'?'s':'p')&&((role==='S'&&PLS.includes(sp.frame)&&(k.pl||sp.n.S==='p'))||(role==='O'&&PLO.includes(sp.frame)&&(k.accpl||sp.n.O==='p'))))
    cand.push({t:The(sp[role],sp.n[role]==='p'?'s':'p'),tag:'num'});
  const grp=VOC[sp[role]].anim?k.anim:k.inan;
  const used=slots.map(s=>sp[s]);
  if(role==='D'&&(k.datpl||sp.n.D==='p')){const nn=sp.n.D==='p'?'s':'p';if(okNoun(sp.D,'dat',nn))cand.push({t:The(sp.D,nn),tag:'num'})}
  if(role==='A'&&(k.ablpl||sp.n.A==='p')){const nn=sp.n.A==='p'?'s':'p';if(okNoun(sp.A,sp.acase,nn))cand.push({t:The(sp.A,nn),tag:'num'})}
  const sgOK=n=>!(VOC[n].sg&&sp.n[role]==='p');
  shuffle(grp.filter(n=>!used.includes(n)&&sgOK(n))).forEach(n=>cand.push({t:The(n,sp.n[role]),tag:'noun'}));
  shuffle(k.nouns.filter(n=>!used.includes(n)&&sgOK(n))).forEach(n=>cand.push({t:The(n,sp.n[role]),tag:'noun'}));
  const swaps=cand.filter(c=>c.tag==='swap'),rest=cand.filter(c=>c.tag!=='swap');
  const opts=uniqBy([{t:ans,ok:true},...swaps.slice(0,2),...rest],o=>o.t).slice(0,4);
  return{kind:'mc',type:'who',kcs:kcsOf(m),m,
    promptHTML:sentLine(m.ts,m.hl),subHTML:`<b>${q.q}</b>`,options:shuffle(opts),
    okMsg:`${ans}.`,badMsg:()=>`${sentLine(m.ts,true)}${remedyText(m)}`}
};
G.tap=(fix={})=>{

/* "draw the action": enact the relationship by drawing an arrow between words */
G.arrow=(fix={})=>{
  let fr=fix.frame||'SOV';if(fr==='SCV'||isQ(fr))fr='SOV';
  const m=mk(Object.assign({},fix,{frame:fr,per:null})),sp=m.sp;

/* typed endings */
const LBL={nom_s:'one-doer form',gen_s:'“of” form',dat_s:'“to / for” form',acc_s:'one-receiver form',abl_s:'“with / by” form',nom_p:'many-doers form',acc_p:'many-receivers form',dat_p:'“to / for many” form',abl_p:'“with / by many” form'};
function formDesc(lemma,ty){
  const V=VOC[lemma];
  if(V.pos==='v'){
    for(const t of ['pr','pa'])for(let i=0;i<6;i++)if(norm(V[t][i])===ty)return`“${PERLBL[PERS[i]]}” form${t==='pa'?' (past)':''}`;
    if(V.inf&&norm(V.inf)===ty)return'infinitive (“'+enToInf(lemma)+'”)';
    if(V.pinf&&norm(V.pinf)===ty)return'perfect infinitive (“'+enToInf(lemma,'pf')+'”)';
    return'';
  }
  if(V.pos==='dm'){for(const k of Object.keys(V.f))if(norm(V.f[k])===ty){const[c,num]=k.split('_');return`form of ${lemma} (“${dmEN(lemma,c,num)}”)`}return''}
  if(V.pos==='p'||V.pos==='pr'||V.pos==='x'||V.pos==='rl'||V.pos==='cj')return'';
  const gs=V.pos==='a'?['f','m','n']:[undefined];
  for(const g of gs)for(const [c,num] of ENDKEYS)if(norm(nf(lemma,c,num,g))===ty){const e=endOf(lemma,c,num,g);return LBL[c+'_'+num]+(e?` (-${e})`:'')}
  return'';
}
function dmWhy(t,sp){
  const w=B(t.w),V=B(t.n),he=dmEN(t.n,t.c,t.num);
  if(t.c==='nom')return t.num==='p'?`${w} means “they”: the doers, many of them.`:`${w} is ${V}: “${he}”, the one who does it.`;
  if(t.c==='acc')return t.num==='p'?`${w} means “them”: many receivers.`:`${w} is the receiver form of ${V}: “${he}”.`;
  if(t.c==='gen')return`${w} means “${he}” (of him / her / it): ${B('eius')} is used for every gender.`;
  if(t.c==='dat')return`${w} means “to ${he}”: the verb is ${B(vf('dat',sp.n.S,sp.t))}.`;
  return`${w} means “${he}” after ${B(sp.prep)} (“${PREP_EN(sp)} ${he}”).`;
}
function whyTok(t,sp){
  if(NEWF[sp.frame])return NEWF[sp.frame].why(t,sp);
  if(t.k==='dm')return dmWhy(t,sp);
  if(sp.frame==='SP')return whyP(t,sp);
  if(t.role==='Zn'||t.role==='Zp')return whyAA(t,sp);
  if(['Qs','Qo','Qp','I'].includes(t.role)||(isQ(sp.frame)&&t.role==='O'))return whyQ(t,sp);
  if(t.k==='pr')return t.c==='nom'?`${B(t.w)} is “${PRON_NOM[t.n]}”: it names the one who does the action.`:`${B(t.w)} is the receiver form of ${B(t.n)}: “${PRON_ACC[t.n]}”.`;
  if(t.k==='v'&&t.per&&t.per!=='3s'&&t.per!=='3p')return persRule(sp);
  if(t.k==='v'){
    if(t.t==='im')return`The imperfect (“${enV(t.n,t.num,'im')}”) of ${B(t.n)} is ${B(t.w)}: ${t.n==='est'?`it is irregular (${B('erat')} / ${B('erant')})`:t.num==='p'?`more than one, so it ends in ${B('-bant')}`:`one, so it ends in ${B('-bat')}`}.`;
    if(t.t==='pf')return`The past (“${enV(t.n,t.num,'pf')}”) of ${B(t.n)} is ${B(t.w)}: ${t.num==='p'?`more than one did it, so it ends in ${B('-'+EC+'runt')}`:`one did it, so it ends in ${B(/vit$/.test(t.w)?'-vit':'-it')}`}.`;
    return t.num==='p'?`More than one is doing it, so the verb ends in ${B('-nt')}.`:`One is doing it, so the verb ends in ${B('-t')}.`;
  }
  if(t.k==='p')return'';
  const e0=endOf(t.n,t.c,t.num,t.g),e=e0?B('-'+e0):B('the doer form');
  if(t.k==='a'){
    const slot=t.role==='P'?'S':t.role[0];
    const nw=t.role==='P'?nf(sp.S,'nom',sp.n.S):nf(sp[slot],caseOf(sp,slot),sp[slot]&&sp.n[slot]);
    if(VOC[t.n].at==='3')return`Describing words match their noun in number and job. This word has one set of endings for masculine and feminine and another for neuter. ${B(nw)} is ${GW[t.g]} and ${t.num==='p'?'plural':'singular'}, so it takes ${e}.`;
    return`Describing words match their noun in gender, number and job. ${B(nw)} is ${GW[t.g]} and ${t.num==='p'?'plural':'singular'}, so the describing word takes the ${GW[t.g]} ending ${e}.`;
  }
  if(t.role==='A')return prepRule(sp);
  const nm=the(t.n,t.num),cl=VOC[t.n].d;
  if(t.role==='P')return`${cap(nm)} says what the subject is, so it takes the doer form${t.num==='p'?': '+e:cl==='a'?' (no ending to add)':e0?': '+e:' (the dictionary word)'}.`;
  if(t.num==='p'&&t.c==='nom')return`More than one ${VOC[t.n].en} does it, so it ends in ${e}.`;
  if(t.num==='p'&&t.c==='acc')return`More than one ${VOC[t.n].en} gets the action, so it ends in ${e}.`;
  if(t.c==='acc')return isNeutCls(cl)?`${cap(nm)} is a neuter word, so the receiver form looks the same as the doer form: ${B(t.w)}.`:`${cap(nm)} gets the action, so it ends in ${B('-m')} (${e}).`;
  if(t.c==='gen')return`${cap(nm)} is the owner (“of”), so it ends in ${e}.`;
  if(t.c==='dat')return`${cap(nm)} is the receiver (“to / for”), so it ends in ${e}.`;
  if(isNeutCls(cl))return`${cap(nm)} is a neuter word, so the doer form is ${B(t.w)}.`;
  if(cl==='c3')return`${cap(nm)} does the action, so it takes the dictionary form: ${B(t.w)}.`;
  return cl==='a'?`${cap(nm)} does the action, so there is no ending to add.`:`${cap(nm)} does the action, so it ends in ${e}.`;
}
G.form=(fix={})=>{
  const fr=fix.frame||'SOV';
  const m=mk(Object.assign({},fix,{frame:fr})),sp=m.sp,k=K();
  let elig;
  if(fr==='SOV'){elig=['S','O'];if(k.pl||k.p1)elig.push('V');['S','O'].forEach(s=>{if(sp.adj[s])elig.push(s+'a')});if(sp.aa)elig.push('Zn','Zp')}
  else if(fr==='SGOV')elig=['G'];else if(fr==='SDOV')elig=['D'];
  else if(fr==='SCV'){elig=['A'];if(k.pl||k.p1)elig.push('V')}
  else if(fr==='SIV'){elig=['I','V'];if(sp.Q.O)elig.push('O')}
  else if(NEWF[fr])elig=NEWF[fr].elig(sp);
  else if(fr==='SP'){elig=['P','V'];if(sp.ag)elig.push('A','W')}
  else if(fr==='SQ'){elig=['I','V','Qs'];if(sp.Q.k==='ad')elig.push('Qp');if(sp.Q.k==='tr')elig.push('Qo')}
  else{elig=['P'];if(k.pl)elig.push('V')}
  elig=elig.filter(r=>m.ts.some(x=>x.role===r));
  let role=fix.role||pick(elig);
  if(!m.ts.some(x=>x.role===role))role='V';
  const t=m.ts.find(x=>x.role===role);
  const lat=m.ts.map(x=>x===t?'<span class="blank"></span>':esc(x.w)).join(' ')+'.';
  let sub;
  if(NEWF[fr])sub=NEWF[fr].sub(t,sp);
  else if(t.k==='dm')sub=`Type the Latin for <b>${dmEN(t.n,t.c,t.num)}</b> here.`;
  else if(t.k==='i')sub=`Type the Latin infinitive for <b>${enToInf(t.n,t.t)}</b> here.`;
  else if(t.k==='v')sub=`Type the Latin verb for <b>${sp.per?PRON_NOM[PERLEM[sp.per]]+' ':''}${enV(sp.v,sp.n.S,sp.t,sp.per)}</b> here.`;
  else if(t.k==='pr')sub=`Type the Latin for <b>${t.c==='nom'?PRON_NOM[t.n]:PRON_ACC[t.n]}</b> here.`;
  else if(t.role==='Zn')sub=`Type the Latin for <b>${the(t.n,t.num)}</b> in the absolute phrase (ablative) here.`;
  else if(t.role==='W'&&sp.frame==='SP')sub=`Type the Latin for <b>by</b> here (<b>ā</b> before a consonant, <b>ab</b> before a vowel).`;
  else if(t.role==='A'&&sp.frame==='SP')sub=`Type the Latin for <b>${the(t.n,'s')}</b> after “by” here.`;
  else if(t.k==='a'&&VOC[t.n].pp)sub=`Type the Latin for <b>${VOC[t.n].en}</b> (the participle) here.`;
  else if(t.k==='a')sub=`Type the Latin for <b>${VOC[t.n].en}</b> here.`;
  else sub=`Type the Latin for <b>${the(t.n,t.num)}</b> here.`;
  const why=whyTok(t,sp);
  return{kind:'type',type:'form',kcs:[...new Set([...kcsOf(m).filter(x=>x!=='r:order'),'r:write'])],m,
    promptHTML:`<div class="en" style="font-size:18px;margin:0 0 6px">${en(sp)}</div><div class="lat">${lat}</div>`,
    subHTML:sub,hintHTML:fix.hint?why:'',answers:[norm(t.w)],okMsg:sentText(m.ts),
    badMsg:(typed)=>{const d=formDesc(t.n,norm(typed));return`${d?`<b>${esc((typed||'').trim())}</b> is the ${d}. `:''}${why} Answer: <b>${t.w}</b>.`}}
};

/* listening + writing */
G.dictate=(fix={})=>{
  const k=K();
  const spoken=knownWords().filter(x=>canSay(x));
  const lemma=fix.w||(fix.inf&&INFV.some(infKnown)?pick(INFV.filter(infKnown)):pick(spoken.length?spoken:knownWords()));
  const pos=VOC[lemma].pos,cands=[];
  if(pos==='v'){
    cands.push({f:lemma,kc:[],g:enV(lemma,'s'),tag:'v'});
    if(k.pl&&VOC[lemma].plOK)cands.push({f:VOC[lemma].pl,kc:['r:pl'],g:enV(lemma,'p'),tag:'v'});
    if(isKnown('v:'+lemma)){
      cands.push({f:VOC[lemma].pf,kc:['r:perf','v:'+lemma],g:enV(lemma,'s','pf'),tag:'pf'});
      if(k.perfpl)cands.push({f:VOC[lemma].pfp,kc:['r:perfpl','v:'+lemma],g:enV(lemma,'p','pf'),tag:'pf'});
    }
    if(VOC[lemma].im&&k.imp&&isKnown('m:'+lemma)){
      cands.push({f:VOC[lemma].im[0],kc:['r:imp','m:'+lemma],g:enV(lemma,'s','im'),tag:'im'});
      if(k.imppl)cands.push({f:VOC[lemma].im[1],kc:['r:imppl','r:imp','m:'+lemma],g:enV(lemma,'p','im'),tag:'im'});
    }
    if(VOC[lemma].inf&&k.inf&&isKnown('i:'+lemma)){
      cands.push({f:VOC[lemma].inf,kc:['r:inf','i:'+lemma],g:enToInf(lemma),tag:'inf'});
      if(k.infpf&&isKnown('v:'+lemma))cands.push({f:VOC[lemma].pinf,kc:['r:inf','r:infpf','i:'+lemma,'v:'+lemma],g:enToInf(lemma,'pf'),tag:'inf'});
    }
    ['1s','2s','1p','2p'].forEach(per=>{
      const i=PERS.indexOf(per),w=PRON_NOM[PERLEM[per]];
      if(perKnown(per,'pr'))cands.push({f:VOC[lemma].pr[i],kc:perKCs(per,'pr'),g:`${w} ${enV(lemma,per[1],'pr',per)}`,tag:'v',per});
      if(perKnown(per,'pf')&&isKnown('v:'+lemma))cands.push({f:VOC[lemma].pa[i],kc:[...perKCs(per,'pf'),'r:perf','v:'+lemma],g:`${w} ${enV(lemma,per[1],'pf',per)}`,tag:'pf',per});
    });
  }else if(pos==='p'||pos==='x'||pos==='rl'||pos==='cj')cands.push({f:lemma,kc:[],tag:'p'});
  else if(pos==='dm'){
    const CW={nom:'doer',acc:'receiver',gen:'owner',dat:'to / for',abl:'with / by'};
    Object.keys(VOC[lemma].f).forEach(key=>{const[c,num]=key.split('_');if(!okNoun(lemma,c,num))return;
      const f=VOC[lemma].f[key];if(cands.some(x=>x.f===f))return;
      cands.push({f,kc:clsKCs('dm',c,num),g:`${dmEN(lemma,c,num)} (${CW[c]}${num==='p'?', many':''})`,tag:'dm'})});
    if(!cands.length)cands.push({f:VOC[lemma].f.nom_s,kc:[],g:dmEN(lemma,'nom'),tag:'dm'});
  }
  else if(pos==='pr'){
    cands.push({f:VOC[lemma].f.nom,kc:[],g:PRON_NOM[lemma],tag:'pr'});
    if(VOC[lemma].f.acc!==VOC[lemma].f.nom)cands.push({f:VOC[lemma].f.acc,kc:['r:pron'],g:`${PRON_ACC[lemma]} (receiver)`,tag:'pr'});
  }
  else{
    const gs=pos==='a'?['f','m','n']:[undefined];
    const combos=[['nom','s','nom s',[],true],['acc','s','acc s',['r:acc'],k.acc],['nom','p','nom p',['r:pl'],k.pl],['acc','p','acc p',['r:accpl'],k.accpl],['abl','p','abl p',['r:ablpl'],k.ablpl]];
    gs.forEach(g=>combos.forEach(([c,num,tag,kc,flag])=>{
      if(!flag)return;
      const cl=clsOf(lemma,g);
      if(pos==='a'){if(!okAdj(lemma,g,c,num))return}else if(!okNoun(lemma,c,num))return;
      const f=nf(lemma,c,num,g);
      if(tag==='acc s'&&f===nf(lemma,'nom','s',g))return;           // neuter: same form, nothing new to hear
      if(tag==='acc p'&&f===nf(lemma,'nom','p',g)&&(cl==='um'||cl==='n3'||cl==='e3'||cl==='c3'||cl==='i3'))return;
      cands.push({f,kc:[...kc,...clsKCs(cl,c,num),...(pos==='a'?[VOC[lemma].at==='3'?'r:adj3':g==='f'?'r:adj':'r:adj2']:[])],tag});
    }));

  }
  let pool=cands;
  if(fix.acc===false)pool=cands.slice(0,1);
  else if(fix.acc===true)pool=cands.filter(c=>c.tag==='acc s');
  else if(fix.abl)pool=cands.filter(c=>c.tag==='abl p');
  else if(fix.num==='p')pool=cands.filter(c=>/ p$/.test(c.tag||''));

  if(!pool.length)pool=cands;
  const c=pick(pool),ans=c.f;
  const gloss=c.g||(pos==='a'?adjEN(lemma,'s'):pos==='p'||pos==='x'||pos==='rl'||pos==='cj'?VOC[lemma].en:
    `${the(lemma,/ p$/.test(c.tag)?'p':'s')}${c.tag==='acc s'?' (receiver)':c.tag==='acc p'?' (receivers)':c.tag==='abl p'?' (with / by / in many)':''}`);
  return{kind:'type',type:'dict',kcs:['w:'+lemma,...c.kc],say:[ans],eyebrow:'Listen and write',

    badMsg:()=>`You heard <b>${ans}</b> = ${gloss}.${/acc/.test(c.tag||'')?` The ending marks the receiver.`:''}${c.tag==='pf'?' This is the past tense.':''}`}

G.compose=(fix={})=>{
  const fr=fix.frame||'SOV';
  const m=mk(Object.assign({},fix,{frame:fr,order:fix.order||(NEWF[fr]?undefined:(fix.aa?'Z'+CANON[fr]:CANON[fr])),canon:!!NEWF[fr]})),sp=m.sp,f=FR[fr]||{};
  const targets=toks(sp,m.order).map(t=>t.w);
  const wrong=[];
  const addW=(lemma,c,num,g)=>{const f=nf(lemma,c,num,g);if(f)wrong.push(f)};
  const gOf=n=>VOC[n].g,oppN=sp.n.S==='p'?'s':'p';
  const addV=()=>{
    if(sp.per){shuffle(PERS.filter(x=>x!==sp.per&&(x[0]==='3'||perKnown(x,sp.t)))).slice(0,2).forEach(x=>wrong.push(vf(sp.v,x[1],sp.t,x)))}
    wrong.push(vf(sp.v,oppN,sp.t));
    ['pr','pf','im'].forEach(t2=>{if(t2!==sp.t&&tenseOK(t2,sp.v,sp.n.S,sp.per))wrong.push(vf(sp.v,sp.n.S,t2,sp.per))})};
  if(isQ(fr)){composeWrongQ(sp).forEach(x=>wrong.push(x))}
  else if(fr==='SE'){
    addW(sp.S,'acc',sp.n.S);addV();
    if(sp.P.adj)addW(sp.P.adj,'acc',sp.n.S,gOf(sp.S));else addW(sp.P.noun,'acc',sp.n.S);
  }else if(fr==='SCV'){
    if(!sp.pd)addW(sp.S,'acc',sp.n.S);addV();
    addW(sp.A,sp.acase==='acc'?'abl':'acc',sp.n.A||'s');addW(sp.A,'nom',sp.n.A||'s');
    const op=K().preps.filter(p=>p!==sp.prep);if(op.length)wrong.push(pick(op));
  }else{
    if(!sp.pd){addW(sp.S,'acc',sp.n.S);addW(sp.S,'nom',sp.n.S==='p'?'s':'p')}
    addV();
    if(f.sec==='O'){addW(sp.O,'nom',sp.n.O);addW(sp.O,'acc',sp.n.O==='p'?'s':'p')}
    else addW(sp[f.sec],'nom',sp.n[f.sec]);
    Object.keys(sp.adj).forEach(sl=>{if(sp.adj[sl])addW(sp.adj[sl],CASE[sl]==='acc'?'nom':'acc',sp.n[sl],gOf(sp[sl]))});
    if(sp.aa){addW(sp.aa.N,'nom',sp.aa.nN);addW(sp.aa.P,'nom',sp.aa.nN,gOf(sp.aa.N));addW(sp.aa.N,'acc',sp.aa.nN)}
  }
  const ds=shuffle(uniqBy(wrong,x=>x).filter(x=>!targets.includes(x))).slice(0,2);
  const tiles=shuffle(uniqBy([...targets,...ds],x=>x));
  return{kind:'tiles',type:'compose',kcs:kcsOf(m).concat('r:write'),m,tiles,need:targets.length,
    promptHTML:`<div class="en" style="font-size:20px;color:var(--ink);font-style:normal">“${en(sp)}”</div>`,
    subHTML:`Build the Latin sentence. Choose ${targets.length} words.`,
    check:sel=>{const ok=sel.length===targets.length&&[...sel].sort().join('|')===[...targets].sort().join('|');
      return{ok,note:ok&&!NEWF[fr]&&sel[sel.length-1]!==vf(sp.v,sp.n.S,sp.t,sp.per)?'Correct. (Latin allows this order; verb-last is the most common.)':''}},
    okMsg:targets.join(' ')+'.',
    badMsg:()=>`One good answer: <b>${targets.join(' ')}.</b><br><span style="font-size:15px">${remedyText(m)}</span>`}
};

    okMsg:rule,badMsg:()=>`${sentLine(m.ts,true)}${rule}`}

/* =====================================================================

/* ---------- the passive: puella laudāta est ---------- */
function mkSpecP(fix){

  const ppps=k.adjs.filter(a=>VOC[a].pp);

/* ---------- active and passive mean the same ---------- */
const VOICEV=['amat','videt','audit','laudat','portat','vocat'];
G.voice=(fix={})=>{
  const k=K();let m=null,tries=0;
  while(tries++<80){
    const c=mk({frame:'SP',needAg:true,sn:'s',per:null,hl:false,order:'SAPV',verbs:VOICEV});
    if(c.sp.ag&&VOICEV.includes(VOC[c.sp.pp].pp)&&isKnown('v:'+VOC[c.sp.pp].pp)){m=c;break}
  }
  if(!m)return G.read({frame:'SP'});
  const sp=m.sp,verb=VOC[sp.pp].pp,dir=fix.dir||pick(['p2a','a2p']);
  const act=(S,O,v,t,on,sn)=>mk({frame:'SOV',S,O,v,t,sn:sn||'s',on:on||'s',per:null,adj:{S:null,O:null},order:'SOV',hl:false});
  const pas=(S,pp,ag,sn)=>mk({frame:'SP',S,pp,ag,sn:sn||'s',per:null,hl:false,order:'SAPV'});
  const txt=x=>sentText(x.ts);
  const A0=act(sp.ag,sp.S,verb,'pf',sp.n.S,'s');                                              // the active sentence that means the same
  const opts=[],seen=new Set();
  const add=(x,ok,tag)=>{const t=txt(x);if(seen.has(t))return;seen.add(t);opts.push({t,ok:!!ok,tag})};
  if(dir==='p2a'){
    add(A0,true);
    if(VOC[sp.S].anim&&okNoun(sp.S,'nom','s')){try{add(act(sp.S,sp.ag,verb,'pf','s','s'),false,'swap')}catch(e){}}
    const vs=VOICEV.filter(v=>v!==verb&&isKnown('v:'+v));if(vs.length)add(act(sp.ag,sp.S,pick(vs),'pf',sp.n.S,'s'),false,'verb');
    add(act(sp.ag,sp.S,verb,'pr',sp.n.S,'s'),false,'tense');
    const nn=sp.n.S==='p'?'s':'p';if(okNoun(sp.S,'acc',nn))add(act(sp.ag,sp.S,verb,'pf',nn,'s'),false,'num');
    const others=K().nouns.filter(n=>n!==sp.S&&n!==sp.ag&&okNoun(n,'acc','s')&&(VOC[sp.S].anim?VOC[n].anim:true));
    if(others.length&&opts.length<4)add(act(sp.ag,pick(others),verb,'pf','s','s'),false,'noun');
    return{kind:'mc',type:'voice',kcs:[...new Set([...kcsOf(m),...kcsOf(A0)])],m,eyebrow:'Same meaning',
      promptHTML:`${sentLine(m.ts,false)}`,subHTML:'Which <b>active</b> sentence means the same?',options:shuffle(opts.slice(0,4)),
      okMsg:`${txt(A0)} means the same: “${en(sp)}” and “${en(A0.sp)}”.`,
      badMsg:()=>`${sentLine(m.ts,true)}“${en(sp)}”<br>The one who did it is ${B(nf(sp.ag,'abl','s'))} (after ${B('\u0101 / ab')}), so in the active it becomes the subject: ${B(txt(A0))}`};
  }
  /* a2p: from the active to the passive */
  const P0=pas(sp.S,sp.pp,sp.ag,sp.n.S);
  const add2=(x,ok,tag)=>add(x,ok,tag);
  add2(P0,true);
  if(VOC[sp.S].anim&&sp.n.S==='s'&&okNoun(sp.ag,'nom','s')&&adjFits(sp.pp,sp.ag,'s')&&okAdj(sp.pp,VOC[sp.ag].g,'nom','s')&&okNoun(sp.S,'abl','s'))add2(pas(sp.ag,sp.pp,sp.S,'s'),false,'swap');
  const alt=ADJS.filter(a=>VOC[a].pp&&a!==sp.pp&&isKnown('w:'+a)&&adjFits(a,sp.S,sp.n.S)&&okAdj(a,VOC[sp.S].g,'nom',sp.n.S));
  if(alt.length)add2(pas(sp.S,pick(alt),sp.ag,sp.n.S),false,'verb');
  const ags=K().anim.filter(n=>n!==sp.ag&&n!==sp.S&&okNoun(n,'abl','s'));
  if(ags.length)add2(pas(sp.S,sp.pp,pick(ags),sp.n.S),false,'noun');
  const nn=sp.n.S==='p'?'s':'p';if(okNoun(sp.S,'nom',nn)&&okAdj(sp.pp,VOC[sp.S].g,'nom',nn)&&adjFits(sp.pp,sp.S,nn))add2(pas(sp.S,sp.pp,sp.ag,nn),false,'num');
  return{kind:'mc',type:'voice',kcs:[...new Set([...kcsOf(m),...kcsOf(A0)])],m:A0,eyebrow:'Same meaning',
    promptHTML:`${sentLine(A0.ts,false)}`,subHTML:'Which <b>passive</b> sentence means the same?',options:shuffle(opts.slice(0,4)),
    okMsg:`${txt(P0)} means the same: “${en(A0.sp)}” and “${en(sp)}”.`,
    badMsg:()=>`${sentLine(A0.ts,true)}“${en(A0.sp)}”<br>The receiver ${B(nf(sp.S,'acc',sp.n.S))} becomes the subject, the doer follows ${B('\u0101 / ab')}, and the participle matches the new subject: ${B(txt(P0))}`};
};

/* the endings chart (also shown on the Endings screen) */
function chartHTML(n='puella'){
  const k=K();
  const base={nom_s:true,gen_s:k.gen,dat_s:k.dat,acc_s:k.acc,abl_s:k.abl,nom_p:k.pl,acc_p:k.accpl,dat_p:k.datpl,abl_p:k.ablpl};
  const rows=[['nom','Nominative','does it'],['gen','Genitive','of / ’s'],['dat','Dative','to / for'],['acc','Accusative','gets it'],['abl','Ablative','with / by']];
  const show=(c,num)=>base[c+'_'+num]&&okNoun(n,c,num);
  const cell=(c,num)=>{const f=nf(n,c,num),e=endOf(n,c,num);return`${esc(f.slice(0,f.length-e.length))}<span class="m">${esc(e)}</span>${spk([f])}`};
  return`<table class="chart"><tr><th>Case</th><th>One</th><th>More than one</th></tr>`+rows.map(([c,name,job])=>
    `<tr><td class="c">${name}<br>${job}</td><td>${show(c,'s')?cell(c,'s'):'<span class="un">not yet</span>'}</td><td>${show(c,'p')?cell(c,'p'):`<span class="un">${c==='nom'||c==='acc'?'not yet':'later'}</span>`}</td></tr>`).join('')+`</table>`;
}
function adjChart(a){
  const k=K(),G3=['m','f','n'],cell=(c,num,g)=>{const f=nf(a,c,num,g);return`${esc(f)}${spk([f])}`};
  const row=(label,c,num,flag)=>`<tr><td class="c">${label}</td>${G3.map(g=>`<td>${flag?cell(c,num,g):'<span class="un">not yet</span>'}</td>`).join('')}</tr>`;
  return`<table class="chart"><tr><th></th><th>Masc.</th><th>Fem.</th><th>Neuter</th></tr>${row('doer','nom','s',true)}${row('receiver','acc','s',k.acc)}${row('many doers','nom','p',k.pl)}${row('many receivers','acc','p',k.accpl)}</table>
  <div class="gloss">The describing word takes the gender of its noun: <b>amīcus bonus</b>, <b>puella bona</b>, <b>oppidum bonum</b>. (<b>poeta</b> ends in -a but is masculine: <b>poeta bonus</b>.)</div>`;
}
function adjChart3(a){
  const k=K(),cell=(c,num,g)=>{const f=nf(a,c,num,g);return`${esc(f)}${spk([f])}`};
  const row=(label,c,num,flag)=>`<tr><td class="c">${label}</td><td>${flag?cell(c,num,'m'):'<span class="un">not yet</span>'}</td><td>${flag?cell(c,num,'n'):'<span class="un">not yet</span>'}</td></tr>`;
  return`<table class="chart"><tr><th></th><th>Masc. / fem.</th><th>Neuter</th></tr>${row('doer','nom','s',true)}${row('receiver','acc','s',k.acc)}${row('of','gen','s',k.gen3)}${row('to / for','dat','s',k.dat3)}${row('with / by','abl','s',k.abl3)}${row('many doers','nom','p',k.pl3)}${row('many receivers','acc','p',k.pl3)}</table>
  <div class="gloss">Only two sets of endings: <b>rex fortis</b>, <b>puella fortis</b>, <b>flumen forte</b>. The ablative ends in <b>-ī</b> (not -e).</div>`;
}
function pastChart(){
  const k=K(),vs=VERBS.filter(v=>isKnown('v:'+v));
  return`<table class="chart"><tr><th>Present</th><th>Past</th><th>${k.perfpl?'Past, many':''}</th></tr>`+vs.map(v=>{const V=VOC[v];
    return`<tr><td>${esc(v)}<br><span class="un">${esc(V.en)}</span></td><td>${esc(V.pf)}${spk([V.pf])}<br><span class="un">${esc(V.enpf)}</span></td><td>${k.perfpl?esc(V.pfp)+spk([V.pfp]):''}</td></tr>`}).join('')+`</table>`;
}
function prepChart(){
  const k=K(),rows=[];
  if(isKnown('w:cum'))rows.push(['cum','with','ablative','cum '+nf('puella','abl')]);
  if(isKnown('w:ad'))rows.push(['ad','to','accusative (-m)','ad '+nf('oppidum','acc')]);
  if(isKnown('w:ex'))rows.push(['ex','out of','ablative','ex '+nf('casa','abl')]);
  if(isKnown('w:in'))rows.push(['in','in','ablative','in '+nf('oppidum','abl')]);
  if(k.inacc)rows.push(['in','into','accusative (-m)','in '+nf('oppidum','acc')]);
  return`<table class="chart"><tr><th>Word</th><th>Means</th><th>Example</th></tr>`+rows.map(([w,e,c,ex])=>`<tr><td class="c"><b>${w}</b></td><td>${e}<br><span class="un">${c}</span></td><td>${ex}${spk(ex.split(' '))}</td></tr>`).join('')+`</table>`;
}
const storyBlock=s=>s.s.map(([l,e])=>`<div class="sent"><div class="lat" style="font-size:24px;margin:0">${esc(l)}${spk(l.replace('.','').split(' '))}</div><div class="t">${esc(e)}</div></div>`).join('');
