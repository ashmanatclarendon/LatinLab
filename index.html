    <p class="mute" style="font-size:15px"><b>audit</b> has an odd plural (<i>audiunt</i>), so we leave it out for now.</p>`,{intro:['r:pl'],btn:'Practise',say:['puellae','amant']}),
  ()=>G.howMany({frame:'SOV',role:'S',num:'s',order:'SOV',hl:true,on:'s'}),
  ()=>G.howMany({frame:'SOV',role:'S',num:'p',order:'SOV',hl:true,on:'s'}),
  ()=>G.tap({frame:'SOV',sn:'p',on:'s',idx:0,hl:true,order:'SOV'}),
  ()=>G.who({frame:'SOV',sn:'p',on:'s',idx:0,hl:true,order:'SOV'}),
  ()=>G.read({frame:'SOV',sn:'p',on:'s',hl:true,order:'SOV'}),
  T(`<h2>Now write it</h2><p>The verb has to agree with the doers.</p>`,{btn:'Try it'}),
  ()=>G.form({frame:'SOV',role:'V',sn:'p',on:'s',hint:true,order:'SOV'}),
  ()=>G.form({frame:'SOV',role:'S',sn:'p',on:'s',hint:true,order:'SOV'}),
  ()=>G.dictate({w:'puella',num:'p'}),()=>G.dictate({w:'amat'}),
  T(`<p>Highlighting off. Any word order.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SOV',on:'s'}),()=>G.who({frame:'SOV',on:'s'}),()=>G.tap({frame:'SOV',on:'s'}),()=>G.howMany({role:'S',on:'s'}),
    ()=>G.hearSent({frame:'SOV',on:'s'}),()=>G.compose({frame:'SOV',on:'s'}),()=>G.form({frame:'SOV',on:'s',role:pick(['S','V'])})])(),6,18,'one or many'),
  T(`<h2>Agreement</h2><p>The verb and its doer match: <b>-t</b> with one, <b>-nt</b> with many. English does this too (“loves” and “love”).</p>`,{btn:'Finish'})
]},
{id:12,title:'Many receivers',min:9,steps:()=>[
  T(`<h2>Lesson 12 · Many receivers</h2><p>The receiver can be many too. One new ending: <b>-${AC}s</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>One receiver, many receivers</h2>${H('puella '+hx('poeta','m')+' amat.','The girl loves the poet.')}${H('puella '+hx('poet',AC+'s')+' amat.','The girl loves the poets.')}${H(hx('puell','ae')+' '+hx('poet',AC+'s')+' '+hx('ama','nt')+'.','The girls love the poets.')}
    <table class="tbl"><tr><th></th><th>One</th><th>More than one</th></tr><tr><td>does it</td><td>puella</td><td>puell<span class="m">ae</span></td></tr><tr><td>gets it</td><td>puella<span class="m">m</span></td><td>puell<span class="m">${AC}s</span></td></tr></table>
    <div class="rule">Many receivers end in <b>-${AC}s</b>. The <b>s</b> is the clue. ${spk(['poetam','poet'+AC+'s'])}</div>`,{intro:['r:accpl'],btn:'Practise',say:['poetam','poet'+AC+'s']}),
  ()=>G.howMany({frame:'SOV',role:'O',num:'s',sn:'s',order:'SOV',hl:true}),
  ()=>G.howMany({frame:'SOV',role:'O',num:'p',sn:'s',order:'SOV',hl:true}),
  ()=>G.tap({frame:'SOV',on:'p',sn:'s',idx:1,hl:true,order:'SOV'}),
  ()=>G.who({frame:'SOV',on:'p',sn:'s',idx:1,hl:true,order:'SOV'}),
  ()=>G.read({frame:'SOV',on:'p',sn:'s',hl:true,order:'SOV'}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the one who does it to the ones who get it.</p>`,{btn:'Draw'}),
    ()=>G.arrow({frame:'SOV',on:'p',sn:'s',order:'SOV',hl:true,arrow:'act'})),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form({frame:'SOV',role:'O',on:'p',sn:'s',hint:true,order:'SOV'}),
  ()=>G.form({frame:'SOV',role:'O',on:'p',sn:'p',hint:true,order:'SOV'}),
  ()=>G.dictate({w:'poeta',num:'p'}),()=>G.dictate({w:'nauta',acc:true}),
  T(`<p>Highlighting off. One or many, doing or getting.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SOV'}),()=>G.who({frame:'SOV'}),()=>G.tap({frame:'SOV'}),()=>G.howMany({}),()=>G.hearSent({frame:'SOV'}),
    ()=>G.compose({frame:'SOV'}),()=>G.form({frame:'SOV',role:pick(['S','O','V'])}),()=>G.paradigm({cn:['acc','p']})])(),6,18,'many receivers'),
  T(`<h2>Four forms of one word</h2><p>puella · puellae · puellam · puellās. You can already read all of them.</p>`,{btn:'Finish'})
]},
{id:13,title:'One ending, three jobs',min:10,steps:()=>[
  T(`<h2>Lesson 13 · One ending, three jobs</h2><p>The ending <b>-ae</b> now has three jobs. Sorting them out is real Latin reading.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Same ending, three meanings</h2>${H(hx('puell','ae')+' rosam '+hx('vide','nt')+'.','The girls see the rose.')}${H('puella '+hx('poet','ae')+' rosam videt.','The girl sees the poet’s rose.')}${H('puella '+hx('poet','ae')+' rosam dat.','The girl gives the rose to the poet.')}
    <div class="rule"><b>Ask the verb.</b><br>1. Does the verb end in <b>-nt</b>? Then the <b>-ae</b> noun is the <b>doers</b>.<br>2. Is the verb <b>dat</b>? Then <b>-ae</b> means <b>to / for</b>.<br>3. Otherwise <b>-ae</b> means <b>of</b>.</div>`,{intro:['r:ae3'],btn:'Practise'}),
  ()=>G.aeRole({kind:'pl'}),()=>G.aeRole({kind:'gen'}),()=>G.aeRole({kind:'dat'}),
  ()=>G.aeRole(),()=>G.aeRole(),
  T(`<p>Now sentences without help. Always look at the verb first.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.aeRole(),()=>G.aeRole(),()=>G.read({frame:'SOV',sn:'p',on:'s'}),()=>G.read({frame:'SGOV'}),()=>G.read({frame:'SDOV'}),()=>G.hearSent({frame:'SGOV'}),()=>G.hearSent({frame:'SDOV'})])(),7,20,'three jobs'),
  T(`<h2>The verb decides</h2><p>This is how Latin readers work: a short ending is rarely the whole story, and the rest of the sentence settles it.</p>`,{btn:'Finish'})
]},
{id:14,title:'Describing words',min:10,steps:()=>[
  T(`<h2>Lesson 14 · Describing words</h2><p>Three describing words, and one rule: they <b>copy the ending</b> of the noun they describe.</p>`,{btn:'Begin'}),
  wordTeach('bona'),wordTeach('magna'),wordTeach('pulchra'),
  mcLat2En('bona',['magna','pulchra']),mcEn2Lat('magna',['bona','pulchra']),mcLat2En('pulchra',['bona','magna']),()=>G.hearWord('pulchra',['bona','magna']),
  T(()=>`<h2>Copy the ending</h2><table class="tbl"><tr><th></th><th>One</th><th>More than one</th></tr>
    <tr><td>does it</td><td>puella bon<span class="m">a</span></td><td>puellae bon<span class="m">ae</span></td></tr>
    <tr><td>gets it</td><td>puellam bon<span class="m">am</span></td><td>puell${AC}s bon<span class="m">${AC}s</span></td></tr></table>
    <div class="rule">The describing word <b>matches</b> its noun: same job, same number. ${spk(['puellam','bonam'])}</div>
    <div class="note">Only <b>puella</b>, <b>rosa</b> and <b>casa</b> take these endings today. <b>poeta</b>, <b>nauta</b> and <b>agricola</b> are masculine nouns with feminine-looking endings, so their describing words change differently. That comes later.</div>`,{intro:['r:adj'],btn:'Practise',say:['puellam','bonam']}),
  ()=>G.tap({frame:'SOV',S:'puella',O:'poeta',v:'amat',adj:{S:'bona',O:null},af:{S:false},order:'SOV',idx:2,hl:true}),
  ()=>G.read({frame:'SOV',S:'puella',O:'rosa',v:'videt',adj:{S:null,O:'pulchra'},af:{O:false},order:'SOV',hl:true}),
  ()=>G.read({frame:'SOV',S:'poeta',O:'casa',v:'amat',adj:{S:null,O:'magna'},af:{O:false},order:'SOV',on:'p',hl:true}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the describing word to the noun it describes.</p>`,{btn:'Draw'}),
    ()=>G.arrow({frame:'SOV',S:'puella',O:'poeta',v:'amat',adj:{S:'bona',O:null},af:{S:false},order:'SOV',hl:true,arrow:'adj'})),
  T(`<h2>Now write it</h2><p>Copy the ending.</p>`,{btn:'Try it'}),
  ()=>G.form({frame:'SOV',role:'Sa',S:'puella',O:'poeta',v:'amat',adj:{S:'bona',O:null},af:{S:false},order:'SOV',hint:true}),
  ()=>G.form({frame:'SOV',role:'Oa',S:'poeta',O:'rosa',v:'videt',adj:{S:null,O:'pulchra'},af:{O:false},order:'SOV',hint:true}),
  ()=>G.dictate({w:'bona'}),()=>G.dictate({w:'magna'}),
  T(`<p>Highlighting off. Describing words can come before or after their noun.</p>`,{btn:'Go'}),
  drill(()=>{const a=pick(K().adjs);return pick([()=>G.read({frame:'SOV',S:'puella',adj:{S:a}}),()=>G.read({frame:'SOV',O:pick(['rosa','casa','puella']),adj:{O:a}}),
    ()=>G.tap({frame:'SOV',S:'puella',adj:{S:a},idx:2}),()=>G.form({frame:'SOV',S:'puella',adj:{S:a},role:'Sa'}),()=>G.compose({frame:'SOV',S:'puella',adj:{S:a}}),
    ()=>G.hearSent({frame:'SOV',S:'puella',adj:{S:a}})])()},6,18,'describing words'),
  T(`<h2>Agreement again</h2><p>Verbs agree with their doers. Describing words agree with their nouns. That is most of Latin grammar in two sentences.</p>`,{btn:'Finish'})
]},
{id:15,title:'To be',min:9,steps:()=>[
  T(`<h2>Lesson 15 · To be</h2><p>One of the most useful Latin words: <b>est</b>, “is”. Its plural is <b>sunt</b>, “are”.</p>`,{btn:'Begin'}),
  wordTeach('est'),
  T(()=>`<h2>X is Y</h2>${H('puella est bona.','The girl is good.')}${H(hx('puell','ae')+' sunt '+hx('bon','ae')+'.','The girls are good.')}${H('poeta est nauta.','The poet is a sailor.')}${H(hx('poet','ae')+' sunt '+hx('naut','ae')+'.','The poets are sailors.')}
    <div class="rule"><b>est</b> = one is. <b>sunt</b> = many are. The word after it <b>copies the doer’s ending</b>: there is no <b>-m</b>, because nobody is getting anything. ${spk(['puellae','sunt','bonae'])}</div>`,{intro:['r:be'],btn:'Practise',say:['puellae','sunt','bonae']}),
  ()=>G.howMany({frame:'SE',role:'S',num:'s',hl:true}),()=>G.howMany({frame:'SE',role:'S',num:'p',hl:true}),
  ()=>G.tap({frame:'SE',S:'puella',pred:{adj:'bona'},sn:'s',order:'SPV',idx:1,hl:true}),
  ()=>G.read({frame:'SE',S:'rosa',pred:{adj:'pulchra'},sn:'p',order:'SPV',hl:true}),
  ()=>G.read({frame:'SE',S:'poeta',pred:{noun:'nauta'},sn:'s',order:'SPV',hl:true}),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form({frame:'SE',role:'V',S:'puella',pred:{adj:'bona'},sn:'p',order:'SPV',hint:true}),
  ()=>G.form({frame:'SE',role:'P',S:'rosa',pred:{adj:'magna'},sn:'p',order:'SPV',hint:true}),
  ()=>G.dictate({w:'est'}),()=>G.dictate({w:'est'}),
  T(`<p>Highlighting off. The verb can sit in the middle or at the end.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SE'}),()=>G.who({frame:'SE'}),()=>G.tap({frame:'SE'}),()=>G.howMany({frame:'SE',role:'S'}),()=>G.hearSent({frame:'SE'}),
    ()=>G.compose({frame:'SE'}),()=>G.form({frame:'SE'}),()=>G.arrow({frame:'SE'})])(),6,18,'to be'),
  T(`<h2>You can now say “is”</h2><p>Look at the top of the home screen: the first words of Caesar’s <i>De Bello Gallico</i> have started to come into focus.</p>`,{btn:'Finish'})
]},
{id:16,title:'Reading day',min:10,steps:()=>[
  T(`<h2>Lesson 16 · Reading day</h2><p>No new grammar today. Read a short passage built only from what you know, then mix everything.</p>`,{btn:'Begin'}),
  T(()=>{const s=STORIES.find(x=>x.id==='s15');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  drill(()=>mixed(),0,0,'x'),
  T(`<h2>Unit 3 complete</h2><p>You can now read and write sentences with one or many doers, one or many receivers, owners, givers, describing words and “to be”. There is a lot more Latin, but this is the core.</p>`,{btn:'Finish'})
]},
/* ===== Unit 4: the second declension ===== */
{id:17,title:'Friends and wolves',min:10,steps:()=>[
  T(`<h2>Lesson 17 · Friends and wolves</h2><p>Until now every noun ended in <b>-a</b>. Many Latin nouns end in <b>-us</b> instead. Same idea (doers and receivers), new endings.</p><p class="mute">Four new words, then the pattern.</p>`,{btn:'Begin'}),
  wordTeach('amicus'),wordTeach('lupus'),
  mcLat2En('amicus',['lupus','puella']),mcEn2Lat('lupus',['amicus','poeta']),()=>G.hearWord('amicus',['lupus','poeta','puella']),
  wordTeach('dominus'),wordTeach('equus'),
  mcLat2En('equus',['dominus','lupus']),mcEn2Lat('dominus',['equus','amicus']),()=>G.hearWord('equus',['dominus','lupus','amicus']),
  T(()=>`<h2>-us does it, -um gets it</h2>${H(hx('amīc','us')+' '+hx('lup','um')+' videt.','The friend sees the wolf.')}${H(hx('lup','us')+' '+hx('amīc','um')+' videt.','The wolf sees the friend.')}
    <table class="tbl"><tr><th></th><th>puella</th><th>amicus</th></tr><tr><td>does it</td><td>puella</td><td>amīc<span class="m">us</span></td></tr><tr><td>gets it</td><td>puella<span class="m">m</span></td><td>amīc<span class="m">um</span></td></tr></table>
    <div class="rule">Receivers still end in <b>-m</b>. The doer ending for these nouns is <b>-us</b>. ${spk(['amicus','lupum','videt'])}</div>`,{intro:['r:us'],btn:'Practise',say:['amicus','lupum','videt']}),
  ()=>G.tap(f1({frame:'SOV',S:'amicus',O:'lupus',v:'videt',order:'SOV',idx:1,hl:true})),
  ()=>G.who(f1({frame:'SOV',S:'lupus',O:'amicus',v:'amat',order:'SOV',idx:0,hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'dominus',O:'equus',v:'laudat',order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'puella',O:'lupus',v:'videt',order:'SOV',hl:true})),
  ...when(S.opts.enact,
    T(`<h2>Draw the action</h2><p>An arrow from the doer to the receiver.</p>`,{btn:'Draw'}),
    ()=>G.arrow(f1({frame:'SOV',S:'equus',O:'dominus',v:'videt',order:'SOV',hl:true,arrow:'act'}))),
  T(`<p>Highlighting off. Any word order, and the old <b>-a</b> nouns are still in the mix.</p>`,{btn:'Go'}),
  drill(()=>pick([G.read,G.who,G.tap])(Math.random()<.5?f1({frame:'SOV',S:usN()}):f1({frame:'SOV',O:usN()})),6,18,'-us and -um'),
  ()=>G.form(f1({frame:'SOV',role:'S',S:'lupus',O:'puella',v:'videt',order:'SOV',hint:true})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'puella',O:'equus',v:'amat',order:'SOV',hint:true})),
  ()=>G.dictate({w:'amicus',acc:true}),()=>G.dictate({w:'dominus',acc:false}),
  ()=>G.compose(f1({frame:'SOV',S:'dominus',O:'equus',v:'laudat'})),
  drill(()=>pick([()=>G.form(f1({frame:'SOV',role:pick(['S','O']),S:usN()})),()=>G.compose(f1({frame:'SOV',O:usN()})),()=>G.dictate({acc:true,w:usN()}),()=>G.hearSent(f1({frame:'SOV',S:usN()}))])(),5,16,'writing -us / -um'),
  T(`<h2>Two kinds of noun</h2><p>You can now read and write sentences with both <b>-a</b> nouns and <b>-us</b> nouns. The receiver always ends in <b>-m</b>.</p>`,{btn:'Finish'})
]},
{id:18,title:'Whose is it? (again)',min:9,steps:()=>[
  T(`<h2>Lesson 18 · Whose is it? (again)</h2><p>With <b>-a</b> nouns, “of the poet” was <b>poetae</b>. With <b>-us</b> nouns it is a different ending: <b>-${IC}</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>The owner ends in -${IC}</h2>${H('puella '+hx('amīc','ī')+' rosam videt.','The girl sees the <b>friend’s</b> rose.')}${H('poeta '+hx('lup','ī')+' casam amat.','The poet loves the <b>wolf’s</b> house.')}
    <table class="tbl"><tr><th></th><th>puella</th><th>amicus</th></tr><tr><td>of the …</td><td>puell<span class="m">ae</span></td><td>amīc<span class="m">${IC}</span></td></tr></table>
    <div class="rule">An owner is always the “of” form. For <b>-us</b> nouns that is <b>-${IC}</b>. ${spk(['puella','amicī','rosam','videt'])}</div>
    <div class="note">The line over the ī is a <b>macron</b>: it marks a long vowel. You can type without macrons, but they help you read.</div>`,{intro:['r:gen2'],btn:'Practise',say:['puella','amicī','rosam','videt']}),
  ()=>G.tap({frame:'SGOV',S:'puella',G:'amicus',O:'rosa',v:'videt',order:'SXV',idx:1,hl:true}),
  ()=>G.who({frame:'SGOV',S:'poeta',G:'lupus',O:'casa',v:'amat',order:'SXV',idx:1,hl:true}),
  ()=>G.read({frame:'SGOV',S:'nauta',G:'dominus',O:'rosa',v:'laudat',order:'SXV',hl:true}),
  T(`<p>Highlighting off. The owner can come before or after the thing, and the sentence can be shuffled.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SGOV',G:usN()}),()=>G.who({frame:'SGOV',G:usN()}),()=>G.tap({frame:'SGOV',G:usN()}),()=>G.hearSent({frame:'SGOV',G:usN()}),()=>G.read({frame:'SGOV'}),()=>G.compose({frame:'SGOV',G:usN()})])(),6,18,'whose is it'),
  ()=>G.form({frame:'SGOV',role:'G',G:'amicus',hint:true}),()=>G.form({frame:'SGOV',role:'G',G:usN()}),
  ()=>G.paradigm({cn:['gen','s'],n:usN()}),()=>G.dictate({w:'amicus'}),
  T(`<h2>Same job, two endings</h2><p>“Of” is <b>-ae</b> for <b>-a</b> nouns and <b>-${IC}</b> for <b>-us</b> nouns. The job stays the same; only the ending changes with the noun.</p>`,{btn:'Finish'})
]},
{id:19,title:'To and with',min:10,steps:()=>[
  T(`<h2>Lesson 19 · To and with</h2><p>Two more jobs, one more ending: <b>-${OC}</b>. Like <b>-ae</b> before it, one ending does two jobs, and the little words around it tell you which.</p>`,{btn:'Begin'}),
  T(()=>`<h2>-${OC}: to or with?</h2>${H('puella '+hx('amīc','ō')+' rosam dat.','The girl gives the rose <b>to the friend</b>.')}${H('puella cum '+hx('amīc','ō')+' ambulat.','The girl walks <b>with the friend</b>.')}
    <table class="tbl"><tr><th></th><th>puella</th><th>amicus</th></tr><tr><td>to / for</td><td>puell<span class="m">ae</span></td><td>amīc<span class="m">${OC}</span></td></tr><tr><td>with</td><td>puell<span class="m">${AC}</span></td><td>amīc<span class="m">${OC}</span></td></tr></table>
    <div class="rule">With <b>dat</b> (gives): <b>-${OC}</b> means <b>to / for</b>. After <b>cum</b>: <b>-${OC}</b> means <b>with</b>. ${spk(['puella','amicō','rosam','dat'])}</div>`,{intro:['r:dat2','r:abl2'],btn:'Practise',say:['puella','amicō','rosam','dat']}),
  ()=>G.who({frame:'SDOV',S:'puella',D:'amicus',O:'rosa',v:'dat',order:'SDOV',idx:1,hl:true}),
  ()=>G.tap({frame:'SDOV',S:'agricola',D:'dominus',O:'casa',v:'dat',order:'SDOV',idx:2,hl:true}),
  ()=>G.read({frame:'SCV',S:'poeta',prep:'cum',acase:'abl',A:'equus',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.who({frame:'SCV',S:'nauta',prep:'cum',acase:'abl',A:'lupus',v:'ambulat',order:'SCV',idx:1,hl:true}),
  T(`<p>Now the real test: is <b>-${OC}</b> “to” or “with”? Look for <b>dat</b> and <b>cum</b>.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.endRole({kind:'dat2'}),()=>G.endRole({kind:'abl2'}),()=>G.endRole({kind:'abl2'}),()=>G.read({frame:'SDOV',D:usN()}),()=>G.read({frame:'SCV',prep:'cum',A:usN()}),()=>G.hearSent({frame:'SCV',prep:'cum',A:usN()}),()=>G.who({frame:'SDOV',D:usN()})])(),7,20,'to or with'),
  ()=>G.form({frame:'SDOV',role:'D',D:'dominus',hint:true}),()=>G.form({frame:'SCV',role:'A',prep:'cum',A:'amicus',hint:true}),
  ()=>G.compose({frame:'SDOV',D:usN()}),()=>G.compose({frame:'SCV',prep:'cum',A:usN()}),
  T(`<h2>Two jobs for -${OC}</h2><p><b>dat</b> → “to”. <b>cum</b> → “with”. Latin makes you look at the whole sentence, and you just did.</p>`,{btn:'Finish'})
]},
{id:20,title:'Many friends',min:10,steps:()=>[
  T(`<h2>Lesson 20 · Many friends</h2><p>The <b>-us</b> nouns have plural endings too: <b>-${IC}</b> for many doers and <b>-${OC}s</b> for many receivers.</p>`,{btn:'Begin'}),
  T(()=>`<h2>One, many</h2>${H(hx('amīc','us')+' '+hx('lup','um')+' videt.','The friend sees the wolf.')}${H(hx('amīc','ī')+' '+hx('lup','um')+' '+hx('vide','nt')+'.','The friends see the wolf.')}${H(hx('amīc','us')+' '+hx('lup','ōs')+' videt.','The friend sees the wolves.')}
    <table class="tbl"><tr><th></th><th>One</th><th>More than one</th></tr><tr><td>does it</td><td>amīc<span class="m">us</span></td><td>amīc<span class="m">${IC}</span></td></tr><tr><td>gets it</td><td>amīc<span class="m">um</span></td><td>amīc<span class="m">${OC}s</span></td></tr></table>
    <div class="rule">Many doers: noun <b>-${IC}</b> and verb <b>-nt</b>. Many receivers: <b>-${OC}s</b>. ${spk(['amicī','lupōs','vident'])}</div>`,{intro:['r:pl2'],btn:'Practise',say:['amicī','lupōs','vident']}),
  ()=>G.howMany(f1({frame:'SOV',role:'S',S:'amicus',sn:'p',hl:true,order:'SOV'})),
  ()=>G.howMany(f1({frame:'SOV',role:'O',O:'equus',on:'p',hl:true,order:'SOV'})),
  ()=>G.tap(f1({frame:'SOV',S:'lupus',O:'amicus',sn:'p',idx:0,hl:true,order:'SOV'})),
  ()=>G.read(f1({frame:'SOV',S:'dominus',O:'equus',on:'p',v:'laudat',hl:true,order:'SOV'})),
  T(`<h2>A trap</h2><p>The ending <b>-${IC}</b> now has two jobs, like <b>-ae</b> did. The verb settles it:</p>
    <div class="rule"><b>-nt</b> on the verb → <b>-${IC}</b> means <b>many doers</b>.<br>Otherwise <b>-${IC}</b> next to another noun means <b>of</b>.</div>
    ${H(hx('amīc','ī')+' '+hx('lup','um')+' '+hx('vide','nt')+'.','The friends see the wolf.')}${H('puella '+hx('amīc','ī')+' rosam videt.','The girl sees the friend’s rose.')}`,{btn:'Try it'}),
  ()=>G.endRole({kind:'pl2'}),()=>G.endRole({kind:'gen2'}),()=>G.endRole({kind:'pl2'}),
  T(`<p>Highlighting off. One or many, doing or getting.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(f1({frame:'SOV',S:usN(),sn:'p'})),()=>G.read(f1({frame:'SOV',O:usN(),on:'p'})),()=>G.who(f1({frame:'SOV',S:usN()})),()=>G.howMany({frame:'SOV',S:usN()}),
    ()=>G.endRole({kind:'pl2'}),()=>G.endRole({kind:'gen2'}),()=>G.hearSent(f1({frame:'SOV',O:usN()})),()=>G.tap(f1({frame:'SOV',O:usN(),on:'p'}))])(),7,20,'many friends'),
  ()=>G.form(f1({frame:'SOV',role:'S',S:'amicus',sn:'p',O:'lupus',v:'videt',hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'puella',O:'equus',on:'p',v:'amat',hint:true,order:'SOV'})),
  ()=>G.dictate({w:'amicus',num:'p'}),()=>G.paradigm({cn:['acc','p'],n:usN()}),
  ()=>G.compose(f1({frame:'SOV',S:usN(),sn:'p'})),
  T(`<h2>Six forms of one word</h2><p>amicus · amicī · amicō · amicum · amicōs, and amicī again for “of”. You can already tell them apart in a sentence.</p>`,{btn:'Finish'})
]},
{id:21,title:'Neuter words',min:11,steps:()=>[
  T(`<h2>Lesson 21 · Neuter words</h2><p>A third kind of noun ends in <b>-um</b>: <b>oppidum</b> (town). These are <b>neuter</b> words, and they behave differently.</p><p class="mute">Four new words, then one surprise.</p>`,{btn:'Begin'}),
  wordTeach('oppidum'),wordTeach('donum'),
  mcLat2En('oppidum',['donum','casa']),mcEn2Lat('donum',['oppidum','rosa']),()=>G.hearWord('donum',['oppidum','rosa','casa']),
  wordTeach('templum'),wordTeach('bellum'),
  mcLat2En('bellum',['templum','oppidum']),mcEn2Lat('templum',['bellum','donum']),()=>G.hearWord('templum',['bellum','oppidum','donum']),
  T(()=>`<h2>One form for doing and getting</h2>${H('agricola '+hx('oppid','um')+' videt.','The farmer sees the town.')}${H('agricola '+hx('oppid','a')+' videt.','The farmer sees the towns.')}
    <table class="tbl"><tr><th></th><th>One</th><th>More than one</th></tr><tr><td>does it</td><td>oppid<span class="m">um</span></td><td>oppid<span class="m">a</span></td></tr><tr><td>gets it</td><td>oppid<span class="m">um</span></td><td>oppid<span class="m">a</span></td></tr></table>
    <div class="rule"><b>Neuter</b> words use the <b>same form</b> for the doer and the receiver. In practice you decide by sense: here the farmer, not the town, is the one who sees. ${spk(['oppidum','oppida'])}</div>
    <div class="note">So <b>-um</b> can mean “gets the action” (<i>lupum</i>) or be a neuter word (<i>oppidum</i>). You know which by the noun itself.</div>`,{intro:['r:neut'],btn:'Practise',say:['oppidum','oppida']}),
  ()=>G.tap(f1({frame:'SOV',S:'agricola',O:'oppidum',v:'videt',order:'SOV',idx:1,hl:true})),
  ()=>G.who(f1({frame:'SOV',S:'poeta',O:'templum',v:'laudat',order:'SOV',idx:1,hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'nauta',O:'oppidum',on:'p',v:'videt',order:'SOV',hl:true})),
  ()=>G.read({frame:'SDOV',S:'puella',D:'amicus',O:'donum',v:'dat',order:'SDOV',hl:true}),
  ()=>G.read({frame:'SGOV',S:'lupus',G:'dominus',O:'templum',v:'videt',order:'SXV',hl:true}),
  T(`<p>Highlighting off. Neuter words turn up as receivers, owners’ things and gifts.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(f1({frame:'SOV',O:neN()})),()=>G.who(f1({frame:'SOV',O:neN()})),()=>G.tap(f1({frame:'SOV',O:neN()})),()=>G.howMany({frame:'SOV',role:'O',O:neN()}),
    ()=>G.read({frame:'SDOV',O:neN()}),()=>G.read({frame:'SGOV',O:neN()}),()=>G.hearSent(f1({frame:'SOV',O:neN()}))])(),6,18,'neuter words'),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'agricola',O:'oppidum',on:'s',v:'videt',hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'nauta',O:'templum',on:'p',v:'videt',hint:true,order:'SOV'})),
  ()=>G.dictate({w:'oppidum',num:'p'}),()=>G.dictate({w:'bellum'}),
  ()=>G.compose(f1({frame:'SOV',O:neN()})),()=>G.paradigm({cn:['acc','p'],n:neN()}),
  T(`<h2>Three noun types</h2><p>puella (<b>-a</b>), amicus (<b>-us</b>) and oppidum (<b>-um</b>, neuter). Almost all Latin nouns follow one of these patterns or a close relative.</p>`,{btn:'Finish'})
]},
{id:22,title:'Describing words, all genders',min:11,steps:()=>[
  T(`<h2>Lesson 22 · Describing words, all genders</h2><p>In Lesson 14 a describing word copied the ending of a <b>feminine</b> noun. Now it has to match the noun’s <b>gender</b> too: masculine, feminine or neuter.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Three forms of one word</h2><table class="tbl"><tr><th>Masc.</th><th>Fem.</th><th>Neuter</th></tr><tr><td>bon<span class="m">us</span></td><td>bon<span class="m">a</span></td><td>bon<span class="m">um</span></td></tr><tr><td>magn<span class="m">us</span></td><td>magn<span class="m">a</span></td><td>magn<span class="m">um</span></td></tr></table>
    ${H('amīcus '+hx('bon','us')+' lupum amat.','The good friend loves the wolf.')}${H('puella '+hx('bon','a')+' lupum amat.','The good girl loves the wolf.')}${H('puella '+hx('magn','um')+' oppidum videt.','The girl sees the big town.')}
    <div class="rule">The describing word takes the <b>gender of its noun</b>, plus its number and job. ${spk(['bonus','bona','bonum'])}</div>`,{intro:['r:adj2'],btn:'Next',say:['bonus','bona','bonum']}),
  T(()=>`<h2>Gender is not the ending</h2>${H('poeta '+hx('bon','us')+' puellam amat.','The good poet loves the girl.')}${H('nauta '+hx('magn','us')+' oppidum videt.','The big sailor sees the town.')}
    <div class="rule"><b>poeta</b>, <b>nauta</b> and <b>agricola</b> end in <b>-a</b> but name <b>men</b>, so they are masculine and take masculine describing words.</div>
    <div class="note"><b>pulchra</b> is slightly odd: the masculine is <b>pulcher</b> (not <i>pulchrus</i>). So: <b>pulcher</b>, <b>pulchra</b>, <b>pulchrum</b>. ${spk(['pulcher','pulchra','pulchrum'])}</div>`,{btn:'Practise',say:['pulcher','pulchra','pulchrum']}),
  ()=>G.tap({frame:'SOV',S:'amicus',O:'puella',v:'amat',adj:{S:'bona',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',idx:2,hl:true}),
  ()=>G.read({frame:'SOV',S:'poeta',O:'oppidum',v:'videt',adj:{S:'magna',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',hl:true}),
  ()=>G.read({frame:'SOV',S:'puella',O:'templum',v:'laudat',adj:{S:null,O:'pulchra'},af:{O:false},sn:'s',on:'s',order:'SOV',hl:true}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the describing word to the noun it describes.</p>`,{btn:'Draw'}),
    ()=>G.arrow({frame:'SOV',S:'equus',O:'puella',v:'amat',adj:{S:'magna',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',hl:true,arrow:'adj'})),
  T(`<h2>Now write it</h2><p>Look at the noun’s gender first.</p>`,{btn:'Try it'}),
  ()=>G.form({frame:'SOV',role:'Sa',S:'dominus',O:'puella',v:'amat',adj:{S:'bona',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',hint:true}),
  ()=>G.form({frame:'SOV',role:'Oa',S:'poeta',O:'oppidum',v:'videt',adj:{S:null,O:'pulchra'},af:{O:false},sn:'s',on:'s',order:'SOV',hint:true}),
  ()=>G.dictate({w:'bona'}),()=>G.dictate({w:'magna'}),
  T(`<p>Highlighting off. Describing words can come before or after their noun.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(adjFix()),()=>G.tap(Object.assign(adjFix(),{idx:2})),()=>G.compose(adjFix()),()=>G.hearSent(adjFix()),()=>{const f=adjFix();return G.form(Object.assign(f,{role:f.adj.S?'Sa':'Oa'}))},()=>G.read({frame:'SE',S:neN(),pred:{adj:pick(K().adjs)},sn:'s'})])(),7,20,'describing words'),
  T(`<h2>Three genders</h2><p>Look at the noun, find its gender, and the describing word follows. That is how Latin builds phrases like <i>amīcus bonus</i> and <i>oppidum magnum</i>.</p>`,{btn:'Finish'})
]},
{id:23,title:'Look-alike endings',min:11,steps:()=>[
  T(`<h2>Lesson 23 · Look-alike endings</h2><p>Latin endings are short, so many look the same. No new endings today: this lesson is for telling the look-alikes apart.</p>`,{btn:'Begin'}),
  T(`<h2>The look-alikes</h2><table class="tbl"><tr><th>Ending</th><th>Could mean</th></tr>
    <tr><td><span class="m">-ae</span></td><td>of · to / for · many doers</td></tr>
    <tr><td><span class="m">-${IC}</span></td><td>of · many doers</td></tr>
    <tr><td><span class="m">-${OC}</span></td><td>to / for · with</td></tr>
    <tr><td><span class="m">-a</span></td><td>the doer (feminine) · many (neuter)</td></tr>
    <tr><td><span class="m">-um</span></td><td>receiver · neuter word</td></tr></table>
    <div class="rule"><b>Ask the sentence.</b><br>• Verb ends in <b>-nt</b>? → many doers.<br>• Verb is <b>dat</b>? → “to”.<br>• After <b>cum</b>? → “with”.<br>• Otherwise a noun beside a noun → “of”.</div>`,{btn:'Practise'}),
  ()=>G.aeRole(),()=>G.endRole(),()=>G.aeRole(),()=>G.endRole(),
  drill(()=>pick([()=>G.aeRole(),()=>G.endRole(),()=>G.endRole(),()=>G.read({frame:'SGOV'}),()=>G.read({frame:'SDOV'}),()=>G.read({frame:'SOV',sn:'p'}),()=>G.hearSent({frame:'SDOV'}),()=>G.hearSent({frame:'SGOV'}),()=>G.read({frame:'SCV',prep:'cum'})])(),8,22,'look-alikes'),
  T(`<p>Now everything at once. Nothing is labelled.</p>`,{btn:'Go'}),
  {kind:'drill',gen:mixed,n:18,label:'mixed'},
  T(`<h2>Reading Latin</h2><p>This is what reading Latin is like: ending, verb and little words together decide the meaning. You have all five tools now.</p>`,{btn:'Finish'})
]},
{id:24,title:'Reading day',min:11,steps:()=>[
  T(`<h2>Lesson 24 · Reading day</h2><p>Two new verbs, then a passage built only from what you know, then mixed practice.</p>`,{btn:'Begin'}),
  wordTeach('portat'),wordTeach('vocat'),
  mcLat2En('portat',['vocat','videt']),mcEn2Lat('vocat',['portat','laudat']),()=>G.hearWord('vocat',['portat','laudat','amat']),
  T(()=>{const s=STORIES.find(x=>x.id==='s25');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  drill(()=>pick([()=>G.read({frame:'SOV',v:pick(['portat','vocat'])}),()=>G.who({frame:'SOV',v:pick(['portat','vocat'])}),()=>G.hearSent({frame:'SOV',v:pick(['portat','vocat'])}),()=>G.compose({frame:'SOV',v:pick(['portat','vocat'])}),()=>G.form({frame:'SOV',v:pick(['portat','vocat']),role:'V'})])(),5,14,'two new verbs'),
  {kind:'drill',gen:mixed,n:18,label:'mixed'},
  T(`<h2>Unit 4 complete</h2><p>Three noun types, five cases, plurals, gender and agreement. Next: little words that say <i>to</i>, <i>from</i> and <i>in</i>.</p>`,{btn:'Finish'})
]},

/* ===== Unit 5: little words ===== */
{id:25,title:'To, from, in',min:10,steps:()=>[
  T(`<h2>Lesson 25 · To, from, in</h2><p>Little words called <b>prepositions</b> say <i>where</i>. Each one decides the <b>ending</b> of the noun after it. You already know one: <b>cum</b> + ablative.</p>`,{btn:'Begin'}),
  wordTeach('ad'),wordTeach('ex'),wordTeach('in'),
  mcLat2En('ad',['cum','ex']),mcEn2Lat('ex',['ad','cum']),mcLat2En('in',['ad','ex','cum']),()=>G.hearWord('ex',['ad','in','cum']),
  T(()=>`<h2>The little word picks the ending</h2>${H('agricola '+'ad '+hx('oppid','um')+' ambulat.','The farmer walks <b>to</b> the town.')}${H('puella '+'ex '+hx('cas','ā')+' ambulat.','The girl walks <b>out of</b> the house.')}${H('nauta '+'in '+hx('templ','ō')+' ambulat.','The sailor walks <b>in</b> the temple.')}
    <table class="tbl"><tr><th>Word</th><th>Means</th><th>Takes</th></tr><tr><td><b>cum</b></td><td>with</td><td>ablative</td></tr><tr><td><b>ad</b></td><td>to</td><td>accusative (<b>-m</b>)</td></tr><tr><td><b>ex</b></td><td>out of</td><td>ablative</td></tr><tr><td><b>in</b></td><td>in</td><td>ablative</td></tr></table>
    <div class="rule">So after <b>ad</b> you will see <b>-m</b>, and after <b>ex</b>, <b>cum</b> and <b>in</b> the long <b>-${AC}</b> or <b>-${OC}</b>. ${spk(['agricola','ad','oppidum','ambulat'])}</div>`,{intro:['r:prep'],btn:'Practise',say:['agricola','ad','oppidum','ambulat']}),
  ()=>G.tap({frame:'SCV',S:'agricola',prep:'ad',acase:'acc',A:'oppidum',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.who({frame:'SCV',S:'puella',prep:'ex',acase:'abl',A:'casa',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.read({frame:'SCV',S:'nauta',prep:'in',acase:'abl',A:'templum',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.read({frame:'SCV',S:'poeta',prep:'ad',acase:'acc',A:'amicus',v:'ambulat',order:'CSV',hl:true}),
  T(`<p>Highlighting off. Watch the little word, then the ending.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SCV',prep:pick(['ad','ex','in'])}),()=>G.who({frame:'SCV',prep:pick(['ad','ex','in'])}),()=>G.tap({frame:'SCV',prep:pick(['ad','ex','in'])}),()=>G.hearSent({frame:'SCV',prep:pick(['ad','ex','in'])}),()=>G.compose({frame:'SCV',prep:pick(['ad','ex','in'])}),()=>G.read({frame:'SCV',prep:'cum'})])(),6,18,'to, from, in'),
  ()=>G.form({frame:'SCV',role:'A',prep:'ad',acase:'acc',A:'oppidum',hint:true}),()=>G.form({frame:'SCV',role:'A',prep:'ex',acase:'abl',A:'casa',hint:true}),()=>G.form({frame:'SCV',role:'A',prep:'in',acase:'abl',A:'templum',hint:true}),
  ()=>G.dictate({w:'ad'}),()=>G.dictate({w:'ex'}),
  drill(()=>pick([()=>G.form({frame:'SCV',role:'A',prep:pick(['ad','ex','in','cum'])}),()=>G.compose({frame:'SCV',prep:pick(['ad','ex','in','cum'])}),()=>G.read({frame:'SCV',prep:pick(['ad','ex','in','cum'])})])(),5,15,'little words and endings'),
  T(`<h2>Little words, big effect</h2><p>You now say <i>to</i>, <i>out of</i>, <i>in</i> and <i>with</i>. In real Latin these words are everywhere.</p>`,{btn:'Finish'})
]},
{id:26,title:'In or into?',min:9,steps:()=>[
  T(`<h2>Lesson 26 · In or into?</h2><p>One little word, two meanings: <b>in</b>. The <b>ending</b> tells you which.</p>`,{btn:'Begin'}),
  T(()=>`<h2>In + ablative = in. In + accusative = into.</h2>${H('lupus '+'in '+hx('oppid','ō')+' ambulat.','The wolf walks <b>in</b> the town.<br><span class="mute">(it is already there)</span>')}${H('lupus '+'in '+hx('oppid','um')+' ambulat.','The wolf walks <b>into</b> the town.<br><span class="mute">(it is going there)</span>')}
    <div class="rule">With <b>in</b>: ablative (<b>-${AC}</b>, <b>-${OC}</b>) = <b>where</b> it is. Accusative (<b>-m</b>) = <b>where it is going</b>. ${spk(['lupus','in','oppidō','ambulat'])} ${spk(['lupus','in','oppidum','ambulat'])}</div>
    <div class="note">The same idea is why <b>ad</b> takes the accusative: it also means going <i>towards</i>.</div>`,{intro:['r:inacc'],btn:'Practise',say:['lupus','in','oppidō','ambulat']}),
  ()=>G.tap({frame:'SCV',S:'lupus',prep:'in',acase:'abl',A:'oppidum',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.tap({frame:'SCV',S:'lupus',prep:'in',acase:'acc',A:'oppidum',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.read({frame:'SCV',S:'puella',prep:'in',acase:'abl',A:'casa',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.read({frame:'SCV',S:'puella',prep:'in',acase:'acc',A:'casa',v:'ambulat',order:'SCV',hl:true}),
  T(`<p>Highlighting off. Is it <b>in</b> or <b>into</b>? Look at the ending.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SCV',prep:'in'}),()=>G.who({frame:'SCV',prep:'in'}),()=>G.tap({frame:'SCV',prep:'in'}),()=>G.hearSent({frame:'SCV',prep:'in'}),()=>G.compose({frame:'SCV',prep:'in'}),()=>G.read({frame:'SCV',prep:pick(['ad','ex','cum'])})])(),7,20,'in or into'),
  ()=>G.form({frame:'SCV',role:'A',prep:'in',acase:'acc',A:'oppidum',hint:true}),()=>G.form({frame:'SCV',role:'A',prep:'in',acase:'abl',A:'casa',hint:true}),
  ()=>G.form({frame:'SCV',role:'A',prep:'in',acase:pick(['abl','acc'])}),()=>G.compose({frame:'SCV',prep:'in',acase:'acc'}),
  T(`<h2>Where, and where to</h2><p>Latin marks the difference between <i>being</i> somewhere and <i>going</i> there by one ending. English needs two words (<i>in</i> / <i>into</i>).</p>`,{btn:'Finish'})
]},
{id:27,title:'Review day',min:12,steps:()=>[
  T(`<h2>Lesson 27 · Review day</h2><p>No new ideas. A passage built only from what you know, then a long mixed set.</p>`,{btn:'Begin'}),
  T(()=>{const s=STORIES.find(x=>x.id==='s24');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  {kind:'drill',gen:mixed,n:26,label:'mixed'},
  T(`<h2>Prototype checkpoint</h2><p>You have now met the first and second declensions, which cover a large share of Latin nouns. Caesar also leans heavily on the <b>third declension</b> and on the <b>past tense</b>. Those are the next two big steps.</p>`,{btn:'Finish'})
]},
/* ===== Unit 6: the third declension ===== */
{id:28,title:'Kings and soldiers',min:11,steps:()=>[
  T(`<h2>Lesson 28 · Kings and soldiers</h2><p>A fourth kind of noun: the <b>third declension</b>. Caesar uses it constantly: <i>rex</i> (king), <i>miles</i> (soldier), <i>dux</i> (leader).</p><p class="mute">Four new words, then a surprise: these nouns have no regular doer ending.</p>`,{btn:'Begin'}),
  wordTeach('rex'),wordTeach('miles'),
  mcLat2En('rex',['miles','poeta']),mcEn2Lat('miles',['rex','nauta']),()=>G.hearWord('rex',['miles','dux','poeta']),
  wordTeach('dux'),wordTeach('homo'),
  mcLat2En('dux',['homo','rex']),mcEn2Lat('homo',['dux','miles']),()=>G.hearWord('homo',['dux','rex','miles']),
  T(()=>`<h2>The doer is the dictionary word. The receiver ends in -em.</h2>${H('rex '+hx('mīlit','em')+' videt.','The king sees the soldier.')}${H('miles '+hx('rēg','em')+' videt.','The soldier sees the king.')}
    <table class="tbl"><tr><th></th><th>rex</th><th>miles</th><th>dux</th></tr><tr><td>does it</td><td>rex</td><td>miles</td><td>dux</td></tr><tr><td>gets it</td><td>rēg<span class="m">em</span></td><td>mīlit<span class="m">em</span></td><td>duc<span class="m">em</span></td></tr></table>
    <div class="rule">These nouns have <b>no doer ending</b>: you learn the doer form as the word itself. The receiver is the <b>stem + -em</b>, and the stem is not always the word minus a letter (<i>rex</i> → <i>rēg-</i>, <i>miles</i> → <i>mīlit-</i>). ${spk(['rex','mīlitem','videt'])}</div>`,{intro:['r:c3'],btn:'Practise',say:['rex','mīlitem','videt']}),

  ()=>G.form(f1({frame:'SOV',role:'S',S:'rex',O:'puella',v:'videt',order:'SOV',hint:true})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'puella',O:'dux',v:'amat',order:'SOV',hint:true})),

  ()=>G.compose(f1({frame:'SOV',S:'dux',O:'rex',v:'laudat'})),

{id:29,title:'Whose is it? (third)',min:10,steps:()=>[
  T(`<h2>Lesson 29 · Whose is it? (third)</h2><p>Owners again. For third-declension nouns “of the king” ends in <b>-is</b>.</p>`,{btn:'Begin'}),
  wordTeach('urbs'),wordTeach('mons'),
  mcLat2En('urbs',['mons','casa']),mcEn2Lat('mons',['urbs','oppidum']),()=>G.hearWord('mons',['urbs','oppidum','rex']),
  T(()=>`<h2>The owner ends in -is</h2>${H('puella '+hx('rēg','is')+' rosam videt.','The girl sees the <b>king’s</b> rose.')}${H('miles '+hx('duc','is')+' urbem amat.','The soldier loves the <b>leader’s</b> city.')}
    <table class="tbl"><tr><th></th><th>puella</th><th>amicus</th><th>rex</th></tr><tr><td>of the …</td><td>puell<span class="m">ae</span></td><td>amīc<span class="m">${IC}</span></td><td>rēg<span class="m">is</span></td></tr></table>
    <div class="rule">Third declension: owner = stem + <b>-is</b>. ${spk(['puella','rēgis','rosam','videt'])}</div>
    <div class="note"><b>urbs</b> (city) and <b>mons</b> (mountain) name things, so they are mostly receivers: <b>urbem</b>, <b>montem</b>. Same <b>-em</b> as before.</div>`,{intro:['r:gen3'],btn:'Practise',say:['puella','rēgis','rosam','videt']}),
  ()=>G.tap({frame:'SGOV',S:'puella',G:'rex',O:'rosa',v:'videt',order:'SXV',idx:1,hl:true}),
  ()=>G.who({frame:'SGOV',S:'poeta',G:'dux',O:'urbs',v:'amat',order:'SXV',idx:1,hl:true}),
  ()=>G.read({frame:'SGOV',S:'nauta',G:'miles',O:'mons',v:'videt',order:'SXV',hl:true}),
  T(`<p>Highlighting off. The owner can come before or after the thing, and the sentence can be shuffled.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SGOV',G:c3N()}),()=>G.who({frame:'SGOV',G:c3N()}),()=>G.tap({frame:'SGOV',G:c3N()}),()=>G.hearSent({frame:'SGOV',G:c3N()}),()=>G.compose({frame:'SGOV',G:c3N()}),()=>G.end3Role({kind:'gen3'}),()=>G.read({frame:'SGOV'})])(),6,18,'whose is it'),
  ()=>G.form({frame:'SGOV',role:'G',G:'rex',hint:true}),()=>G.form({frame:'SGOV',role:'G',G:c3N()}),
  ()=>G.paradigm({cn:['gen','s'],n:c3N()}),()=>G.dictate({w:'dux'}),
  T(`<h2>Three ways to say “of”</h2><p><b>-ae</b> (puella), <b>-${IC}</b> (amicus), <b>-is</b> (rex). The job is the same each time; only the ending changes with the noun.</p>`,{btn:'Finish'})
]},
{id:30,title:'To, with, in (third)',min:11,steps:()=>[
  T(`<h2>Lesson 30 · To, with, in (third)</h2><p>Two more endings for third-declension nouns: <b>-${IC}</b> for “to” and <b>-e</b> for “with”, “in” and “out of”.</p>`,{btn:'Begin'}),
  T(()=>`<h2>-${IC} = to / for. -e = with, in, out of.</h2>${H('puella '+hx('rēg','ī')+' rosam dat.','The girl gives the rose <b>to the king</b>.')}${H('puella cum '+hx('rēg','e')+' ambulat.','The girl walks <b>with the king</b>.')}${H('miles in '+hx('urb','e')+' ambulat.','The soldier walks <b>in the city</b>.')}${H('dux ex '+hx('urb','e')+' ambulat.','The leader walks <b>out of the city</b>.')}${H('homo ad '+hx('mont','em')+' ambulat.','The man walks <b>to the mountain</b>.')}
    <table class="tbl"><tr><th></th><th>amicus</th><th>rex</th></tr><tr><td>to / for</td><td>amīc<span class="m">${OC}</span></td><td>rēg<span class="m">${IC}</span></td></tr><tr><td>with / in / out of</td><td>amīc<span class="m">${OC}</span></td><td>rēg<span class="m">e</span></td></tr></table>
    <div class="rule">Dative: <b>-${IC}</b>. Ablative (after <b>cum</b>, <b>in</b>, <b>ex</b>): <b>-e</b>. After <b>ad</b> you still see <b>-em</b>. ${spk(['puella','rēgī','rosam','dat'])} ${spk(['puella','cum','rēge','ambulat'])}</div>`,{intro:['r:dat3','r:abl3'],btn:'Practise',say:['puella','rēgī','rosam','dat']}),
  ()=>G.who({frame:'SDOV',S:'puella',D:'rex',O:'rosa',v:'dat',order:'SDOV',idx:1,hl:true}),
  ()=>G.tap({frame:'SDOV',S:'agricola',D:'miles',O:'donum',v:'dat',order:'SDOV',idx:2,hl:true}),
  ()=>G.read({frame:'SCV',S:'poeta',prep:'cum',acase:'abl',A:'dux',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.read({frame:'SCV',S:'nauta',prep:'in',acase:'abl',A:'urbs',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.read({frame:'SCV',S:'miles',prep:'ex',acase:'abl',A:'mons',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.read({frame:'SCV',S:'puella',prep:'ad',acase:'acc',A:'urbs',v:'ambulat',order:'SCV',hl:true}),
  T(`<p>Highlighting off. For each ending ask: <b>-is</b> = of, <b>-${IC}</b> with <b>dat</b> = to, <b>-e</b> = with / in / out of.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.end3Role({kind:'dat3'}),()=>G.end3Role({kind:'abl3'}),()=>G.end3Role({kind:'gen3'}),()=>G.read({frame:'SDOV',D:c3N()}),()=>G.read({frame:'SCV',prep:pick(['cum','in','ex','ad'])}),()=>G.hearSent({frame:'SCV',prep:pick(['in','ex','ad'])}),()=>G.who({frame:'SDOV',D:c3N()})])(),7,20,'to, with, in'),
  ()=>G.form({frame:'SDOV',role:'D',D:'rex',hint:true}),()=>G.form({frame:'SCV',role:'A',prep:'cum',A:'dux',hint:true}),()=>G.form({frame:'SCV',role:'A',prep:'in',acase:'abl',A:'urbs',hint:true}),
  ()=>G.compose({frame:'SDOV',D:c3N()}),()=>G.compose({frame:'SCV',prep:pick(['in','ex'])}),
  T(`<h2>All the singular endings</h2><p>For rex you now have <b>-em</b>, <b>-is</b>, <b>-${IC}</b> and <b>-e</b>. Every one of them is unique, so none can be confused with another.</p>`,{btn:'Finish'})
]},
{id:31,title:'Many kings',min:10,steps:()=>[
  T(`<h2>Lesson 31 · Many kings</h2><p>The plural of third-declension nouns ends in <b>-${EC}s</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>One ending for many doers and many receivers</h2>${H(hx('rēg','ēs')+' mīlitem '+hx('vide','nt')+'.','The kings see the soldier.')}${H('rex '+hx('mīlit','ēs')+' videt.','The king sees the soldiers.')}
    <table class="tbl"><tr><th></th><th>One</th><th>More than one</th></tr><tr><td>does it</td><td>rex</td><td>rēg<span class="m">${EC}s</span></td></tr><tr><td>gets it</td><td>rēg<span class="m">em</span></td><td>rēg<span class="m">${EC}s</span></td></tr></table>
    <div class="rule"><b>-${EC}s</b> is used for both many doers and many receivers. Use the <b>verb</b> (<b>-nt</b> for many doers) and the <b>other noun</b> to decide. ${spk(['rēgēs','mīlitem','vident'])}</div>
    <div class="note">If both nouns in a sentence were plural <b>-${EC}s</b> words, the form alone could not tell you who does what; only sense and context could. Real Latin has such sentences. Here we keep to ones where the endings do decide.</div>`,{intro:['r:pl3'],btn:'Practise',say:['rēgēs','mīlitem','vident']}),
  ()=>G.howMany(f1({frame:'SOV',role:'S',S:'rex',sn:'p',hl:true,order:'SOV'})),
  ()=>G.howMany(f1({frame:'SOV',role:'O',S:'puella',O:'miles',on:'p',hl:true,order:'SOV'})),
  ()=>G.tap(f1({frame:'SOV',S:'dux',O:'puella',sn:'p',v:'amat',idx:0,hl:true,order:'SOV'})),
  ()=>G.who(f1({frame:'SOV',S:'puella',O:'homo',on:'p',v:'laudat',idx:1,hl:true,order:'SOV'})),
  ()=>G.read(f1({frame:'SOV',S:'rex',O:'puella',on:'s',sn:'p',v:'videt',hl:true,order:'SOV'})),
  T(`<p>Highlighting off. One or many, doing or getting.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(f1({frame:'SOV',S:c3N(),sn:'p'})),()=>G.read(f1({frame:'SOV',O:c3N(),on:'p'})),()=>G.who(f1({frame:'SOV',S:c3N()})),()=>G.howMany({frame:'SOV',S:c3N()}),()=>G.hearSent(f1({frame:'SOV',O:c3N(),on:'p'})),()=>G.tap(f1({frame:'SOV',S:c3N(),sn:'p'}))])(),7,20,'many kings'),
  ()=>G.form(f1({frame:'SOV',role:'S',S:'rex',sn:'p',O:'puella',v:'videt',hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'puella',O:'miles',on:'p',v:'amat',hint:true,order:'SOV'})),
  ()=>G.dictate({w:'rex',num:'p'}),()=>G.paradigm({cn:['nom','p'],n:c3N()}),
  ()=>G.compose(f1({frame:'SOV',S:c3N(),sn:'p',O:'puella'})),
  T(`<h2>Six forms of rex</h2><p>rex · regis · regī · rēgem · rege · regēs. Together with the earlier nouns you can now read a very large share of the nouns in Caesar.</p>`,{btn:'Finish'})
]},
{id:32,title:'Rivers and bodies',min:10,steps:()=>[
  T(`<h2>Lesson 32 · Rivers and bodies</h2><p>The third declension also has <b>neuter</b> nouns, like <b>flumen</b> (river). They behave like <b>oppidum</b>: one form for doing and getting.</p>`,{btn:'Begin'}),
  wordTeach('flumen'),wordTeach('corpus'),
  mcLat2En('flumen',['corpus','urbs']),mcEn2Lat('corpus',['flumen','mons']),()=>G.hearWord('flumen',['corpus','urbs','oppidum']),
  T(()=>`<h2>Neuter: one form, and -a for many</h2>${H('miles flumen videt.','The soldier sees the river.')}${H('miles '+hx('flūmin','a')+' videt.','The soldier sees the rivers.')}
    <table class="tbl"><tr><th></th><th>One</th><th>More than one</th></tr><tr><td>does it</td><td>flumen</td><td>flūmin<span class="m">a</span></td></tr><tr><td>gets it</td><td>flumen</td><td>flūmin<span class="m">a</span></td></tr><tr><td>of</td><td>flūmin<span class="m">is</span></td><td></td></tr><tr><td>with / in</td><td>flūmin<span class="m">e</span></td><td></td></tr></table>
    <div class="rule">Like <b>oppidum</b>, a neuter word has the <b>same form</b> for doer and receiver, and its plural ends in <b>-a</b>. You decide by sense: a river cannot see. Other endings follow <b>rex</b>: <b>-is</b>, <b>-${IC}</b>, <b>-e</b>. ${spk(['flumen','flūmina'])}</div>`,{intro:['r:n3'],btn:'Practise',say:['flumen','flūmina']}),
  ()=>G.tap(f1({frame:'SOV',S:'miles',O:'flumen',v:'videt',order:'SOV',idx:1,hl:true})),
  ()=>G.who(f1({frame:'SOV',S:'dux',O:'corpus',v:'portat',order:'SOV',idx:1,hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'nauta',O:'flumen',on:'p',v:'videt',order:'SOV',hl:true})),
  ()=>G.read({frame:'SGOV',S:'puella',G:'rex',O:'flumen',v:'videt',order:'SXV',hl:true}),
  ()=>G.read({frame:'SCV',S:'nauta',prep:'in',acase:'abl',A:'flumen',v:'ambulat',order:'SCV',hl:true}),
  T(`<p>Highlighting off. Neuter words turn up as receivers, as things owned, and after <b>in</b>, <b>ex</b> and <b>ad</b>.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(f1({frame:'SOV',O:n3N()})),()=>G.who(f1({frame:'SOV',O:n3N()})),()=>G.tap(f1({frame:'SOV',O:n3N()})),()=>G.howMany({frame:'SOV',role:'O',O:n3N()}),()=>G.read({frame:'SGOV',O:n3N()}),()=>G.read({frame:'SCV',prep:'in',A:'flumen'}),()=>G.hearSent(f1({frame:'SOV',O:n3N()}))])(),6,18,'neuter words'),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'miles',O:'flumen',on:'s',v:'videt',hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'dux',O:'corpus',on:'p',v:'portat',hint:true,order:'SOV'})),
  ()=>G.dictate({w:'flumen',num:'p'}),()=>G.dictate({w:'corpus'}),
  ()=>G.compose(f1({frame:'SOV',O:n3N()})),()=>G.paradigm({cn:['acc','p'],n:n3N()}),
  T(`<h2>Two kinds of neuter</h2><p>oppidum (<b>-um</b>, plural <b>-a</b>) and flumen (plural <b>-a</b>). Neuter plurals always end in <b>-a</b>.</p>`,{btn:'Finish'})
]},
{id:33,title:'Brave and noble',min:11,steps:()=>[
  T(`<h2>Lesson 33 · Brave and noble</h2><p>Describing words that go with third-declension endings: <b>fortis</b> (brave) and <b>nobilis</b> (noble). They have only <b>two</b> sets of endings: one for masculine <i>and</i> feminine, one for neuter.</p>`,{btn:'Begin'}),
  wordTeach('fortis'),wordTeach('nobilis'),
  mcLat2En('fortis',['nobilis','magna']),mcEn2Lat('nobilis',['fortis','bona']),()=>G.hearWord('fortis',['nobilis','bona','magna']),
  T(()=>`<h2>Two sets of endings</h2><table class="tbl"><tr><th></th><th>Masc. / fem.</th><th>Neuter</th></tr><tr><td>does it</td><td>fort<span class="m">is</span></td><td>fort<span class="m">e</span></td></tr><tr><td>gets it</td><td>fort<span class="m">em</span></td><td>fort<span class="m">e</span></td></tr><tr><td>many doers</td><td>fort<span class="m">ēs</span></td><td>fort<span class="m">ia</span></td></tr></table>
    ${H('rex '+hx('fort','is')+' mīlitem laudat.','The brave king praises the soldier.')}${H('dux rēgem '+hx('fort','em')+' videt.','The leader sees the brave king.')}${H('miles '+hx('nōbil','e')+' flumen videt.','The soldier sees the noble river.')}
    <div class="rule">The describing word matches its noun in number and job, as always. But <b>rex</b>, <b>puella</b> and <b>poeta</b> all take the <b>same</b> <b>fortis</b>: masculine and feminine share endings. ${spk(['fortis','fortem','forte'])}</div>
    <div class="note">The ablative of these words ends in <b>-${IC}</b> (<i>forti</i>), not <i>-e</i>. We will meet that soon.</div>`,{intro:['r:adj3'],btn:'Practise',say:['fortis','fortem','forte']}),
  ()=>G.tap({frame:'SOV',S:'rex',O:'miles',v:'videt',adj:{S:'fortis',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',idx:2,hl:true}),
  ()=>G.read({frame:'SOV',S:'puella',O:'dux',v:'laudat',adj:{S:'fortis',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',hl:true}),
  ()=>G.read({frame:'SOV',S:'dux',O:'rex',v:'amat',adj:{S:null,O:'fortis'},af:{O:false},sn:'s',on:'s',order:'SOV',hl:true}),
  ()=>G.read({frame:'SOV',S:'miles',O:'flumen',v:'videt',adj:{S:null,O:'nobilis'},af:{O:false},sn:'s',on:'s',order:'SOV',hl:true}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the describing word to the noun it describes.</p>`,{btn:'Draw'}),
    ()=>G.arrow({frame:'SOV',S:'dux',O:'puella',v:'videt',adj:{S:'fortis',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',hl:true,arrow:'adj'})),
  T(`<h2>Now write it</h2><p>Is the noun masculine/feminine or neuter? Then pick the set of endings.</p>`,{btn:'Try it'}),
  ()=>G.form({frame:'SOV',role:'Sa',S:'rex',O:'puella',v:'amat',adj:{S:'fortis',O:null},af:{S:false},sn:'s',on:'s',order:'SOV',hint:true}),
  ()=>G.form({frame:'SOV',role:'Oa',S:'miles',O:'flumen',v:'videt',adj:{S:null,O:'nobilis'},af:{O:false},sn:'s',on:'s',order:'SOV',hint:true}),
  ()=>G.dictate({w:'fortis'}),()=>G.dictate({w:'nobilis'}),
  T(`<p>Highlighting off. Describing words can come before or after their noun.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(adj3Fix()),()=>G.tap(Object.assign(adj3Fix(),{idx:2})),()=>G.compose(adj3Fix()),()=>G.hearSent(adj3Fix()),()=>G.form(Object.assign(adj3Fix(),{role:'Sa'})),()=>G.read({frame:'SE',S:c3N(),pred:{adj:'fortis'},sn:pick(['s','p'])}),()=>G.read({frame:'SOV',S:'miles',O:n3N(),adj:{S:null,O:'nobilis'},af:{O:Math.random()<.5},sn:'s',on:pick(['s','p'])})])(),7,22,'describing words'),
  T(`<h2>Five kinds of describing word ending</h2><p>You can now describe masculine, feminine and neuter nouns, in first, second and third declension.</p>`,{btn:'Finish'})
]},
{id:34,title:'Reading day',min:11,steps:()=>[
  T(`<h2>Lesson 34 · Reading day</h2><p>No new grammar. A passage built only from what you know, then a long mixed set.</p>`,{btn:'Begin'}),
  T(()=>{const s=STORIES.find(x=>x.id==='s32');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  {kind:'drill',gen:mixed,n:24,label:'mixed'},
  T(`<h2>Unit 6 complete</h2><p>You have now met the three big noun families of Latin: first, second and third declension. Next: the <b>past tense</b>, which Caesar uses for almost everything he narrates.</p>`,{btn:'Finish'})
]},

/* ===== Unit 7: the past tense ===== */
{id:35,title:'Yesterday',min:11,steps:()=>[
  T(`<h2>Lesson 35 · Yesterday</h2><p>Everything so far has been in the <b>present</b>: <i>amat</i>, “loves”. Caesar writes about the <b>past</b>. Latin has a different verb form for it.</p><p class="mute">Five verbs, each with its own past form, and one pattern to spot.</p>`,{btn:'Begin'}),
  perfTeach('amat'),perfTeach('laudat'),
  ()=>G.perfWord('amat','lat2en'),()=>G.perfWord('laudat','en2lat'),
  perfTeach('portat'),perfTeach('vocat'),perfTeach('ambulat'),
  ()=>G.perfWord('portat','lat2en'),()=>G.perfWord('vocat','en2lat'),()=>G.perfWord('ambulat','pres'),

  T(()=>`<h2>The verb shows who</h2>${H('puellam '+hx('am','ō')+'.','<b>I</b> love the girl.')}${H('puellam '+hx('amā','s')+'.','<b>You</b> love the girl.')}${H('puellam amat.','<b>He / she</b> loves the girl.')}

    <div class="note">The same endings work for <b>videt</b> (<i>videō</i>, <i>vidēs</i>), <b>audit</b> (<i>audiō</i>, <i>audīs</i>) and <b>dat</b> (<i>dō</i>, <i>dās</i>). <b>est</b> is irregular: <b>sum</b> (I am), <b>es</b> (you are), <b>est</b> (is).</div>`,{intro:['r:p1'],btn:'Practise',say:['puellam','amō']}),

    <div class="note">The odd pasts follow the same endings: <i>vīdimus</i>, <i>vīdistis</i>; <i>dedimus</i>, <i>dedistis</i>; <i>fuimus</i> (we were), <i>fuistis</i> (you all were).</div>`,{intro:['r:pp2'],btn:'Practise',say:['puellam','amāvimus']}),

  T(`<h2>Now write it</h2>`,{btn:'Try it'}),

{id:43,title:'Me and you',min:12,steps:()=>[
  T(`<h2>Lesson 43 · Me and you</h2><p>Latin does have words for <i>I</i>, <i>you</i>, <i>we</i>. You only use them for <b>emphasis</b>. They are also how you say <b>me</b>, <b>you</b> and <b>us</b> as receivers.</p>`,{btn:'Begin'}),
  wordTeach('ego'),wordTeach('tu'),
  mcLat2En('ego',['tu','nos','vos']),mcEn2Lat('tu',['ego','nos','vos']),()=>G.hearWord('ego',['tu','nos','vos']),
  wordTeach('nos'),wordTeach('vos'),
  mcLat2En('nos',['vos','ego','tu']),mcEn2Lat('vos',['nos','ego','tu']),()=>G.hearWord('vos',['nos','ego','tu']),
  T(()=>`<h2>Doer and receiver forms</h2><table class="tbl"><tr><th></th><th>does it</th><th>gets it</th></tr>
    <tr><td>I / me</td><td>ego</td><td>m<span class="m">ē</span></td></tr><tr><td>you (one) / you</td><td>tū</td><td>t<span class="m">ē</span></td></tr><tr><td>we / us</td><td>nōs</td><td>nōs</td></tr><tr><td>you all</td><td>vōs</td><td>vōs</td></tr></table>
    ${H('<b>ego</b> '+'<b>tē</b> amō.','I love you.')}${H('<b>tū</b> <b>mē</b> amās.','You love me.')}${H('puella <b>mē</b> videt.','The girl sees me.')}${H('tē amō.','I love you. (no <i>ego</i> needed)')}
    <div class="rule">With <b>ego</b>, <b>tū</b> in the sentence the speaker is <b>stressing</b> who: “<i>I</i> love you!” Without them the verb ending does the job. The receiver forms <b>mē</b> and <b>tē</b> are needed. ${spk(['ego','tē','amō'])}</div>
    <div class="note"><b>nōs</b> and <b>vōs</b> look the same for doing and getting. The verb tells you which: <i>nōs vōs amāmus</i> is “we love you all”.</div>`,{intro:['r:pron'],btn:'Practise',say:['ego','tē','amō']}),
  ()=>G.read(fp({frame:'SOV',per:'1s',pd:false,O:'tu',v:'amat',order:'SOV',hl:true})),
  ()=>G.read(fp({frame:'SOV',per:'2s',pd:false,O:'ego',v:'laudat',order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'puella',O:'ego',v:'videt',per:null,order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'rex',O:'tu',v:'laudat',per:null,order:'OSV',hl:true})),
  ()=>G.read(fp({frame:'SOV',per:'1p',pd:true,O:'tu',v:'amat',order:'SOV',hl:true})),
  ()=>G.read(fp({frame:'SOV',per:'2s',pd:true,O:'nos',v:'vocat',order:'SOV',hl:true})),
  ()=>G.who(f1({frame:'SOV',S:'dux',O:'ego',v:'audit',per:null,idx:1,order:'SOV',hl:true})),
  T(`<p>Highlighting off. Who loves whom?</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SOV',O:pick(PRONS),per:null}),()=>G.read({frame:'SOV',O:pick(['ego','tu']),per:pick(['1s','2s']),pd:false}),()=>G.tap({frame:'SOV',O:pick(PRONS),per:null,idx:1}),()=>G.who({frame:'SOV',O:pick(PRONS),per:null,idx:1}),()=>G.hearSent({frame:'SOV',O:pick(PRONS),per:null}),()=>G.person({per:pick(['1s','2s','1p','2p'])})])(),8,24,'me and you'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form(f1({frame:'SOV',S:'puella',O:'tu',v:'amat',per:null,role:'O',hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',S:'rex',O:'ego',v:'laudat',per:null,role:'O',hint:true,order:'SOV'})),
  ()=>G.dictate({w:'ego'}),()=>G.dictate({w:'tu'}),()=>G.dictate({w:'nos'}),
  ()=>G.compose(f1({frame:'SOV',S:'dux',O:'tu',v:'videt',per:null})),
  T(`<h2>Me, you, us</h2><p>Four small words that appear in almost every Latin text. <i>tē amō</i> is a complete sentence.</p>`,{btn:'Finish'})
]},
{id:44,title:'Reading day: speaking Latin',min:11,steps:()=>[
  T(`<h2>Lesson 44 · Reading day: speaking Latin</h2><p>No new grammar. Read a short exchange built only from what you know, then mix everything.</p>`,{btn:'Begin'}),

  {kind:'drill',gen:mixed,n:26,label:'mixed'},

/* ===== Unit 9: Caesar's first sentence ===== */
{id:45,title:'All, three, a part',min:12,steps:()=>[
  T(`<h2>Lesson 45 · All, three, a part</h2><p>Three words that Caesar uses in his first sentence: <b>omnis</b> (all, whole), <b>trēs</b> (three) and <b>pars</b> (part).</p>`,{btn:'Begin'}),
  wordTeach('omnis'),wordTeach('tres'),wordTeach('pars'),
  mcLat2En('omnis',['tres','pars','fortis']),mcEn2Lat('tres',['omnis','pars','fortis']),mcLat2En('pars',['omnis','tres','urbs']),()=>G.hearWord('tres',['omnis','pars','fortis']),
  T(()=>`<h2>omnis: whole or all</h2><table class="tbl"><tr><th></th><th>Masc. / fem.</th><th>Neuter</th></tr><tr><td>one</td><td>omn<span class="m">is</span></td><td>omn<span class="m">e</span></td></tr><tr><td>many</td><td>omn<span class="m">ēs</span></td><td>omn<span class="m">ia</span></td></tr></table>
    ${H('dux '+hx('omn','em')+' urbem videt.','The leader sees the <b>whole</b> city.')}${H(hx('omn','ēs')+' mīlitēs rēgem laudant.','<b>All</b> the soldiers praise the king.')}
    <div class="rule"><b>omnis</b> is a describing word like <b>fortis</b> (same endings). With <b>one</b> thing it means “whole”; with <b>many</b> it means “all”. ${spk(['omnem','urbem'])} ${spk(['omnēs','mīlitēs'])}</div>
    <div class="note">It sits with things (<i>omnis urbs</i>, the whole city), not with single people.</div>`,{btn:'Next',say:['omnem','urbem']}),
  T(()=>`<h2>trēs: three</h2><table class="tbl"><tr><th></th><th>Masc. / fem.</th><th>Neuter</th></tr><tr><td>three</td><td>tr<span class="m">ēs</span></td><td>tr<span class="m">ia</span></td></tr></table>
    ${H(hx('tr','ēs')+' mīlitēs urbem vident.','Three soldiers see the city.')}${H('dux '+hx('tr','ia')+' templa videt.','The leader sees three temples.')}
    <div class="rule"><b>trēs</b> is only ever plural. It has the same endings as the plural of <b>fortis</b>: <b>trēs</b> for masculine and feminine, <b>tria</b> for neuter. ${spk(['trēs','mīlitēs'])}</div>`,{btn:'Next',say:['trēs','mīlitēs']}),
  T(()=>`<h2>pars: a part</h2>${H('rex urbis '+hx('part','em')+' videt.','The king sees a part of the city.')}${H('miles '+hx('part','ēs')+' urbis videt.','The soldier sees the parts of the city.')}
    <div class="rule"><b>pars</b> follows <b>rex</b> exactly: <b>pars</b>, <b>partis</b>, <b>partem</b>, <b>partēs</b>. (We write the owner with <b>-is</b>: <i>urbis</i>, “of the city”.) ${spk(['partem','urbis'])}</div>`,{btn:'Practise',say:['partem','urbis']}),
  ()=>G.read(f1({frame:'SOV',S:'miles',sn:'p',O:'urbs',v:'videt',adj:{S:'tres',O:null},af:{S:true},order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'dux',O:'urbs',v:'videt',adj:{S:null,O:'omnis'},af:{O:true},order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'miles',sn:'p',O:'rex',v:'laudat',adj:{S:'omnis',O:null},af:{S:true},order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'dux',O:'templum',on:'p',v:'videt',adj:{S:null,O:'tres'},af:{O:true},order:'SOV',hl:true})),
  ()=>G.read({frame:'SGOV',S:'rex',G:'urbs',O:'pars',v:'videt',order:'SXV',hl:true}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the describing word to the noun it describes.</p>`,{btn:'Draw'}),
    ()=>G.arrow(f1({frame:'SOV',S:'miles',sn:'p',O:'urbs',v:'videt',adj:{S:'tres',O:null},af:{S:true},order:'SOV',hl:true,arrow:'adj'}))),
  T(`<p>Highlighting off. Is it <b>all</b>, <b>whole</b> or <b>three</b>?</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(tresFix()),()=>G.read(tresFix()),()=>G.tap(Object.assign(tresFix(),{idx:2})),()=>G.hearSent(tresFix()),()=>G.compose(tresFix()),()=>G.read({frame:'SGOV',O:'pars'}),()=>G.read(f1({frame:'SOV',O:'pars',on:pick(['s','p'])}))])(),8,24,'all, three, a part'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form(f1({frame:'SOV',role:'Sa',S:'miles',sn:'p',O:'urbs',v:'videt',adj:{S:'tres',O:null},af:{S:true},hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',role:'Oa',S:'dux',O:'urbs',v:'videt',adj:{S:null,O:'omnis'},af:{O:false},hint:true,order:'SOV'})),
  ()=>G.form(f1({frame:'SOV',role:'O',S:'miles',O:'pars',on:'p',v:'videt',hint:true,order:'SOV'})),
  ()=>G.dictate({w:'omnis'}),()=>G.dictate({w:'tres'}),()=>G.dictate({w:'pars'}),
  T(`<h2>Three of Caesar’s words</h2><p>You know <b>omnis</b>, <b>trēs</b> and <b>pars</b>. Two more words and you can read his opening line.</p>`,{btn:'Finish'})
]},
{id:46,title:'Divided',min:11,steps:()=>[
  T(`<h2>Lesson 46 · Divided</h2><p>Some describing words are made from verbs. <b>dīvīsus</b> comes from the verb “to divide” and means <b>divided</b>. <b>parātus</b> means <b>ready</b> (“prepared”).</p>`,{btn:'Begin'}),
  wordTeach('divisus'),wordTeach('paratus'),
  mcLat2En('divisus',['paratus','omnis','fortis']),mcEn2Lat('paratus',['divisus','omnis','fortis']),()=>G.hearWord('divisus',['paratus','omnis','fortis']),
  T(()=>`<h2>They copy the noun, like bonus</h2><table class="tbl"><tr><th>Masc.</th><th>Fem.</th><th>Neuter</th></tr><tr><td>dīvīs<span class="m">us</span></td><td>dīvīs<span class="m">a</span></td><td>dīvīs<span class="m">um</span></td></tr></table>
    ${H('urbs '+hx('dīvīs','a')+' est.','The city <b>is divided</b>.')}${H('oppidum '+hx('dīvīs','um')+' est.','The town is divided.')}${H('mīlitēs '+hx('parāt','ī')+' sunt.','The soldiers are ready.')}${H('dux '+hx('parāt','us')+' fuit.','The leader was ready.')}
    <div class="rule"><b>dīvīsus</b> and <b>parātus</b> work like <b>bonus</b>: they match the noun’s gender, number and job. With <b>est</b> they say what the noun is like. ${spk(['urbs','dīvīsa','est'])}</div>
    <div class="note">Notice the order: <i>urbs dīvīsa est</i>, “city divided is”. <b>est</b> can come after the describing word. <b>parātus</b> only describes living things.</div>`,{btn:'Practise',say:['urbs','dīvīsa','est']}),
  ()=>G.read({frame:'SE',S:'urbs',pred:{adj:'divisus'},sn:'s',t:'pr',order:'SPV',hl:true}),
  ()=>G.read({frame:'SE',S:'oppidum',pred:{adj:'divisus'},sn:'s',t:'pr',order:'SPV',hl:true}),
  ()=>G.read({frame:'SE',S:'miles',pred:{adj:'paratus'},sn:'p',t:'pr',order:'SPV',hl:true}),
  ()=>G.read({frame:'SE',S:'dux',pred:{adj:'paratus'},sn:'s',t:'pf',order:'SPV',hl:true}),
  ()=>G.tap({frame:'SE',S:'mons',pred:{adj:'divisus'},sn:'s',t:'pr',order:'SPV',idx:1,hl:true}),
  ()=>G.read(f1({frame:'SOV',S:'rex',O:'urbs',v:'videt',adj:{S:null,O:'divisus'},af:{O:false},order:'SOV',hl:true})),
  T(`<p>Highlighting off. Find the noun, then match the ending.</p>`,{btn:'Go'}),
  drill(()=>{const a=pick(['divisus','paratus']);return pick([()=>G.read(predFix(a)),()=>G.read(predFix(a)),()=>G.tap(Object.assign(predFix(a),{idx:1})),()=>G.hearSent(predFix(a)),()=>G.compose(predFix(a)),()=>G.form(Object.assign(predFix(a),{role:'P'})),()=>G.read(adjFix())])()},8,24,'divided and ready'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form({frame:'SE',role:'P',S:'urbs',pred:{adj:'divisus'},sn:'s',t:'pr',hint:true,order:'SPV'}),
  ()=>G.form({frame:'SE',role:'P',S:'miles',pred:{adj:'paratus'},sn:'p',t:'pr',hint:true,order:'SPV'}),
  ()=>G.dictate({w:'divisus'}),()=>G.dictate({w:'paratus'}),
  T(`<h2>Words from verbs</h2><p>Latin makes many describing words from verbs. <i>Urbs dīvīsa est</i> is the pattern of Caesar’s first sentence. One lesson to go before you read it.</p>`,{btn:'Finish'})
]},
{id:47,title:'Caesar’s first sentence',min:13,steps:()=>[
  T(`<h2>Lesson 47 · Caesar’s first sentence</h2><p>The opening of <i>De Bello Gallico</i> (<i>The Gallic War</i>), written about 2,000 years ago, is one of the most famous sentences in Latin.</p><p>You know every word of it. There is one name to learn.</p>`,{btn:'Begin'}),
  wordTeach('Gallia'),
  mcLat2En('Gallia',['rosa','casa','urbs']),()=>G.hearWord('Gallia',['rosa','casa','urbs']),
  T(()=>`<h2>The sentence</h2><div class="lat" style="font-size:30px;text-align:center;margin:14px 0">Gallia est omnis dīvīsa in partēs trēs.${spk(['Gallia','est','omnis','dīvīsa','in','partēs','trēs'])}</div>
    <p class="mute" style="text-align:center">Caesar wrote it without the long marks (<i>Gallia est omnis divisa in partes tres</i>).</p>`,{btn:'Take it apart',say:['Gallia','est','omnis','dīvīsa','in','partēs','trēs']}),
  T(()=>`<h2>Word by word</h2><table class="tbl"><tr><th>Latin</th><th>What you know</th></tr>
    <tr><td><b>Gallia</b></td><td>Gaul. A feminine <b>-a</b> word, like <i>puella</i>. It is the doer.</td></tr>
    <tr><td><b>est</b></td><td>is.</td></tr>
    <tr><td><b>omnis</b></td><td>whole. Matches <i>Gallia</i> (one, feminine).</td></tr>
    <tr><td><b>dīvīsa</b></td><td>divided. Feminine <b>-a</b>, matching <i>Gallia</i>.</td></tr>
    <tr><td><b>in</b></td><td>into. Followed by the receiver form.</td></tr>
    <tr><td><b>partēs</b></td><td>parts. Many receivers (<b>-ēs</b>), like <i>rēgēs</i>.</td></tr>
    <tr><td><b>trēs</b></td><td>three. Matches <i>partēs</i>.</td></tr></table>
    <div class="rule"><b>Gallia est omnis dīvīsa</b> = “All Gaul is divided”. <b>in partēs trēs</b> = “into three parts”.<br>Together: <b>All Gaul is divided into three parts.</b></div>`,{intro:['x:caesar1'],btn:'Next'}),
  {kind:'mc',type:'caesar',kcs:['w:Gallia','w:est','w:omnis','w:divisus','w:in','w:pars','w:tres','r:inacc','r:pl3'],eyebrow:'Caesar',

    okMsg:'All Gaul is divided into three parts. This is the first line of Caesar’s Gallic War.',badMsg:()=>'<div class="lat">Gallia est omnis dīvīsa in partēs trēs.</div>“All Gaul is divided into three parts.” <b>dīvīsa</b> matches <b>Gallia</b> (divided); <b>trēs</b> matches <b>partēs</b> (three parts).'},
  {kind:'tap',type:'tap',kcs:['w:Gallia','w:divisus','w:est'],eyebrow:'Caesar',correct:3,
    promptHTML:'Tap the word that means <b>divided</b>.',ts:[{w:'Gallia',role:'S',k:'x'},{w:'est',role:'V',k:'v'},{w:'omnis',role:'Sa',k:'a'},{w:'dīvīsa',role:'P',k:'a'},{w:'in',role:'W',k:'p'},{w:'partēs',role:'A',k:'n'},{w:'trēs',role:'Aa',k:'a'}],hl:false,
    okMsg:'dīvīsa.',badMsg:()=>'<b>dīvīsa</b> means “divided”. It matches <b>Gallia</b>.'},
  {kind:'tap',type:'tap',kcs:['w:Gallia','w:tres','w:pars','r:pl3'],eyebrow:'Caesar',correct:6,
    promptHTML:'Tap the word that means <b>three</b>.',ts:[{w:'Gallia',role:'S',k:'x'},{w:'est',role:'V',k:'v'},{w:'omnis',role:'Sa',k:'a'},{w:'dīvīsa',role:'P',k:'a'},{w:'in',role:'W',k:'p'},{w:'partēs',role:'A',k:'n'},{w:'trēs',role:'Aa',k:'a'}],hl:false,
    okMsg:'trēs.',badMsg:()=>'<b>trēs</b> means “three”. It matches <b>partēs</b>.'},
  {kind:'tap',type:'tap',kcs:['w:Gallia','w:omnis','w:est'],eyebrow:'Caesar',correct:2,
