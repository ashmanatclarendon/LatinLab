    okMsg:'omnis.',badMsg:()=>'<b>omnis</b> means “whole”: <i>omnis Gallia</i>, the whole of Gaul.'},
  T(`<h2>Now a few of your own</h2><p>The same pattern, with words you know.</p>`,{btn:'Go'}),
  ()=>G.read({frame:'SE',S:'urbs',pred:{adj:'divisus'},sn:'s',t:'pr',order:'SPV'}),
  ()=>G.read({frame:'SE',S:'oppidum',pred:{adj:'divisus'},sn:'s',t:'pr',order:'SPV'}),
  {kind:'drill',gen:mixed,n:14,label:'mixed'},
  T(`<h2>You read Caesar</h2><p><i>Gallia est omnis dīvīsa in partēs trēs.</i> That is the first sentence of the Gallic War. Look at the top of your home screen: the whole line has come into focus.</p>`,{btn:'Finish'})
]},
{id:48,title:'Reading day: the campaign',min:12,steps:()=>[
  T(`<h2>Lesson 48 · Reading day: the campaign</h2><p>No new grammar. A short account in Caesar’s style, using the past tense, persons and everything else you know. Then a long mixed set.</p>`,{btn:'Begin'}),
  T(()=>{const s=STORIES.find(x=>x.id==='s46');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  {kind:'drill',gen:mixed,n:30,label:'mixed'},
  T(`<h2>Units 8 and 9 complete</h2><p>You can now read Caesar’s first sentence, say who does something, and use the past tense. Still to come before Caesar becomes comfortable: <b>infinitives</b> (“to love”), <b>participles</b> in more forms, <b>pronouns</b> like <i>is</i> and <i>qui</i>, and the <b>subjunctive</b>.</p>`,{btn:'Finish'})
]},
/* ===== Unit 10: infinitives and indirect speech ===== */
{id:49,title:'To love',min:10,steps:()=>[
  T(`<h2>Lesson 49 · To love</h2><p>Every Latin verb has a “to” form called the <b>infinitive</b>: <i>amāre</i> means “to love”. It has no person and no number: it never changes.</p><p class="mute">You will meet nine of them today. Then two big uses: <b>must</b> and <b>says that</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>The “to” form</h2><table class="tbl"><tr><th>Present</th><th>Infinitive</th><th></th></tr>
    <tr><td>amat</td><td>amā<span class="m">re</span></td><td class="mute">to love</td></tr>
    <tr><td>laudat</td><td>laudā<span class="m">re</span></td><td class="mute">to praise</td></tr>
    <tr><td>portat</td><td>portā<span class="m">re</span></td><td class="mute">to carry</td></tr>
    <tr><td>vocat</td><td>vocā<span class="m">re</span></td><td class="mute">to call</td></tr>
    <tr><td>ambulat</td><td>ambulā<span class="m">re</span></td><td class="mute">to walk</td></tr>
    <tr><td>videt</td><td>vidē<span class="m">re</span></td><td class="mute">to see</td></tr>
    <tr><td>audit</td><td>audī<span class="m">re</span></td><td class="mute">to hear</td></tr>
    <tr><td>dat</td><td>da<span class="m">re</span></td><td class="mute">to give</td></tr>
    <tr><td>est</td><td>esse</td><td class="mute">to be</td></tr></table>
    <div class="rule">Most end in <b>-re</b>. The vowel before it tells you the family: <b>-āre</b> (amāre), <b>-ēre</b> (vidēre), <b>-īre</b> (audīre). <b>esse</b> is irregular. ${spk(['amāre'])} ${spk(['vidēre'])} ${spk(['esse'])}</div>`,{intro:['r:inf'],btn:'Learn them',say:['amāre']}),
  infTeach('amat'),infTeach('laudat'),infTeach('portat'),
  ()=>G.infWord('amat','lat2en'),()=>G.infWord('laudat','en2lat'),()=>G.infWord('portat','lat2en'),()=>G.infWord('amat','pres'),
  infTeach('vocat'),infTeach('ambulat'),
  ()=>G.infWord('vocat','en2lat'),()=>G.infWord('ambulat','lat2en'),()=>G.infWord('laudat','pres'),
  infTeach('videt'),infTeach('audit'),
  ()=>G.infWord('videt','lat2en'),()=>G.infWord('audit','en2lat'),()=>G.infWord('videt','pres'),
  infTeach('dat'),infTeach('est'),
  ()=>G.infWord('dat','lat2en'),()=>G.infWord('est','en2lat'),()=>G.infWord('dat','pres'),
  T(`<p>All nine. Now mix them: listen, choose and write.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.infWord(),()=>G.infWord(),()=>G.infWord(),()=>G.dictate({inf:true}),()=>G.verbForm()])(),7,22,'infinitives'),
  ()=>G.dictate({w:'amat',inf:true}),()=>G.dictate({w:'videt',inf:true}),()=>G.dictate({w:'audit',inf:true}),
  T(`<h2>Nine “to” forms</h2><p>An infinitive on its own is just a verb in dictionary form. Next lesson it starts to do work: <b>puella ambulāre dēbet</b>, “the girl <i>must</i> walk”.</p>`,{btn:'Finish'})
]},
{id:50,title:'Must',min:11,steps:()=>[
  T(`<h2>Lesson 50 · Must</h2><p>One new verb, <b>dēbet</b> (“must”). It works with an infinitive, just as English “must” works with “walk”.</p>`,{btn:'Begin'}),
  wordTeach('debet'),
  mcLat2En('debet',['amat','videt','dat']),mcEn2Lat('debet',['amat','videt','laudat']),()=>G.hearWord('debet',['amat','videt','dat']),
  T(()=>`<h2>The infinitive does not change</h2>${H('puella '+'ambulāre'+' dēbet.','The girl <b>must walk</b>.')}${H('rex urbem vidēre dēbet.','The king <b>must see</b> the city.')}${H('ambulāre dēbeō.','<b>I</b> must walk.')}
    ${persTable('debet','pr',PERS)}
    <div class="rule"><b>dēbet</b> agrees with the doer (<b>dēbet</b> for one, <b>dēbent</b> for many; <b>dēbeō</b> for I). The <b>infinitive stays the same</b>. The object (<i>urbem</i>) is the receiver, as always. ${spk(['puella','ambulāre','dēbet'])}</div>`,{intro:['r:must'],btn:'Practise',say:['puella','ambulāre','dēbet']}),
  ()=>G.tap(sv({S:'puella',Q:{iv:'ambulat'},idx:1})),
  ()=>G.tap(sv({S:'rex',Q:{iv:'videt',O:'urbs',nO:'s'},idx:2})),
  ()=>G.who(sv({S:'dux',Q:{iv:'laudat',O:'miles',nO:'s'},idx:0})),
  ()=>G.read(sv({S:'miles',Q:{iv:'ambulat'}})),
  ()=>G.read(sv({S:'nauta',Q:{iv:'portat',O:'rosa',nO:'s'}})),
  ()=>G.read(sv({S:'poeta',sn:'p',Q:{iv:'vocat',O:'dux',nO:'s'}})),
  ()=>G.read(sv({per:'1s',pd:true,Q:{iv:'amat',O:'puella',nO:'s'}})),
  ()=>G.read(sv({per:'2p',pd:true,Q:{iv:'ambulat'}})),
  T(`<h2>Must, and had to</h2><p>The past of <b>dēbet</b> is <b>dēbuit</b>: “had to”. First the word, then sentences.</p>`,{btn:'Next'}),
  perfTeach('debet'),
  ()=>G.perfWord('debet','lat2en'),()=>G.perfWord('debet','en2lat'),
  ()=>G.read(sv({S:'dux',t:'pf',Q:{iv:'videt',O:'flumen',nO:'s'}})),
  ()=>G.read(sv({per:'1s',pd:true,t:'pf',Q:{iv:'ambulat'}})),
  T(`<p>Highlighting off. Find the infinitive and the doer.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SIV'}),()=>G.read({frame:'SIV'}),()=>G.who({frame:'SIV'}),()=>G.tap({frame:'SIV',idx:0}),()=>G.hearSent({frame:'SIV'}),()=>G.compose({frame:'SIV'}),()=>G.read({frame:'SIV',t:'pf'})])(),8,24,'must'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form(sv({role:'I',S:'puella',Q:{iv:'ambulat'},hint:true,hl:false})),
  ()=>G.form(sv({role:'V',S:'rex',sn:'p',Q:{iv:'videt',O:'urbs',nO:'s'},hint:true,hl:false})),
  ()=>G.form(sv({role:'O',S:'dux',Q:{iv:'laudat',O:'miles',nO:'s'},hint:true,hl:false})),
  ()=>G.dictate({w:'debet'}),()=>G.dictate({w:'debet',t:'pf'}),
  ()=>G.compose(sv({S:'miles',Q:{iv:'ambulat'},hl:false})),
  drill(()=>pick([()=>G.form({frame:'SIV',role:pick(['I','V'])}),()=>G.compose({frame:'SIV'}),()=>G.dictate({inf:true}),()=>G.read({frame:'SIV',t:'pf'})])(),5,16,'writing must'),
  T(`<h2>Verbs that take an infinitive</h2><p>English does this too (“must go”, “wants to go”). The big Latin use comes next: reported speech.</p>`,{btn:'Finish'})
]},
{id:51,title:'Says that (1)',min:12,steps:()=>[
  T(`<h2>Lesson 51 · Says that (1)</h2><p>Caesar reports what people say and think all the time. Latin does it with an <b>infinitive</b>. There is no word for “that”.</p>`,{btn:'Begin'}),
  wordTeach('dicit'),wordTeach('putat'),
  mcLat2En('dicit',['putat','debet','amat']),mcEn2Lat('putat',['dicit','debet','amat']),()=>G.hearWord('dicit',['putat','debet','amat']),
  T(()=>`<h2>The one it is about goes in the accusative</h2>
    <table class="tbl"><tr><th></th><th></th></tr><tr><td>The girl is good.</td><td>puella bona est.</td></tr><tr><td>He says <b>that</b> the girl is good.</td><td>puell<span class="m">am</span> bon<span class="m">am</span> <span class="m">esse</span> dīcit.</td></tr></table>
    ${H('rex '+hx('puell','am')+' '+hx('bon','am')+' esse dīcit.','The king says that the girl is good.')}${H('dux '+hx('mīlit','em')+' ambulāre putat.','The leader thinks that the soldier walks.')}
    <div class="rule">After <b>dīcit</b> (says) or <b>putat</b> (thinks): the one it is about changes to the <b>accusative</b> (<i>puellam</i>, not <i>puella</i>), the describing word matches it (<i>bonam</i>), and the verb becomes an <b>infinitive</b> (<i>esse</i>, <i>ambulāre</i>). ${spk(['rex','puellam','bonam','esse','dīcit'])}</div>
    <div class="note">The accusative here is <b>not</b> a receiver. It is the doer of the infinitive. <b>puellam bonam esse</b> = “that the girl is good”.</div>`,{intro:['r:acinf'],btn:'Practise',say:['rex','puellam','bonam','esse','dīcit']}),
  ()=>G.tap(sq('ad',{S:'rex',Q:{A:'puella',nA:'s',adj:'bona'},idx:1})),
  ()=>G.tap(sq('ad',{S:'dux',Q:{A:'miles',nA:'s',adj:'fortis'},idx:3})),
  ()=>G.who(sq('in',{S:'rex',Q:{A:'puella',nA:'s'},idx:1})),
  ()=>G.read(sq('ad',{S:'rex',Q:{A:'puella',nA:'s',adj:'bona'}})),
  ()=>G.read(sq('in',{S:'dux',v:'putat',Q:{A:'miles',nA:'s'}})),
  ()=>G.read(sq('ad',{S:'poeta',Q:{A:'puella',nA:'s',adj:'pulchra'}})),
  ()=>G.read(sq('in',{S:'rex',Q:{A:'nauta',nA:'p'}})),
  ()=>G.read(sq('ad',{S:'dux',v:'putat',Q:{A:'rex',nA:'s',adj:'nobilis'}})),
  T(`<p>Highlighting off. Who says it, and who does the infinitive?</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SQ'}),()=>G.read({frame:'SQ'}),()=>G.who({frame:'SQ',idx:pick([0,1])}),()=>G.tap({frame:'SQ',idx:1}),()=>G.hearSent({frame:'SQ'}),()=>G.compose({frame:'SQ'})])(),8,24,'says that'),
  T(`<h2>Now write it</h2><p>Remember: accusative for the one it is about, then the infinitive.</p>`,{btn:'Try it'}),
  ()=>G.form(sq('ad',{role:'Qs',S:'rex',Q:{A:'puella',nA:'s',adj:'bona'},hint:true,hl:false})),
  ()=>G.form(sq('ad',{role:'Qp',S:'dux',Q:{A:'puella',nA:'s',adj:'magna'},hint:true,hl:false})),
  ()=>G.form(sq('in',{role:'I',S:'rex',Q:{A:'miles',nA:'s'},hint:true,hl:false})),
  ()=>G.form(sq('in',{role:'V',S:'rex',sn:'p',Q:{A:'puella',nA:'s'},hint:true,hl:false})),
  ()=>G.dictate({w:'dicit'}),()=>G.dictate({w:'putat'}),
  ()=>G.compose(sq('ad',{S:'rex',Q:{A:'puella',nA:'s',adj:'bona'},hl:false})),
  drill(()=>pick([()=>G.form({frame:'SQ',role:pick(['Qs','I','V'])}),()=>G.compose({frame:'SQ'}),()=>G.read({frame:'SQ'}),()=>G.dictate({inf:true})])(),5,18,'writing says that'),
  T(`<h2>Reported speech</h2><p>No “that”, no quotation marks. The accusative and the infinitive carry the whole meaning. This is one of the most important patterns in Caesar.</p>`,{btn:'Finish'})
]},
{id:52,title:'Says that (2)',min:12,steps:()=>[
  T(`<h2>Lesson 52 · Says that (2)</h2><p>Now the infinitive gets an object. Then there are <b>two</b> accusatives in the clause.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Two accusatives</h2>${H('dux '+hx('mīlit','ēs')+' '+hx('urb','em')+' vidēre dīcit.','The leader says that the soldiers see the city.')}${H('rex '+hx('naut','am')+' '+hx('ros','am')+' portāre putat.','The king thinks that the sailor carries the rose.')}
    <div class="rule">First accusative = <b>who does it</b> (<i>mīlitēs</i>). Second accusative = <b>what it is done to</b> (<i>urbem</i>). Then the infinitive. ${spk(['mīlitēs','urbem','vidēre'])}</div>
    <div class="note">Both look like receivers. You decide by <b>sense</b>: soldiers can see a city, but a city cannot see soldiers. Here the thing the infinitive acts on is always something that cannot do the action.</div>`,{intro:['r:acinf2'],btn:'Practise',say:['dux','mīlitēs','urbem','vidēre','dīcit']}),
  ()=>G.tap(sq('tr',{S:'dux',Q:{A:'miles',nA:'p',iv:'videt',O:'urbs',nO:'s'},idx:1})),
  ()=>G.tap(sq('tr',{S:'dux',Q:{A:'miles',nA:'p',iv:'videt',O:'urbs',nO:'s'},idx:2})),
  ()=>G.who(sq('tr',{S:'rex',v:'putat',Q:{A:'nauta',nA:'s',iv:'portat',O:'rosa',nO:'s'},idx:1})),
  ()=>G.read(sq('tr',{S:'dux',Q:{A:'miles',nA:'p',iv:'videt',O:'urbs',nO:'s'}})),
  ()=>G.read(sq('tr',{S:'rex',v:'putat',Q:{A:'nauta',nA:'s',iv:'portat',O:'rosa',nO:'s'}})),
  ()=>G.read(sq('tr',{S:'poeta',Q:{A:'puella',nA:'s',iv:'amat',O:'casa',nO:'s'}})),
  ()=>G.read(sq('tr',{S:'dux',Q:{A:'rex',nA:'s',iv:'laudat',O:'donum',nO:'p'}})),
  T(`<p>Highlighting off. Find the speaker, then the doer, then what it acts on.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SQ',Q:{k:'tr'}}),()=>G.read({frame:'SQ',Q:{k:'tr'}}),()=>G.who({frame:'SQ',Q:{k:'tr'},idx:pick([0,1,2])}),()=>G.tap({frame:'SQ',Q:{k:'tr'},idx:pick([1,2])}),()=>G.hearSent({frame:'SQ',Q:{k:'tr'}}),()=>G.compose({frame:'SQ',Q:{k:'tr'}}),()=>G.read({frame:'SQ'})])(),8,26,'two accusatives'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form(sq('tr',{role:'Qs',S:'dux',Q:{A:'miles',nA:'p',iv:'videt',O:'urbs',nO:'s'},hint:true,hl:false})),
  ()=>G.form(sq('tr',{role:'Qo',S:'rex',v:'putat',Q:{A:'nauta',nA:'s',iv:'portat',O:'rosa',nO:'p'},hint:true,hl:false})),
  ()=>G.form(sq('tr',{role:'I',S:'dux',Q:{A:'puella',nA:'s',iv:'laudat',O:'casa',nO:'s'},hint:true,hl:false})),
  ()=>G.compose(sq('tr',{S:'rex',Q:{A:'miles',nA:'s',iv:'videt',O:'flumen',nO:'s'},hl:false})),
  drill(()=>pick([()=>G.form({frame:'SQ',role:pick(['Qs','Qo','I']),Q:{k:'tr'}}),()=>G.compose({frame:'SQ',Q:{k:'tr'}}),()=>G.read({frame:'SQ',Q:{k:'tr'}})])(),5,18,'writing two accusatives'),
  T(`<h2>Longer sentences</h2><p>A whole sentence now fits inside a clause. That is how Caesar reports news: <i>nuntius … dīcit</i>, “a messenger says that …”.</p>`,{btn:'Finish'})
]},
{id:53,title:'Said that',min:11,steps:()=>[
  T(`<h2>Lesson 53 · Said that</h2><p>Caesar usually writes in the <b>past</b>: <i>dīxit</i>, “said”. One surprise: the infinitive does <b>not</b> change.</p>`,{btn:'Begin'}),
  perfTeach('dicit'),perfTeach('putat'),
  ()=>G.perfWord('dicit','lat2en'),()=>G.perfWord('putat','en2lat'),()=>G.perfWord('dicit','pres'),
  T(()=>`<h2>Past saying, same infinitive</h2>${H('rex '+hx('puell','am')+' ambulāre '+hx('dīx','it')+'.','The king <b>said</b> that the girl <b>walked</b>.')}${H('dux mīlitēs urbem vidēre '+hx('putāv','it')+'.','The leader <b>thought</b> that the soldiers <b>saw</b> the city.')}
    <div class="rule">The infinitive shows time <b>relative to the saying</b>. <b>Same time</b> as “said” = ordinary infinitive (<i>ambulāre</i>), and English then says “walked”, “saw”, “was”. ${spk(['rex','puellam','ambulāre','dīxit'])}</div>
    <div class="note">So <i>rex puellam ambulāre dīcit</i> = “says that the girl <b>walks</b>”, and <i>rex puellam ambulāre dīxit</i> = “<b>said</b> that the girl <b>walked</b>”. The infinitive is the same. The main verb carries the tense.</div>`,{btn:'Practise',say:['rex','puellam','ambulāre','dīxit']}),
  ()=>G.read(sq('in',{S:'rex',t:'pf',Q:{A:'puella',nA:'s'}})),
  ()=>G.read(sq('in',{S:'rex',t:'pr',Q:{A:'puella',nA:'s'}})),
  ()=>G.read(sq('ad',{S:'dux',t:'pf',Q:{A:'miles',nA:'s',adj:'fortis'}})),
  ()=>G.read(sq('tr',{S:'dux',v:'putat',t:'pf',Q:{A:'miles',nA:'p',iv:'videt',O:'urbs',nO:'s'}})),
  ()=>G.tap(sq('in',{S:'poeta',t:'pf',Q:{A:'puella',nA:'s'},idx:0})),
  ()=>G.who(sq('in',{S:'rex',v:'putat',t:'pf',Q:{A:'nauta',nA:'p'},idx:0})),
  T(`<p>Highlighting off. Look at the main verb for the tense.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SQ',t:'pf'}),()=>G.read({frame:'SQ',t:'pf'}),()=>G.read({frame:'SQ',t:'pr'}),()=>G.who({frame:'SQ',t:'pf',idx:pick([0,1])}),()=>G.hearSent({frame:'SQ',t:'pf'}),()=>G.compose({frame:'SQ',t:'pf'}),()=>G.tap({frame:'SQ',t:'pf',idx:0})])(),8,26,'said that'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form(sq('in',{role:'V',S:'rex',t:'pf',Q:{A:'puella',nA:'s'},hint:true,hl:false})),
  ()=>G.form(sq('tr',{role:'V',S:'dux',v:'putat',t:'pf',Q:{A:'miles',nA:'p',iv:'videt',O:'urbs',nO:'s'},hint:true,hl:false})),
  ()=>G.form(sq('ad',{role:'V',S:'rex',sn:'p',t:'pf',Q:{A:'puella',nA:'s',adj:'bona'},hint:true,hl:false})),
  ()=>G.dictate({w:'dicit',t:'pf'}),()=>G.dictate({w:'putat',t:'pf'}),
  ()=>G.compose(sq('in',{S:'rex',t:'pf',Q:{A:'puella',nA:'s'},hl:false})),
  drill(()=>pick([()=>G.form({frame:'SQ',role:'V',t:'pf'}),()=>G.compose({frame:'SQ',t:'pf'}),()=>G.read({frame:'SQ'}),()=>G.verbForm({v:pick(['dicit','putat']),t:'pf'})])(),5,18,'writing said that'),
  T(`<h2>Time in reported speech</h2><p>Same time as the saying: the plain infinitive. Next: how to say that something happened <i>before</i> the saying.</p>`,{btn:'Finish'})
]},
{id:54,title:'To have loved',min:12,steps:()=>[
  T(`<h2>Lesson 54 · To have loved</h2><p>What if the thing <b>happened earlier</b> than the saying? “He says that the girl <i>walked</i>.” Latin has a second infinitive for that: the <b>perfect infinitive</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>-isse</h2><table class="tbl"><tr><th>Infinitive</th><th>Perfect infinitive</th><th></th></tr>
    <tr><td>amāre</td><td>amāv<span class="m">isse</span></td><td class="mute">to have loved</td></tr>
    <tr><td>laudāre</td><td>laudāv<span class="m">isse</span></td><td class="mute">to have praised</td></tr>
    <tr><td>portāre</td><td>portāv<span class="m">isse</span></td><td class="mute">to have carried</td></tr>
    <tr><td>vocāre</td><td>vocāv<span class="m">isse</span></td><td class="mute">to have called</td></tr>
    <tr><td>ambulāre</td><td>ambulāv<span class="m">isse</span></td><td class="mute">to have walked</td></tr>
    <tr><td>vidēre</td><td>vīd<span class="m">isse</span></td><td class="mute">to have seen</td></tr>
    <tr><td>audīre</td><td>audīv<span class="m">isse</span></td><td class="mute">to have heard</td></tr>
    <tr><td>dare</td><td>ded<span class="m">isse</span></td><td class="mute">to have given</td></tr>
    <tr><td>esse</td><td>fu<span class="m">isse</span></td><td class="mute">to have been</td></tr></table>
    <div class="rule">Take the past (“you loved”: <i>amāvistī</i>) and swap the ending: <b>amāvisse</b>. Every perfect infinitive ends in <b>-isse</b>. ${spk(['amāvisse'])} ${spk(['vīdisse'])} ${spk(['fuisse'])}</div>`,{intro:['r:infpf'],btn:'Next',say:['amāvisse']}),
  ()=>G.infWord('amat','pf'),()=>G.infWord('videt','pf2en'),()=>G.infWord('ambulat','pf'),()=>G.infWord('dat','pf2en'),()=>G.infWord('est','pf'),

  T(`<h2>Same time, earlier</h2><p>That is the whole system for this kind of reported speech: <i>-re</i> for the same time, <i>-isse</i> for earlier.</p>`,{btn:'Finish'})

{id:55,title:'Messengers',min:12,steps:()=>[

{id:57,title:'Praised, seen',min:11,steps:()=>[
  T(`<h2>Lesson 57 · Praised, seen</h2><p>Latin makes describing words from verbs. <i>laudat</i> means “praises”; <b>laudātus</b> means “<b>praised</b>”. These are called <b>participles</b>.</p><p class="mute">Seven today. They work like <b>bonus</b>, so their endings will feel familiar.</p>`,{btn:'Begin'}),
  ppTeach('laudatus'),ppTeach('amatus'),ppTeach('vocatus'),
  ()=>G.ppWord('laudatus','lat2en'),()=>G.ppWord('amatus','en2lat'),()=>G.ppWord('vocatus','ofverb'),
  ppTeach('visus'),ppTeach('auditus'),
  ()=>G.ppWord('visus','lat2en'),()=>G.ppWord('auditus','en2lat'),()=>G.ppWord('visus','toverb'),
  ppTeach('portatus'),ppTeach('datus'),
  ()=>G.ppWord('portatus','lat2en'),()=>G.ppWord('datus','ofverb'),()=>G.ppWord('portatus','en2lat'),
  T(`<p>All seven. Mix them: Latin to English, English to Latin, and which verb each comes from.</p>`,{btn:'Go'}),
  drill(()=>G.ppWord(),6,22,'participles'),
  T(()=>`<h2>A describing word made from a verb</h2><table class="tbl"><tr><th>Masc.</th><th>Fem.</th><th>Neuter</th></tr><tr><td>laudāt<span class="m">us</span></td><td>laudāt<span class="m">a</span></td><td>laudāt<span class="m">um</span></td></tr></table>
    ${H('puella '+hx('laudāt','a')+' rēgem videt.','The girl <b>who was praised</b> sees the king.')}${H('rex puellam '+hx('laudāt','am')+' videt.','The king sees the girl <b>who was praised</b>.')}${H('dux dōnum '+hx('dat','um')+' portat.','The leader carries the gift <b>that was given</b>.')}${H('mīlitēs '+hx('vocāt','ī')+' ducem laudant.','The soldiers <b>who were called</b> praise the leader.')}
    <div class="rule">A participle takes the <b>gender, number and job</b> of its noun, exactly like <b>bonus</b>. In English we usually need “who was …” or “that was …”. ${spk(['puella','laudāta','rēgem','videt'])}</div>
    <div class="note">The participle means something has <b>already been done to</b> the noun: <i>puella laudāta</i> is “the girl (who has been) praised”.</div>`,{intro:['r:pp'],btn:'Practise',say:['puella','laudāta','rēgem','videt']}),
  ()=>G.tap(f1({frame:'SOV',S:'puella',O:'rex',v:'videt',adj:{S:'laudatus',O:null},af:{S:false},order:'SOV',idx:2,hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'rex',O:'puella',v:'videt',adj:{S:null,O:'laudatus'},af:{O:false},order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'dux',O:'donum',v:'portat',adj:{S:null,O:'datus'},af:{O:false},order:'SOV',hl:true})),
  ()=>G.read(f1({frame:'SOV',S:'puella',O:'lupus',v:'amat',adj:{S:null,O:'visus'},af:{O:false},order:'SOV',hl:true})),
  ()=>G.read({frame:'SOV',S:'miles',sn:'p',O:'dux',on:'s',v:'laudat',adj:{S:'vocatus',O:null},af:{S:false},order:'SOV',hl:true}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the participle to the noun it describes.</p>`,{btn:'Draw'}),
    ()=>G.arrow(f1({frame:'SOV',S:'amicus',O:'puella',v:'videt',adj:{S:'laudatus',O:null},af:{S:false},order:'SOV',hl:true,arrow:'adj'}))),
  T(`<p>Highlighting off. Find the participle, then the noun it matches.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read(ppFix()),()=>G.read(ppFix()),()=>G.tap(Object.assign(ppFix(),{idx:2})),()=>G.hearSent(ppFix()),()=>G.compose(ppFix()),()=>G.ppWord(),()=>G.who(ppFix())])(),8,24,'participles in sentences'),
  T(`<h2>Now write it</h2><p>Match the noun’s gender.</p>`,{btn:'Try it'}),
  ()=>G.form(f1({frame:'SOV',role:'Sa',S:'puella',O:'rex',v:'videt',adj:{S:'laudatus',O:null},af:{S:false},order:'SOV',hint:true})),
  ()=>G.form(f1({frame:'SOV',role:'Oa',S:'dux',O:'donum',v:'portat',adj:{S:null,O:'datus'},af:{O:false},order:'SOV',hint:true})),
  ()=>G.form(f1({frame:'SOV',role:'Oa',S:'rex',O:'amicus',v:'laudat',adj:{S:null,O:'vocatus'},af:{O:false},order:'SOV',hint:true})),
  ()=>G.dictate({w:'laudatus'}),()=>G.dictate({w:'visus'}),()=>G.dictate({w:'datus'}),
  ()=>G.compose(ppFix()),
  drill(()=>pick([()=>G.form(Object.assign(ppFix(),{role:'Sa'})),()=>G.compose(ppFix()),()=>G.dictate({w:pick(K().adjs.filter(a=>VOC[a].pp))}),()=>G.read(ppFix())])(),5,18,'writing participles'),
  T(`<h2>Seven participles</h2><p>amātus, vīsus, audītus, laudātus, portātus, vocātus, datus. Next they do something bigger: <b>puella laudāta est</b>, “the girl was praised”.</p>`,{btn:'Finish'})
]},
{id:58,title:'Was praised',min:11,steps:()=>[
  T(`<h2>Lesson 58 · Was praised</h2><p>Put <b>est</b> after a participle and you get the <b>passive</b>: something <i>was done to</i> the subject.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Participle + est = “was …ed”</h2>${H('puella '+hx('laudāt','a')+' est.','The girl <b>was praised</b>.')}${H('puellae '+hx('laudāt','ae')+' sunt.','The girls <b>were praised</b>.')}${H('urbs '+hx('vīs','a')+' est.','The city <b>was seen</b>.')}${H('dōnum '+hx('dat','um')+' est.','The gift <b>was given</b>.')}${H('mīlitēs '+hx('vocāt','ī')+' sunt.','The soldiers <b>were called</b>.')}
    <div class="rule">The participle <b>matches the subject</b> (gender and number). <b>est</b> goes with one, <b>sunt</b> with many. The subject is the one the action <b>happened to</b>. ${spk(['puella','laudāta','est'])} ${spk(['puellae','laudātae','sunt'])}</div>
    <div class="note"><b>Was</b>, not <b>is</b>. <i>laudāta est</i> is “was praised”, in the past. (It is not “is praised”.) Caesar’s line <i>Gallia est omnis dīvīsa</i> uses the same pattern, where “is divided” describes the state left behind.</div>`,{intro:['r:pass'],btn:'Next',say:['puella','laudāta','est']}),
  T(()=>`<h2>Active and passive</h2><table class="tbl"><tr><th>Active</th><th>Passive</th></tr>
    <tr><td>rex puellam laudāvit.<br><span class="mute" style="font-size:15px">The king praised the girl.</span></td><td>puella laudāta est.<br><span class="mute" style="font-size:15px">The girl was praised.</span></td></tr></table>
    <p>In the active the <b>king</b> does it. In the passive the <b>girl</b> is the subject, and who did it is left out for now.</p>`,{btn:'Practise'}),
  ()=>G.tap({frame:'SP',noag:true,S:'puella',pp:'laudatus',sn:'s',order:'SPV',idx:1,hl:true}),
  ()=>G.tap({frame:'SP',noag:true,S:'urbs',pp:'visus',sn:'s',order:'SPV',idx:1,hl:true}),
  ()=>G.who({frame:'SP',noag:true,S:'rex',pp:'vocatus',sn:'s',order:'SPV',idx:0,hl:true}),
  ()=>G.read({frame:'SP',noag:true,S:'puella',pp:'laudatus',sn:'s',order:'SPV',hl:true}),
  ()=>G.read({frame:'SP',noag:true,S:'puella',pp:'amatus',sn:'p',order:'SPV',hl:true}),
  ()=>G.read({frame:'SP',noag:true,S:'donum',pp:'datus',sn:'s',order:'SPV',hl:true}),
  ()=>G.read({frame:'SP',noag:true,S:'miles',pp:'auditus',sn:'p',order:'SVP',hl:true}),
  ()=>G.read({frame:'SP',noag:true,S:'flumen',pp:'visus',sn:'s',order:'SPV',hl:true}),
  T(`<p>Highlighting off. Is it <b>was praised</b> or <b>is praised</b>? Look for <b>est</b> or <b>sunt</b> with a participle.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SP',noag:true}),()=>G.read({frame:'SP',noag:true}),()=>G.who({frame:'SP',noag:true,idx:0}),()=>G.tap({frame:'SP',noag:true,idx:1}),()=>G.hearSent({frame:'SP',noag:true}),()=>G.compose({frame:'SP',noag:true})])(),8,24,'was praised'),
  T(`<h2>Now write it</h2><p>The participle must match the subject.</p>`,{btn:'Try it'}),
  ()=>G.form({frame:'SP',noag:true,role:'P',S:'puella',pp:'laudatus',sn:'s',order:'SPV',hint:true,hl:false}),
  ()=>G.form({frame:'SP',noag:true,role:'P',S:'mons',pp:'visus',sn:'s',order:'SPV',hint:true,hl:false}),
  ()=>G.form({frame:'SP',noag:true,role:'V',S:'miles',pp:'vocatus',sn:'p',order:'SPV',hint:true,hl:false}),
  ()=>G.form({frame:'SP',noag:true,role:'P',S:'donum',pp:'datus',sn:'p',order:'SPV',hint:true,hl:false}),
  ()=>G.compose({frame:'SP',noag:true,S:'puella',pp:'laudatus',sn:'s',hl:false}),
  drill(()=>pick([()=>G.form({frame:'SP',noag:true,role:pick(['P','V'])}),()=>G.compose({frame:'SP',noag:true}),()=>G.read({frame:'SP',noag:true}),()=>G.dictate({w:pick(K().adjs.filter(a=>VOC[a].pp))})])(),5,18,'writing was praised'),
  T(`<h2>The passive</h2><p>Participle + <b>est</b> / <b>sunt</b>: “was” / “were”. Caesar writes <i>captus est</i>, <i>dictum est</i>, <i>factum est</i> all the time. Next: <b>by whom</b>.</p>`,{btn:'Finish'})
]},
{id:59,title:'By',min:11,steps:()=>[
  T(`<h2>Lesson 59 · By</h2><p>Who did it? Latin puts the doer after a little word meaning <b>by</b>, in the <b>ablative</b>.</p>`,{btn:'Begin'}),
  T(()=>`<div class="emo">🫱</div><div class="lat big">ā / ab ${spk(['\u0101'])} ${spk(['ab'])}</div><div class="eq">= by</div><p class="mute" style="text-align:center">Two forms of one word: <b>ā</b> before a consonant, <b>ab</b> before a vowel or <b>h</b>.</p>`,{intro:['w:ab'],btn:'Next',say:['\u0101','ab']}),
  mcLat2En('ab',['cum','ad','ex']),mcEn2Lat('ab',['cum','ad','ex']),()=>G.hearWord('ab',['cum','ad','ex']),

{id:60,title:'Active and passive',min:12,steps:()=>[
  T(`<h2>Lesson 60 · Active and passive</h2><p>The same event can be told two ways. No new grammar today: you learn to see that two sentences <b>mean the same</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>The receiver becomes the subject</h2><table class="tbl"><tr><th>Active</th><th>Passive</th></tr>
    <tr><td>rex puellam laudāvit.</td><td>puella ā rēge laudāta est.</td></tr>
    <tr><td>dux urbem vīdit.</td><td>urbs ā duce vīsa est.</td></tr>
    <tr><td>nauta equum vocāvit.</td><td>equus ā nautā vocātus est.</td></tr></table>
    <div class="rule"><b>Active → passive:</b> the receiver (<i>puellam</i>) becomes the subject (<i>puella</i>); the doer (<i>rex</i>) moves after <b>ā</b> in the ablative (<i>ā rēge</i>); the verb becomes participle + <b>est</b>, and the participle matches the new subject. ${spk(['puella','\u0101','rēge','laudāta','est'])}</div>`,{btn:'Practise'}),
  ()=>G.voice({dir:'p2a'}),()=>G.voice({dir:'p2a'}),()=>G.voice({dir:'a2p'}),()=>G.voice({dir:'a2p'}),
  T(`<p>Now mix both directions, with reading and writing.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.voice(),()=>G.voice(),()=>G.voice(),()=>G.read({frame:'SP',needAg:true}),()=>G.who({frame:'SP',needAg:true,idx:pick([0,1])}),()=>G.hearSent({frame:'SP',needAg:true})])(),8,26,'active and passive'),
  T(`<h2>Write both ways</h2>`,{btn:'Try it'}),
  ()=>G.compose({frame:'SP',ag:'dux',S:'urbs',pp:'visus',sn:'s',hl:false}),
  ()=>G.form({frame:'SP',role:'P',ag:'nauta',S:'equus',pp:'vocatus',sn:'s',order:'SAPV',hint:true,hl:false}),
  ()=>G.compose(f1({frame:'SOV',S:'dux',O:'urbs',v:'videt',t:'pf'})),
  drill(()=>pick([()=>G.compose({frame:'SP',needAg:true}),()=>G.compose({frame:'SOV',t:'pf'}),()=>G.form({frame:'SP',needAg:true,role:pick(['P','A','W'])}),()=>G.voice()])(),6,20,'writing both voices'),
  T(()=>{const s=STORIES.find(x=>x.id==='s57');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  T(`<h2>Two ways to say it</h2><p>Latin often prefers the passive when the thing that <i>happened</i> matters more than who did it. You can now read both.</p>`,{btn:'Finish'})
]},
{id:61,title:'After',min:12,steps:()=>[
  T(`<h2>Lesson 61 · After</h2><p>Caesar’s favourite construction. A noun and a participle, both in the <b>ablative</b>, stand off to one side of the sentence and say <b>what had already happened</b>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>The ablative absolute</h2>${H('<b>urbe vīsā</b>, dux mīlitēs vocāvit.','<b>After the city had been seen</b>, the leader called the soldiers.')}${H('<b>rēge laudātō</b>, mīlitēs urbem vīdērunt.','<b>After the king had been praised</b>, the soldiers saw the city.')}${H('<b>dōnō datō</b>, puella rosam portāvit.','<b>After the gift had been given</b>, the girl carried the rose.')}
    <table class="tbl"><tr><th>noun (ablative)</th><th>participle (ablative)</th></tr><tr><td>urb<span class="m">e</span></td><td>vīs<span class="m">ā</span></td></tr><tr><td>rēg<span class="m">e</span></td><td>laudāt<span class="m">ō</span></td></tr><tr><td>dōn<span class="m">ō</span></td><td>dat<span class="m">ō</span></td></tr></table>
    <div class="rule">Noun + participle, both in the ablative and <b>matching</b> (<b>-e … -ā</b> for a feminine noun, <b>-e … -ō</b> for a masculine one, <b>-ō … -ō</b> for a neuter one). The phrase is <b>not</b> the subject or the object of the main verb: it is set apart. ${spk(['urbe','vīsā','dux','mīlitēs','vocāvit'])}</div>
    <div class="note">It usually means “<b>after</b> … had been …”, and sometimes “when” or “because”. Here the main verb is always in the past.</div>`,{intro:['r:aa'],btn:'Practise',say:['urbe','vīsā','dux','mīlitēs','vocāvit']}),
  ()=>G.tap({frame:'SOV',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',idx:2,hl:true}),
  ()=>G.tap({frame:'SOV',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',idx:3,hl:true}),
  ()=>G.read({frame:'SOV',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hl:true}),

  ()=>G.read({frame:'SOV',S:'puella',sn:'s',O:'rosa',on:'s',v:'portat',aa:{N:'donum',P:'datus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hl:true}),
  ()=>G.who({frame:'SOV',S:'nauta',sn:'s',O:'equus',on:'s',v:'vocat',aa:{N:'dux',P:'auditus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'end',idx:0,hl:true}),
  ...when(S.opts.enact,
    T(`<h2>Draw it</h2><p>Draw from the participle to the noun it goes with.</p>`,{btn:'Draw'}),
    ()=>G.arrow({frame:'SOV',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hl:true,arrow:'adj'})),

  drill(()=>pick([()=>G.read({frame:'SOV',aa:true,an:'s'}),()=>G.read({frame:'SOV',aa:true,an:'s'}),()=>G.who({frame:'SOV',aa:true,idx:pick([0,1])}),()=>G.tap({frame:'SOV',aa:true,idx:pick([2,3])}),()=>G.hearSent({frame:'SOV',aa:true}),()=>G.compose({frame:'SOV',aa:true})])(),8,26,'after'),
  T(`<h2>Now write it</h2><p>Both words go in the ablative.</p>`,{btn:'Try it'}),
  ()=>G.form({frame:'SOV',role:'Zn',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hint:true,hl:false}),
  ()=>G.form({frame:'SOV',role:'Zp',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hint:true,hl:false}),
  ()=>G.form({frame:'SOV',role:'Zp',S:'miles',sn:'p',O:'urbs',on:'s',v:'videt',aa:{N:'rex',P:'laudatus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hint:true,hl:false}),
  ()=>G.form({frame:'SOV',role:'Zp',S:'puella',sn:'s',O:'rosa',on:'s',v:'portat',aa:{N:'donum',P:'datus',nN:'s',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hint:true,hl:false}),
  ()=>G.compose({frame:'SOV',S:'dux',sn:'s',O:'miles',on:'p',v:'vocat',aa:{N:'urbs',P:'visus',nN:'s',af:false},adj:{S:null,O:null},hl:false}),
  drill(()=>pick([()=>G.form({frame:'SOV',aa:true,an:'s',role:pick(['Zn','Zp'])}),()=>G.compose({frame:'SOV',aa:true}),()=>G.read({frame:'SOV',aa:true})])(),6,20,'writing after'),
  T(`<h2>Caesar’s favourite</h2><p>Look for two ablatives side by side, a noun and a participle. They tell you what happened <b>before</b> the main action. Caesar writes <i>his rebus cognitis</i> (“these things having been learned”) all the time.</p>`,{btn:'Finish'})
]},
{id:62,title:'With many',min:12,steps:()=>[
  T(`<h2>Lesson 62 · With many</h2><p>You know <b>with</b>, <b>by</b> and <b>in</b> for <b>one</b> (<i>cum amīcō</i>). For <b>many</b> there is a new ending, and it does the same jobs.</p>`,{btn:'Begin'}),
  T(()=>`<h2>-īs and -ibus</h2><table class="tbl"><tr><th>one</th><th>many</th></tr>
    <tr><td>puell<span class="m">ā</span></td><td>puell<span class="m">īs</span></td></tr><tr><td>amīc<span class="m">ō</span></td><td>amīc<span class="m">īs</span></td></tr><tr><td>oppid<span class="m">ō</span></td><td>oppid<span class="m">īs</span></td></tr>
    <tr><td>rēg<span class="m">e</span></td><td>rēg<span class="m">ibus</span></td></tr><tr><td>fl\u016bmin<span class="m">e</span></td><td>fl\u016bmin<span class="m">ibus</span></td></tr></table>
    ${H('puella cum '+hx('amīc','īs')+' ambulat.','The girl walks <b>with the friends</b>.')}${H('nauta in '+hx('urb','ibus')+' ambulat.','The sailor walks <b>in the cities</b>.')}${H('<b>'+hx('mīlit','ibus')+' '+hx('vocāt','īs')+'</b>, dux urbem vīdit.','<b>After the soldiers had been called</b>, the leader saw the city.')}
    <div class="rule">With <b>many</b> things, the ablative is <b>-īs</b> for <b>-a</b>, <b>-us</b> and <b>-um</b> nouns, and <b>-ibus</b> for third-declension nouns. Describing words and participles follow: <b>-īs</b> or <b>-ibus</b>. ${spk(['puella','cum','amīcīs','ambulat'])}</div>
    <div class="note">The one ending is used for all three genders: <i>vocātīs</i> can go with a feminine, masculine or neuter noun.</div>`,{intro:['r:ablpl'],btn:'Practise',say:['puella','cum','amīcīs','ambulat']}),
  ()=>G.tap({frame:'SCV',S:'puella',sn:'s',prep:'cum',acase:'abl',A:'amicus',an:'p',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.who({frame:'SCV',S:'nauta',sn:'s',prep:'in',acase:'abl',A:'urbs',an:'p',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.read({frame:'SCV',S:'poeta',sn:'s',prep:'cum',acase:'abl',A:'rex',an:'p',v:'ambulat',order:'SCV',hl:true}),
  ()=>G.read({frame:'SCV',S:'miles',sn:'p',prep:'cum',acase:'abl',A:'puella',an:'p',v:'ambulat',order:'SCV',hl:true}),

  ()=>G.read({frame:'SOV',S:'rex',sn:'s',O:'donum',on:'s',v:'portat',aa:{N:'puella',P:'laudatus',nN:'p',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hl:true}),
  T(`<p>Highlighting off. One or many? Look at the ending: <b>-ā / -ō / -e</b> is one; <b>-īs / -ibus</b> is many.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.read({frame:'SCV',prep:'cum',an:'p'}),()=>G.read({frame:'SCV',an:'p'}),()=>G.who({frame:'SCV',an:'p',idx:1}),()=>G.tap({frame:'SCV',an:'p',idx:1}),()=>G.hearSent({frame:'SCV',an:'p'}),()=>G.read({frame:'SOV',aa:{nN:'p'}}),()=>G.hearSent({frame:'SOV',aa:{nN:'p'}}),()=>G.read({frame:'SOV',aa:true})])(),8,26,'with many'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form({frame:'SCV',role:'A',S:'puella',sn:'s',prep:'cum',acase:'abl',A:'amicus',an:'p',v:'ambulat',order:'SCV',hint:true,hl:false}),
  ()=>G.form({frame:'SCV',role:'A',S:'nauta',sn:'s',prep:'in',acase:'abl',A:'urbs',an:'p',v:'ambulat',order:'SCV',hint:true,hl:false}),
  ()=>G.form({frame:'SOV',role:'Zp',S:'dux',sn:'s',O:'urbs',on:'s',v:'videt',aa:{N:'miles',P:'vocatus',nN:'p',af:false},adj:{S:null,O:null},order:'SOV',zpos:'start',hint:true,hl:false}),
  ()=>G.paradigm({cn:['abl','p'],n:'puella'}),()=>G.paradigm({cn:['abl','p'],n:'rex'}),()=>G.paradigm({cn:['abl','p']}),
  ()=>G.dictate({w:'puella',abl:true}),
  drill(()=>pick([()=>G.paradigm({cn:['abl','p']}),()=>G.form({frame:'SCV',role:'A',an:'p'}),()=>G.compose({frame:'SCV',an:'p'}),()=>G.read({frame:'SCV',an:'p'}),()=>G.form({frame:'SOV',aa:{nN:'p'},role:pick(['Zn','Zp'])})])(),6,20,'writing with many'),
  T(`<h2>Many, in the ablative</h2><p>You can now read <i>cum amīcīs</i>, <i>in urbibus</i> and <i>mīlitibus vocātīs</i>. Caesar writes <i>his rebus cognitis</i> and <i>omnibus rebus comparatis</i> in this way.</p>`,{btn:'Finish'})
]},
{id:63,title:'To many',min:11,steps:()=>[
  T(`<h2>Lesson 63 · To many</h2><p>The ending <b>-īs / -ibus</b> has a second job: <b>to / for many</b>. It is the plural of the “to” ending (<i>-ae</i>, <i>-ō</i>, <i>-ī</i>).</p>`,{btn:'Begin'}),
  T(()=>`<h2>-īs / -ibus = to / for many</h2>${H('puella '+hx('amīc','īs')+' rosam dat.','The girl gives the rose <b>to the friends</b>.')}${H('dux '+hx('mīlit','ibus')+' dōna dedit.','The leader gave gifts <b>to the soldiers</b>.')}${H('puella cum '+hx('amīc','īs')+' ambulat.','The girl walks <b>with the friends</b>.')}
    <table class="tbl"><tr><th></th><th>one</th><th>many</th></tr><tr><td>to / for</td><td>amīc<span class="m">ō</span></td><td>amīc<span class="m">īs</span></td></tr><tr><td>with / by / in</td><td>amīc<span class="m">ō</span></td><td>amīc<span class="m">īs</span></td></tr></table>
    <div class="rule">For many, “to” and “with” <b>look the same</b>. The rest of the sentence decides: <b>dat</b> (gives) → <b>to</b>; <b>cum</b>, <b>in</b>, or an absolute phrase → <b>with / in</b>. ${spk(['puella','amīcīs','rosam','dat'])}</div>`,{intro:['r:datpl'],btn:'Practise',say:['puella','amīcīs','rosam','dat']}),
  ()=>G.who({frame:'SDOV',S:'puella',sn:'s',D:'amicus',dn:'p',O:'rosa',on:'s',v:'dat',order:'SDOV',idx:1,hl:true}),
  ()=>G.tap({frame:'SDOV',S:'dux',sn:'s',D:'miles',dn:'p',O:'donum',on:'p',v:'dat',order:'SDOV',idx:1,hl:true}),

  ()=>G.read({frame:'SDOV',S:'agricola',sn:'s',D:'nauta',dn:'p',O:'rosa',on:'p',v:'dat',t:'pf',order:'SDOV',hl:true}),
  ()=>G.dpRole({kind:'dat'}),()=>G.dpRole({kind:'abl'}),()=>G.dpRole({kind:'dat'}),()=>G.dpRole({kind:'abl'}),
  T(`<p>Highlighting off. <b>To</b> or <b>with</b>? Look for <b>dat</b> or <b>cum</b>.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.dpRole(),()=>G.dpRole(),()=>G.read({frame:'SDOV',dn:'p'}),()=>G.who({frame:'SDOV',dn:'p',idx:1}),()=>G.hearSent({frame:'SDOV',dn:'p'}),()=>G.read({frame:'SCV',prep:'cum',an:'p'}),()=>G.tap({frame:'SDOV',dn:'p',idx:1})])(),8,26,'to or with'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form({frame:'SDOV',role:'D',S:'puella',sn:'s',D:'amicus',dn:'p',O:'rosa',on:'s',v:'dat',order:'SDOV',hint:true,hl:false}),
  ()=>G.form({frame:'SDOV',role:'D',S:'dux',sn:'s',D:'miles',dn:'p',O:'donum',on:'p',v:'dat',order:'SDOV',hint:true,hl:false}),
  ()=>G.paradigm({cn:['dat','p'],n:'puella'}),()=>G.paradigm({cn:['dat','p'],n:'rex'}),()=>G.paradigm({cn:['dat','p']}),
  ()=>G.compose({frame:'SDOV',dn:'p',hl:false}),
  drill(()=>pick([()=>G.paradigm({cn:[pick(['dat','abl']),'p']}),()=>G.form({frame:'SDOV',role:'D',dn:'p'}),()=>G.compose({frame:'SDOV',dn:'p'}),()=>G.dpRole()])(),6,20,'writing to many'),
  T(`<h2>The plural endings</h2><p>One new ending, two jobs: <b>-īs / -ibus</b> for “to many” and “with / by / in many”. English needs different words; Latin leaves the verb to decide.</p>`,{btn:'Finish'})
]},
{id:64,title:'Reading day: the army',min:13,steps:()=>[
  T(`<h2>Lesson 64 · Reading day: the army</h2><p>No new grammar. A short account in Caesar’s style, using participles, the passive, absolute phrases and everything you know. Then a long mixed set.</p>`,{btn:'Begin'}),
  T(()=>{const s=STORIES.find(x=>x.id==='s61');return`<h2>${esc(s.title)}</h2><p class="mute sans" style="font-size:14px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p><div class="story">${storyBlock(s)}</div>`},{btn:'Next',after:bindSents}),
  {kind:'drill',gen:mixed,n:34,label:'mixed'},

]},

{id:65,title:'Was walking',min:12,steps:()=>[
  T(`<h2>Lesson 65 · Was walking</h2><p>You know the <b>past</b> for one event: <i>ambulāvit</i>, “walked”. Caesar also needs a second past tense for what was <b>going on</b>: <i>ambulābat</i>, “<b>was walking</b>”. It is called the <b>imperfect</b>.</p><p class="mute">Nine forms today. Then one rule.</p>`,{btn:'Begin'}),
  impTeach('amat'),impTeach('laudat'),impTeach('portat'),
  ()=>G.impWord('amat','lat2en'),()=>G.impWord('laudat','en2lat'),()=>G.impWord('portat','lat2en'),()=>G.impWord('amat','pres'),
  impTeach('vocat'),impTeach('ambulat'),
  ()=>G.impWord('vocat','en2lat'),()=>G.impWord('ambulat','lat2en'),()=>G.impWord('laudat','pres'),
  impTeach('videt'),impTeach('audit'),
  ()=>G.impWord('videt','lat2en'),()=>G.impWord('audit','en2lat'),()=>G.impWord('videt','pres'),
  impTeach('dat'),impTeach('est'),
  ()=>G.impWord('dat','lat2en'),()=>G.impWord('est','lat2en'),()=>G.impWord('dat','pres'),
  T(()=>`<h2>Was …ing</h2>${H('puella poetam amat.','The girl <b>loves</b> the poet.')}${H('puella poetam '+hx('amā','bat')+'.','The girl <b>was loving</b> the poet.')}${H('rex ducem '+hx('vocā','bat')+'.','The king <b>was calling</b> the leader.')}${H('puella bona '+hx('er','at')+'.','The girl <b>was</b> good.')}
    <table class="tbl"><tr><th>Present</th><th>Imperfect</th></tr><tr><td>amat</td><td>amā<span class="m">bat</span></td></tr><tr><td>videt</td><td>vidē<span class="m">bat</span></td></tr><tr><td>audit</td><td>audiē<span class="m">bat</span></td></tr><tr><td>dat</td><td>da<span class="m">bat</span></td></tr><tr><td>est</td><td>erat</td></tr></table>
    <div class="rule">For one doer: <b>-bat</b>. It says what <b>was going on</b>: “was loving”, “was walking”, “kept calling”. The rest of the sentence works as before. ${spk(['puella','poetam','amābat'])}</div>
    <div class="note"><b>est</b> is irregular: <b>erat</b> (“was”). English often says just “was” for it.</div>`,{intro:['r:imp'],btn:'Practise',say:['puella','poetam','amābat']}),
  ()=>G.tap(f1({frame:'SOV',S:'puella',O:'poeta',v:'amat',t:'im',order:'SOV',idx:0,hl:true})),

  ()=>G.read({frame:'SE',S:'puella',sn:'s',pred:{adj:'bona'},t:'im',order:'SPV',hl:true}),

{id:67,title:'Was, or did?',min:12,steps:()=>[
  T(`<h2>Lesson 67 · Was, or did?</h2><p>No new endings. You have two past tenses. The choice is about <b>meaning</b>, and Caesar uses both in every paragraph.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Background and event</h2>${H('miles ambulābat.<br>dux urbem vīdit.','The soldier <b>was walking</b>.<br>The leader <b>saw</b> the city.')}
    <table class="tbl"><tr><th></th><th>Imperfect</th><th>Perfect</th></tr><tr><td>Means</td><td><b>was …ing</b>, kept …ing</td><td><b>…ed</b>, once</td></tr><tr><td>Role</td><td>background, scene-setting</td><td>an event, what happened</td></tr><tr><td>amat →</td><td>amā<span class="m">bat</span></td><td>amā<span class="m">vit</span></td></tr><tr><td>est →</td><td>erat</td><td>fuit</td></tr></table>
    <div class="rule">The <b>imperfect</b> sets the scene (<i>ambulābat</i>, “was walking”). The <b>perfect</b> reports what happened (<i>vīdit</i>, “saw”). ${spk(['miles','ambulābat'])} ${spk(['dux','urbem','vīdit'])}</div>
    <div class="note">For <b>est</b> English cannot tell them apart (<i>erat</i> and <i>fuit</i> are both “was”), so look at the Latin.</div>`,{btn:'Practise'}),

{id:68,title:'He, she, it',min:12,steps:()=>[
  T(`<h2>Lesson 68 · He, she, it</h2><p>You can say <b>I</b> (<i>ego</i>) and <b>you</b> (<i>tū</i>). For <b>he</b>, <b>she</b> and <b>it</b> Latin uses <b>is</b>, <b>ea</b> and <b>id</b>. Caesar uses them on almost every page, instead of repeating a name.</p>`,{btn:'Begin'}),
  wordTeach('is'),wordTeach('ea'),wordTeach('id'),
  mcLat2En('is',['ea','id']),mcEn2Lat('ea',['is','id']),mcLat2En('id',['is','ea']),()=>G.hearWord('ea',['is','id']),
  T(()=>`<h2>Doer and receiver</h2>${H(hx('','is')+' puellam videt.','<b>He</b> sees the girl.')}${H('puella '+hx('','eum')+' videt.','The girl sees <b>him</b>.')}${H('<b>ea</b> poetam videt.','<b>She</b> sees the poet.')}${H('rex '+hx('','eam')+' laudat.','The king praises <b>her</b>.')}${H('dux '+hx('','id')+' portat.','The leader carries <b>it</b>.')}
    <table class="tbl"><tr><th></th><th>he</th><th>she</th><th>it</th></tr><tr><td>does it</td><td>is</td><td>ea</td><td>id</td></tr><tr><td>gets it</td><td><span class="m">eum</span></td><td><span class="m">eam</span></td><td>id</td></tr></table>
    <div class="rule"><b>is</b>, <b>ea</b> and <b>id</b> stand for someone or something already mentioned. The receiver forms are <b>eum</b> (him), <b>eam</b> (her) and <b>id</b> (it). ${spk(['is','puellam','videt'])} ${spk(['puella','eum','videt'])}</div>

{id:69,title:'His, to him, with him',min:12,steps:()=>[
  T(`<h2>Lesson 69 · His, to him, with him</h2><p>Three more forms of <b>is</b> / <b>ea</b> / <b>id</b>: <b>eius</b> (“his”), <b>eī</b> (“to him”) and <b>eō / eā</b> (“with him / with her”).</p>`,{btn:'Begin'}),
  T(()=>`<h2>His, her, its</h2>${H('puella '+hx('','eius')+' rosam videt.','The girl sees <b>his</b> rose.')}${H('poeta '+hx('','eius')+' casam amat.','The poet loves <b>her</b> house.')}
    <div class="rule"><b>eius</b> means <b>his</b>, <b>her</b> or <b>its</b>: it is the “of him / her / it” form, and it <b>never changes</b>, for any gender or noun. It sits beside the thing owned. ${spk(['puella','eius','rosam','videt'])}</div>
    <div class="note">Compare: <i>puellae rosam</i> = “the girl’s rose”, but <i>eius rosam</i> = “his / her rose”.</div>`,{intro:['r:isx'],btn:'Next',say:['puella','eius','rosam','videt']}),
  ()=>G.tap({frame:'SGOV',S:'puella',G:'is',O:'rosa',v:'videt',order:'SXV',idx:1,hl:true}),
  ()=>G.who({frame:'SGOV',S:'poeta',G:'ea',O:'casa',v:'amat',order:'SXV',idx:1,hl:true}),
  ()=>G.read({frame:'SGOV',S:'nauta',G:'is',O:'donum',v:'laudat',order:'SXV',hl:true}),
  T(()=>`<h2>To him</h2>${H('puella '+hx('','eī')+' rosam dat.','The girl gives the rose <b>to him</b>.')}${H('rex '+hx('','eī')+' dōnum dedit.','The king gave the gift <b>to her</b>.')}
    <div class="rule">With <b>dat</b> (gives), <b>eī</b> means <b>to him / to her</b>. ${spk(['puella','eī','rosam','dat'])}</div>`,{btn:'Next',say:['puella','eī','rosam','dat']}),
  ()=>G.who({frame:'SDOV',S:'puella',D:'is',dn:'s',O:'rosa',v:'dat',order:'SDOV',idx:1,hl:true}),
  ()=>G.tap({frame:'SDOV',S:'rex',D:'ea',dn:'s',O:'donum',v:'dat',order:'SDOV',idx:1,hl:true}),
  ()=>G.read({frame:'SDOV',S:'dux',D:'is',dn:'s',O:'donum',v:'dat',t:'pf',order:'SDOV',hl:true}),
  T(()=>`<h2>With him, to him</h2>${H('puella cum '+hx('','eō')+' ambulat.','The girl walks <b>with him</b>.')}${H('poeta cum '+hx('','eā')+' ambulābat.','The poet was walking <b>with her</b>.')}${H('nauta ad '+hx('','eum')+' ambulat.','The sailor walks <b>to him</b>.')}
    <table class="tbl"><tr><th></th><th>is</th><th>ea</th><th>id</th></tr><tr><td>of (his / her / its)</td><td>eius</td><td>eius</td><td>eius</td></tr><tr><td>to / for</td><td>eī</td><td>eī</td><td>eī</td></tr><tr><td>with (after <b>cum</b>)</td><td><span class="m">eō</span></td><td><span class="m">eā</span></td><td>eō</td></tr></table>
    <div class="rule">After <b>cum</b>: <b>eō</b> (him), <b>eā</b> (her). After <b>ad</b>: the receiver form (<b>eum</b>, <b>eam</b>). ${spk(['puella','cum','eō','ambulat'])}</div>`,{btn:'Practise',say:['puella','cum','eō','ambulat']}),
  ()=>G.tap({frame:'SCV',S:'puella',sn:'s',prep:'cum',acase:'abl',A:'is',an:'s',v:'ambulat',order:'SCV',idx:1,hl:true}),
  ()=>G.who({frame:'SCV',S:'poeta',sn:'s',prep:'cum',acase:'abl',A:'ea',an:'s',v:'ambulat',t:'im',order:'SCV',idx:1,hl:true}),
  ()=>G.read({frame:'SCV',S:'nauta',sn:'s',prep:'ad',acase:'acc',A:'is',an:'s',v:'ambulat',order:'SCV',hl:true}),
  T(`<p>Highlighting off. <b>His</b>, <b>to him</b> or <b>with him</b>? Look at the verb and the little word.</p>`,{btn:'Go'}),
  drill(()=>pick([()=>G.dmRole(),()=>G.dmRole(),()=>G.read({frame:'SGOV',G:dmX()}),()=>G.read({frame:'SDOV',D:dmA2(),dn:'s'}),()=>G.read({frame:'SCV',prep:'cum',acase:'abl',A:dmA2(),an:'s'}),()=>G.who({frame:'SDOV',D:dmA2(),dn:'s',idx:1}),()=>G.hearSent({frame:'SGOV',G:dmX()}),()=>G.hearSent({frame:'SCV',prep:'cum',acase:'abl',A:dmA2(),an:'s'}),()=>G.tap({frame:'SGOV',G:dmX(),idx:1})])(),8,26,'his, to him, with him'),
  T(`<h2>Now write it</h2>`,{btn:'Try it'}),
  ()=>G.form({frame:'SGOV',role:'G',S:'puella',G:'is',O:'rosa',v:'videt',order:'SXV',hint:true}),

{id:70,title:'They, them',min:12,steps:()=>[
  T(`<h2>Lesson 70 · They, them</h2><p>The plural of <b>is</b> / <b>ea</b>: <b>they</b>, <b>them</b>, <b>to them</b>, <b>with them</b>.</p>`,{btn:'Begin'}),

{id:73,title:'Armies and hands',min:12,steps:()=>[
  T(`<h2>Lesson 73 · Armies and hands</h2><p>A fourth kind of noun. <b>exercitus</b> (army) ends in <b>-us</b> like <b>amīcus</b>, but its other endings are different.</p><p class="mute">Three new words, then a table.</p>`,{btn:'Begin'}),
  wordTeach('exercitus'),wordTeach('impetus'),wordTeach('manus'),
  mcLat2En('exercitus',['impetus','manus','dux']),mcEn2Lat('impetus',['exercitus','manus','bellum']),mcLat2En('manus',['impetus','exercitus','pars']),()=>G.hearWord('exercitus',['impetus','manus','miles']),
  T(()=>`<h2>-us, -um, -ūs, -uī, -ū</h2><table class="tbl"><tr><th></th><th>exercitus</th><th>manus</th></tr>
    <tr><td>does it</td><td>exercit<span class="m">us</span></td><td>man<span class="m">us</span></td></tr>
    <tr><td>gets it</td><td>exercit<span class="m">um</span></td><td>man<span class="m">um</span></td></tr>
    <tr><td>of</td><td>exercit<span class="m">ūs</span></td><td>man<span class="m">ūs</span></td></tr>
    <tr><td>to / for</td><td>exercit<span class="m">uī</span></td><td>man<span class="m">uī</span></td></tr>
    <tr><td>with / by</td><td>exercit<span class="m">ū</span></td><td>man<span class="m">ū</span></td></tr></table>
    ${H('exercitus urbem videt.','The army sees the city.')}${H('dux exercitum vocāvit.','The leader called the army.')}${H('puella exercit'+'<span class="m">ūs</span>'+' impetum videt.','The girl sees the army’s attack.')}${H('rex exercit'+'<span class="m">uī</span>'+' dōnum dat.','The king gives a gift to the army.')}${H('dux cum exercit'+'<span class="m">ū</span>'+' ambulat.','The leader walks with the army.')}
    <div class="rule">The doer (<b>-us</b>) and receiver (<b>-um</b>) look like <b>amīcus</b> / <b>amīcum</b>. The difference is in <b>of</b>, <b>to</b> and <b>with</b>: <b>-ūs</b>, <b>-uī</b>, <b>-ū</b>. ${spk(['exercitus','exercitum','exercitūs','exercituī','exercitū'],'',true)}</div>

{id:74,title:'Many armies',min:11,steps:()=>[
  T(`<h2>Lesson 74 · Many armies</h2><p>Plural of the fourth declension: <b>-ūs</b> for doers and receivers, <b>-ibus</b> for “to” and “with”.</p>`,{btn:'Begin'}),

    <tr><td>does it</td><td>exercit<span class="m">us</span></td><td>exercit<span class="m">ūs</span></td></tr>
    <tr><td>gets it</td><td>exercit<span class="m">um</span></td><td>exercit<span class="m">ūs</span></td></tr>
    <tr><td>to / with</td><td>exercit<span class="m">uī</span> / exercit<span class="m">ū</span></td><td>exercit<span class="m">ibus</span></td></tr></table>
    ${H(hx('exercit','ūs')+' urbem '+hx('vide','nt')+'.','The armies see the city.')}${H('dux '+hx('exercit','ūs')+' vocāvit.','The leader called the armies.')}${H('rex '+hx('exercit','ibus')+' dōna dedit.','The king gave gifts to the armies.')}${H('dux cum '+hx('exercit','ibus')+' ambulat.','The leader walks with the armies.')}

{id:76,title:'Who, which',min:12,steps:()=>[
  T(`<h2>Lesson 76 · Who, which</h2><p>The word that ties one idea to another: <b>quī</b> (who, which). <i>The girl <b>who</b> loves the poet…</i> Caesar writes these on every page.</p>`,{btn:'Begin'}),
  quiTeach(),
  mcLat2En('qui',['ut','cum','in']),mcEn2Lat('qui',['cum','in','ad']),
  T(()=>`<h2>quī, quae, quod</h2><table class="tbl"><tr><th>Masc.</th><th>Fem.</th><th>Neuter</th></tr><tr><td>qu<span class="m">ī</span></td><td>qu<span class="m">ae</span></td><td>qu<span class="m">od</span></td></tr></table>
    ${H('puella '+hx('qu','ae')+' poetam amat rēgem videt.','The girl <b>who loves the poet</b> sees the king.')}${H('rex ducem '+hx('qu','ī')+' ambulat videt.','The king sees the leader <b>who walks</b>.')}${H('poeta puellam '+hx('qu','ae')+' ambulat laudat.','The poet praises the girl <b>who walks</b>.')}
    <div class="rule">The relative clause (<i>quae poetam amat</i>) goes <b>right after the noun it describes</b> (the <i>antecedent</i>). <b>quī / quae / quod</b> matches the antecedent in <b>gender and number</b>, and here it is the <b>doer</b> inside its own clause. ${spk(['puella','quae','poetam','amat'])}</div>
    <div class="note">Gender, not the ending, decides: <i>poeta</i> ends in <b>-a</b> but is masculine, so it takes <b>quī</b>: <i>poeta quī rēgem videt</i>.</div>`,{intro:['r:rel'],btn:'Practise',say:['puella','quae','poetam','amat']}),

  ()=>G.form(sr('2','n',{A:'dux',nA:'s',X:'rex',nX:'s',v:'videt',t:'pr',C:'puella',nC:'s',rv:'amat',rtn:'pr'},'SBV',{role:'Rq',hint:true,hl:false})),
  ()=>G.form(sr('1','n',{A:'poeta',nA:'s',X:'urbs',nX:'s',v:'videt',t:'pr',C:'rex',nC:'s',rv:'laudat',rtn:'pr'},'BOV',{role:'Rv',hint:true,hl:false})),

]},
{id:77,title:'Whom, which',min:12,steps:()=>[
  T(`<h2>Lesson 77 · Whom, which</h2><p>In the last lesson <b>quī</b> was the <b>doer</b> in its clause (<i>the girl who loves</i>). Often it is the <b>receiver</b>: <i>the girl <b>whom</b> the poet loves</i>.</p>`,{btn:'Begin'}),
  T(()=>`<h2>quem, quam, quod</h2><table class="tbl"><tr><th></th><th>Masc.</th><th>Fem.</th><th>Neuter</th></tr><tr><td>doer</td><td>qu<span class="m">ī</span></td><td>qu<span class="m">ae</span></td><td>qu<span class="m">od</span></td></tr><tr><td>receiver</td><td>qu<span class="m">em</span></td><td>qu<span class="m">am</span></td><td>qu<span class="m">od</span></td></tr></table>
    ${H('rex puellam '+hx('qu','am')+' poeta amat videt.','The king sees the girl <b>whom the poet loves</b>.')}${H('dux donum '+hx('qu','od')+' puella portat laudat.','The leader praises the gift <b>which the girl carries</b>.')}${H('puella '+hx('qu','am')+' rex vocat ambulat.','The girl <b>whom the king calls</b> walks.')}
    <div class="rule">Same gender and number as the antecedent, but the <b>case shows the job in its own clause</b>: <b>-m</b> (quem, quam) means <b>receiver</b>. The clause is <b>quam poeta amat</b>: receiver, doer, verb. ${spk(['puellam','quam','poeta','amat'])}</div>
    <div class="note"><b>quod</b> is the same for doing and getting (it is neuter, like <b>oppidum</b>). Then the other nouns in the clause tell you which.</div>`,{intro:['r:relacc'],btn:'Practise',say:['puellam','quam','poeta','amat']}),

  T(`<h2>Two jobs for one word</h2><p><b>quī / quae / quod</b> for the doer, <b>quem / quam / quod</b> for the receiver. The antecedent sets the gender; the clause sets the case.</p>`,{btn:'Finish'})

{id:78,title:'Who, many',min:11,steps:()=>[
  T(`<h2>Lesson 78 · Who, many</h2><p>When the antecedent is <b>many</b> (<i>the soldiers who…</i>), <b>quī</b> changes again.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Many doers, many receivers</h2><table class="tbl"><tr><th></th><th>Masc.</th><th>Fem.</th></tr><tr><td>doer, one</td><td>qu<span class="m">ī</span></td><td>qu<span class="m">ae</span></td></tr><tr><td>doers, many</td><td>qu<span class="m">ī</span></td><td>qu<span class="m">ae</span></td></tr><tr><td>receiver, one</td><td>qu<span class="m">em</span></td><td>qu<span class="m">am</span></td></tr><tr><td>receivers, many</td><td>qu<span class="m">ōs</span></td><td>qu<span class="m">ās</span></td></tr></table>
    ${H('dux mīlitēs '+hx('qu','ī')+' ambulant videt.','The leader sees the soldiers <b>who walk</b>.')}${H('rex puellās '+hx('qu','ās')+' poeta amat laudat.','The king praises the girls <b>whom the poet loves</b>.')}${H('mīlitēs '+hx('qu','ōs')+' rex vocat ambulant.','The soldiers <b>whom the king calls</b> walk.')}
    <div class="rule">Many doers: <b>quī</b> (masculine) / <b>quae</b> (feminine), the <b>same words as for one</b>: the verb shows many (<b>-nt</b>). Many receivers: <b>quōs</b> / <b>quās</b>. ${spk(['mīlitēs','quī','ambulant'])}</div>

{id:79,title:'When',min:12,steps:()=>[
  T(`<h2>Lesson 79 · When</h2><p>The <b>subjunctive</b>. Caesar’s long sentences often start with <b>cum</b> + a verb in a new form that means “<b>when</b>”: <i>cum rex urbem vidēret</i>, “when the king saw the city”.</p><p class="mute">The new form is easy to build.</p>`,{btn:'Begin'}),
  T(()=>`<h2>Infinitive + t</h2><table class="tbl"><tr><th>Infinitive</th><th>+ t / nt</th><th>Means</th></tr>
    <tr><td>amāre</td><td>amāre<span class="m">t</span></td><td class="mute">… loved</td></tr><tr><td>vidēre</td><td>vidēre<span class="m">t</span></td><td class="mute">… saw</td></tr><tr><td>audīre</td><td>audīre<span class="m">t</span></td><td class="mute">… heard</td></tr><tr><td>dare</td><td>dare<span class="m">t</span></td><td class="mute">… gave</td></tr><tr><td>ambulāre</td><td>ambulāre<span class="m">t</span></td><td class="mute">… walked</td></tr>
    <tr><td>vidēre</td><td>vidēre<span class="m">nt</span></td><td class="mute">(many) … saw</td></tr></table>
    ${H('<b>cum</b> rex urbem '+hx('vidēre','t')+', dux mīlitēs vocāvit.','<b>When</b> the king saw the city, the leader called the soldiers.')}${H('<b>cum</b> mīlitēs ambulāre'+'<span class="m">nt</span>'+', rex urbem vīdit.','<b>When</b> the soldiers walked, the king saw the city.')}
    <div class="rule"><b>cum</b> + the <b>infinitive + -t</b> (or <b>-nt</b> for many) = “when … did”. This verb form is the <b>imperfect subjunctive</b>. ${spk(['cum','rex','urbem','vidēret'])}</div>
    <div class="note"><b>cum</b> with a noun in the ablative still means “with” (<i>cum amīcō</i>). <b>cum</b> before a <b>clause</b> with this verb means “when”. The word after it tells you which.</div>`,{intro:['r:cum'],btn:'Next',say:['cum','rex','urbem','vidēret']}),

/* what a learner needs to know to read each sentence */
function sentNeeds(lat){
  const t=lat.replace('.','').split(' '),need=new Set();
  const an=t.map(x=>(FORMS[x]||[]).filter(z=>z.k==='v'||z.k==='p'||z.cl==='a'));
  const isV=i=>an[i].some(a=>a.k==='v');
  const plV=t.some((x,i)=>an[i].some(a=>a.k==='v'&&a.num==='p'));
  const datV=t.some(x=>x==='dat'||x==='dant');
  let nAE=0;
  t.forEach((x,i)=>{
    const a=an[i];if(!a.length)return;
    const lemma=a[0].n;
    if(a[0].k==='v'){need.add('w:'+lemma);if(lemma==='est')need.add('r:be');if(a.some(z=>z.num==='p'&&norm(vf(lemma,'p'))===norm(x)))need.add('r:pl');return}
    if(a[0].k==='p'){need.add('w:'+x);return}
    need.add('w:'+lemma);
    if(a[0].k==='a'){need.add('r:adj');return}
    if(a.some(z=>z.c==='acc'&&z.num==='s'))need.add('r:acc');
    if(a.some(z=>z.c==='acc'&&z.num==='p'))need.add('r:accpl');
    if(a.some(z=>z.c==='abl'))need.add('r:abl');
    if(a.some(z=>z.c==='gen'&&z.num==='s'))nAE++;
  });
  if(nAE){
    let gd=nAE;
    if(plV||t.includes('sunt')){need.add('r:pl');gd--}
    if(gd>0)need.add(datV?'r:dat':'r:gen');
    if(nAE>=2)need.add('r:ae3');
  }
  const nomish=i=>an[i].some(a=>a.c==='nom');
  if(!(nomish(0)&&isV(t.length-1)))need.add('r:order');
  return[...need];
}

    case'r:e5p':it=pick([()=>G.read(f1({frame:'SOV',O:'res',on:'p'})),()=>G.tap(f1({frame:'SOV',O:'res',on:'p',idx:1})),()=>G.paradigm({cn:['acc','p'],n:'res'}),()=>G.paradigm({cn:['dat','p'],n:'res'})])();break;

function startSession({lesson,reviews,extra}){
  const queue=[];
  shuffle(reviews).forEach(id=>queue.push(reviewItem(id)));
  (lesson?lesson.steps():[]).forEach(s=>queue.push(s));
  const total=queue.reduce((n,st)=>n+(st.kind==='drill'?(st.n||st.streak):1),0);
  SS={queue,inject:[],drill:null,res:{},lesson,extra:!!extra,start:Date.now(),total,doneUnits:0,
      first:{ok:0,n:0},shownAt:0,cur:null,unmastered:[],key:null};
  next();
}
function next(){
  if(SS.inject.length)return show(SS.inject.shift());
  if(SS.drill)return drillNext();
  if(!SS.queue.length)return finish(true);
  let st=SS.queue.shift();
  if(typeof st==='function'){try{st=st()}catch(e){console.error('item generator failed',e);return next()}}
  if(st.kind==='drill'){SS.drill={st,streak:0,tries:0};return drillNext()}
  if(!audioOn()&&isListen(st)){SS.doneUnits++;return next()}
  SS.doneUnits++;show(st);
}
function drillNext(){
  const d=SS.drill,st=d.st;
  const fin=st.n?d.tries>=st.n:d.streak>=st.streak;
  if(fin){SS.doneUnits+=st.n||st.streak;SS.drill=null;return next()}
  if(!st.n&&d.tries>=st.max){
    SS.doneUnits+=st.streak;SS.unmastered.push(st.label);SS.drill=null;
    return show(T(`<h2>Still a little shaky</h2><p>That is normal. This will come back soon, spaced out, which is how it becomes durable.</p>`,{btn:'Continue'}));
  }
  let it=null,guard=0;
  do{try{it=st.gen()}catch(e){console.error('drill generator failed',e);it=null}guard++}while((!it||(!audioOn()&&isListen(it)))&&guard<40);
  if(!it){d.tries=st.n?st.n:st.max;return drillNext()}
  it.fromDrill=true;show(it);
}
function record(item,ok,rt){
  if(item.retry||SS.extra||!item.kcs)return;
  SS.first.n++;if(ok)SS.first.ok++;
  item.kcs.forEach(id=>{const r=SS.res[id]||(SS.res[id]={ok:0,bad:0,slow:0});if(ok){r.ok++;if(item.review&&rt>12000)r.slow++}else r.bad++});
}
function finalizeKCs(){
  Object.entries(SS.res).forEach(([id,r])=>{
    const k=ensure(id);if(!k.intro)return;
    if(r.bad===0){k.box=r.slow>r.ok/2?k.box:Math.min(k.box+1,INT.length-1)}
    else if(r.ok>r.bad){k.box=Math.max(k.box,0)}
    else k.box=0;
    k.due=now()+INT[k.box]*DAY;
  });save();
}
function finish(complete){
  stopAudio();finalizeKCs();
  const before=S.unlocked.slice();
  STORIES.forEach(s=>{if(readable(s)&&!S.unlocked.includes(s.id))S.unlocked.push(s.id)});
  const newStories=STORIES.filter(s=>S.unlocked.includes(s.id)&&!before.includes(s.id));
  let lessonDone=null;
  if(complete&&SS.lesson){if(!S.done.includes(SS.lesson.id))S.done.push(SS.lesson.id);S.lastLessonDay=today();lessonDone=SS.lesson}
  if(complete&&!SS.extra){S.doneDay=today();S.sessions++}
  save();
  const mins=Math.max(1,Math.round((Date.now()-SS.start)/60000));
  const sum={complete,lessonDone,newStories,mins,first:SS.first,unm:SS.unmastered,extra:SS.extra};
  SS=null;
  if(complete)renderSummary(sum);else renderHome();
}

/* ---------- in-session rendering ---------- */
function frame(inner,eyebrow){
  const d=SS.drill,part=d?(d.st.n?d.tries:Math.min(d.streak,d.st.streak)):0;
  const pct=SS.total?Math.min(100,Math.round(100*(SS.doneUnits+part)/SS.total)):0;
  app.innerHTML=`<div class="top"><h1>Latin Lab</h1><button class="link" id="quit">End session</button></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card"><div class="eyebrow">${esc(eyebrow)}</div>${inner}</div>`;
  $('#quit').onclick=()=>{if(confirm('End this session? Progress on answered items is kept.'))finish(false)};
}
const eyebrowFor=it=>it.eyebrow||(SS.lesson?`Lesson ${SS.lesson.id} · ${SS.lesson.title}`:'Practice');
function show(it){
  SS.cur=it;SS.shownAt=Date.now();SS.key=null;stopAudio();it._sid=(window.__sid=(window.__sid||0)+1);
  ({teach:showTeach,mc:showMC,tap:showTap,type:showType,tiles:showTiles,arrow:showArrow})[it.kind](it);
  if(it.say&&S.opts.autoplay)setTimeout(()=>{if(SS&&SS.cur===it)say(it.say,{chant:it.chant})},250);
}
function showTeach(it){
  it.intro.forEach(introduce);
  const html=typeof it.html==='function'?it.html():it.html;
  frame(`${html}<div style="margin-top:18px"><button class="btn" id="go">${esc(it.btn)}</button></div>`,eyebrowFor(it));
  if(it.after)it.after();
  $('#go').onclick=()=>{if(it.onGo)it.onGo();next()};
}

let advTimer=null;
function clone(it){const c=Object.assign({},it);if(c.options)c.options=shuffle(c.options);if(c.tiles)c.tiles=shuffle(c.tiles);return c}
function remedySwap(it){
  const m=it.m;
  const t=T(`<h2>Check the endings</h2>${sentLine(m.ts,true)}<p>${remedyText(m)}</p><p class="mute">Order doesn’t matter. The endings decide.</p>`,{btn:'Try two quick ones'});
  const fx=Object.assign({},m.sp,{frame:m.sp.frame,order:m.order,hl:true,sn:m.sp.n.S,on:m.sp.n.O,adj:Object.assign({},m.sp.adj),af:Object.assign({},m.sp.af)});
  if(m.sp.P)fx.pred=Object.assign({},m.sp.P);
  const a=G.tap(Object.assign({},fx,{idx:0})),b=G.tap(Object.assign({},fx,{idx:1}));
  [a,b].forEach(x=>{x.retry=true;x.depth=1;x.eyebrow='Quick check'});
  return[t,a,b];
}
function resolve(it,ok,payload){
  clearTimeout(advTimer);
  const rt=Date.now()-SS.shownAt;
  record(it,ok,rt);
  if(it.fromDrill){SS.drill.tries++;SS.drill.streak=ok?SS.drill.streak+1:0}
  const box=$('#fb');
  if(ok){
    let msg=typeof it.okMsg==='function'?it.okMsg():it.okMsg;
    if(payload&&payload.note)msg+=`<br><span style="font-size:14px">${payload.note}</span>`;
    box.className='fb ok';box.innerHTML='✓ '+msg;
    advTimer=setTimeout(next,it.type==='w'?800:1300);
    $('#act').innerHTML=`<button class="btn sec" id="cont">Continue</button>`;
    $('#cont').onclick=()=>{clearTimeout(advTimer);next()};
  }else{
    const depth=it.depth||0;
    box.className='fb bad';box.innerHTML=it.badMsg(payload&&payload.value);
    const inj=[];
    if(depth<2){
      if(payload&&payload.tag==='swap'&&it.m&&it.kind!=='type')inj.push(...remedySwap(it));
      const c=clone(it);c.retry=true;c.depth=depth+1;c.eyebrow='Try it again';inj.push(c);
      if(!it.retry&&!it.fromDrill){const d=clone(it);d.retry=true;d.depth=1;d.eyebrow='Back again';SS.queue.splice(Math.min(2,SS.queue.length),0,d)}
    }
    $('#act').innerHTML=`<button class="btn" id="cont">Continue</button>`;
    $('#cont').onclick=()=>{SS.inject.unshift(...inj);next()};
    setTimeout(()=>{const c=$('#cont');c&&c.focus()},250);
  }
}
const actBar=()=>`<div id="fb"></div><div id="act" style="margin-top:12px"></div>`;

function showMC(it){
  frame(`${it.promptHTML}<p style="margin:6px 0 0">${it.subHTML||''}</p>
  <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>${actBar()}`,eyebrowFor(it));
  const btns=[...app.querySelectorAll('.opt')];let locked=false;
  const choose=i=>{
    if(locked)return;locked=true;const o=it.options[i];btns.forEach(b=>b.disabled=true);
    btns[i].classList.add(o.ok?'right':'wrong');
    if(!o.ok){const ri=it.options.findIndex(q=>q.ok);btns[ri].classList.add('right')}
    resolve(it,!!o.ok,{tag:o.tag});
  };
  btns.forEach((b,i)=>b.onclick=()=>choose(i));
  SS.key=e=>{const n=parseInt(e.key,10);if(n>=1&&n<=btns.length&&!locked)choose(n-1)};
}
function showTap(it){
  frame(`<p style="margin:0 0 4px;font-size:18px">${it.promptHTML}</p>
  <div class="words">${it.ts.map((t,i)=>`<button class="wbtn" data-i="${i}">${hlWord(t,it.hl)}</button>`).join('')}</div>${actBar()}`,eyebrowFor(it));

  btns.forEach((b,i)=>b.onclick=()=>{
    if(locked)return;locked=true;btns.forEach(x=>x.disabled=true);
    const ok=i===it.correct;b.classList.add(ok?'right':'wrong');if(!ok)btns[it.correct].classList.add('right');
    const r=it.ts[i].role;resolve(it,ok,{tag:ok?null:(r==='V'?'verb':r==='W'?null:/a$/.test(r)||r==='P'?'adj':'swap')});
  });
}
function showType(it){
  frame(`${it.promptHTML}<p style="margin:6px 0 10px">${it.subHTML}</p>
  <input type="text" id="inp" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  ${it.hintHTML?`<div class="hint">${it.hintHTML}</div>`:''}
  <div id="fb"></div><div id="act" style="margin-top:12px"><button class="btn" id="chk">Check</button></div>`,eyebrowFor(it));
  const inp=$('#inp');inp.focus();let locked=false;
  const check=()=>{if(locked||!inp.value.trim())return;locked=true;inp.disabled=true;resolve(it,it.answers.includes(norm(inp.value)),{value:inp.value})};
  $('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function showTiles(it){
  frame(`${it.promptHTML}<p style="margin:6px 0 0">${it.subHTML}</p>
  <div class="slot" id="slot"></div><div class="bank" id="bank"></div>
  <div id="fb"></div><div id="act" style="margin-top:12px"><button class="btn" id="chk" disabled>Check</button></div>`,eyebrowFor(it));
  let sel=[],locked=false;
  const draw=()=>{
    $('#slot').innerHTML=sel.map((t,i)=>`<button class="tile" data-s="${i}">${esc(t)}</button>`).join('');
    $('#bank').innerHTML=it.tiles.filter(t=>!sel.includes(t)).map(t=>`<button class="tile" data-t="${esc(t)}">${esc(t)}</button>`).join('');
    $('#chk').disabled=sel.length!==it.need;
    app.querySelectorAll('#slot .tile').forEach(b=>b.onclick=()=>{if(locked)return;sel.splice(+b.dataset.s,1);draw()});
    app.querySelectorAll('#bank .tile').forEach(b=>b.onclick=()=>{if(locked||sel.length>=it.need)return;sel.push(b.dataset.t);draw()});
  };
  draw();
  $('#chk').onclick=()=>{if(locked||sel.length!==it.need)return;locked=true;const r=it.check(sel);resolve(it,r.ok,{value:sel,note:r.note})};
}
function showArrow(it){
  frame(`<p style="margin:0 0 4px;font-size:18px">${it.promptHTML}</p>
  <div class="abox" id="abox"><svg class="asvg" id="asvg"></svg><div class="words">${it.ts.map((t,i)=>`<button class="wbtn" data-i="${i}">${hlWord(t,it.hl)}</button>`).join('')}</div></div>${actBar()}`,eyebrowFor(it));
  const box=$('#abox'),svg=$('#asvg'),btns=[...box.querySelectorAll('.wbtn')];
  let drag=null,pend=null,locked=false;
  const ctr=b=>{const r=b.getBoundingClientRect(),p=box.getBoundingClientRect();return{x:r.left-p.left+r.width/2,y:r.top-p.top+r.height/2}};
  const line=(a,b,col)=>{
    const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,pad=Math.min(26,L/3);
    svg.innerHTML=`<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="${col}"/></marker></defs>
    <line x1="${a.x+ux*pad}" y1="${a.y+uy*pad}" x2="${b.x-ux*pad}" y2="${b.y-uy*pad}" stroke="${col}" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/>`;
  };
  const done=(f,t)=>{
    locked=true;btns.forEach(b=>b.classList.remove('sel'));
    const ok=it.ts[f].role===it.fromRole&&it.ts[t].role===it.toRole;
    line(ctr(btns[f]),ctr(btns[t]),ok?'#2f6b4a':'#a23b2a');
    btns[f].classList.add(ok?'right':'wrong');btns[t].classList.add(ok?'right':'wrong');
    resolve(it,ok,{tag:ok?null:'swap'});
  };
  box.onpointerdown=e=>{const b=e.target.closest('.wbtn');if(!b||locked)return;try{box.setPointerCapture(e.pointerId)}catch(_){}drag=+b.dataset.i};
  box.onpointermove=e=>{if(drag===null||locked)return;const p=box.getBoundingClientRect();line(ctr(btns[drag]),{x:e.clientX-p.left,y:e.clientY-p.top},'#8a2b2b')};
  box.onpointerup=e=>{
    if(drag===null||locked)return;
    const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest&&el.closest('.wbtn'),from=drag;drag=null;
    const to=b?+b.dataset.i:null;
    if(to!==null&&to!==from){pend=null;done(from,to)}
    else if(to===from){
      if(pend===null){pend=from;btns[from].classList.add('sel');svg.innerHTML=''}
      else if(pend!==from){const p=pend;pend=null;done(p,from)}
      else{pend=null;btns[from].classList.remove('sel')}
    }else svg.innerHTML='';
  };
}

function renderLibrary(){

    }
    return`<div class="card story" data-id="${s.id}"><div class="eyebrow">Readable${S.read[s.id]?' · read':''}</div><h2>${esc(s.title)}</h2>
    <p class="mute sans" style="font-size:13px;margin:0 0 6px">Read each line, translate it in your head, then tap to check. Use 🔊 to hear it, then say it aloud.</p>

  }).join('');
  app.innerHTML=`<div class="top"><h1>Library</h1><button class="link" id="back">Back</button></div>
  <p class="mute sans" style="font-size:14px">Texts written within what you know. A small stand-in: the full course would open real Latin the same way.</p>${cards}`;
  $('#back').onclick=renderHome;

  $('#back').onclick=renderHome;
  app.querySelectorAll('#vseg button').forEach(b=>b.onclick=()=>{S.opts.voice=b.dataset.v;save();stopAudio();unlockAudio();renderSettings();if(S.opts.voice!=='off')setTimeout(()=>say(['puella','poetam','amat']),150)});
  const vsel=$('#vsel');if(vsel)vsel.onchange=()=>{S.opts.deviceVoice=vsel.value;save();renderSettings();setTimeout(()=>say(['puella','poetam','amat']),150)};
  $('#hear').onclick=()=>{unlockAudio();say(['puella','poetam','amat'])};
  app.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{S.opts[b.dataset.t]=!S.opts[b.dataset.t];save();renderSettings()});
  app.querySelectorAll('#dest button').forEach(b=>b.onclick=()=>{S.pref=b.dataset.k;save();renderSettings()});
  app.querySelectorAll('#pace button').forEach(b=>b.onclick=()=>{S.pacing=b.dataset.k;save();renderSettings()});
  $('#adv').onclick=()=>{S.off+=1;save();renderSettings()};
  $('#adv3').onclick=()=>{S.off+=7;save();renderSettings()};
  $('#rst').onclick=()=>{if(confirm('Erase all progress?')){const o=S.opts;S=fresh();S.opts=o;save();renderHome()}};
}
